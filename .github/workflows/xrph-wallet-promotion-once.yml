name: XRPH Wallet one-shot canonical promotion

on:
  push:
    branches:
      - promotion/xrph-wallet-20260906

permissions:
  contents: write

jobs:
  promote:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promotion/xrph-wallet-20260906
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund

      - name: Fetch reviewed frozen candidate
        run: |
          curl -fsSL "https://raw.githubusercontent.com/badjoke-lab/cryptocurrency-wallet-lifecycle-registry/06786c5eb53f7361722050b58593ef524f7a09e5/data-staging/candidates/xrph-wallet-2026-09-06.json" -o /tmp/xrph-wallet-candidate.json

      - name: Render canonical promotion from fresh main
        run: |
          rm -rf /tmp/xrph-promoted
          python3 scripts/render_candidate_promotion.py \
            --candidate /tmp/xrph-wallet-candidate.json \
            --output-dir /tmp/xrph-promoted
          cp /tmp/xrph-promoted/entities.json data/entities.json
          cp /tmp/xrph-promoted/products.json data/products.json
          cp /tmp/xrph-promoted/events.json data/events.json
          cp /tmp/xrph-promoted/evidence.json data/evidence.json

      - name: Validate canonical promotion
        run: |
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:structured-discovery
          npm run test:natural-filters
          npm run validate:natural-filters
          npm run validate:compare
          npm run validate:stats
          npm run validate:series
          npm run build

      - name: Self-clean and commit validated promotion
        run: |
          rm -f .github/workflows/xrph-wallet-promotion-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No promotion diff produced"; exit 1; }
          git commit -m "Promote XRPH Wallet compromise to canonical data"
          git push origin HEAD:promotion/xrph-wallet-20260906
