name: Stage reviewed Rainbow Extension launch year

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/rainbow-extension-launch-year'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/rainbow-extension-launch-year
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const product = products.find(x => x.id === 'wlr_prod_000058');
          if (!product || product.entity_id !== 'wlr_ent_000019' || product.slug !== 'rainbow-browser-extension') throw new Error('Unexpected Rainbow Extension identity');
          if (product.launch_date !== null && product.launch_date !== '2023') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2023';
          product.launch_date_precision = 'year';
          product.last_verified_at = '2026-08-18';
          product.notes = "Rainbow's official browser-extension repository shows Chrome Web Store and publishing preparation during 2022, but WLR does not treat those preparation commits as launch evidence. The repository explicitly enters a Production version-bump lineage in 2023, beginning with reviewed v1.0.75 production history on 2023-03-18, and Rainbow's own public updates site publishes extension release notes during 2023. WLR therefore records 2023 at year precision without asserting one exact first store-release day.";

          const ev = {
            id:'wlr_ev_000109', entity_id:'wlr_ent_000019', product_id:'wlr_prod_000058', affected_product_ids:['wlr_prod_000058'],
            event_type:'product_released', event_date:'2023', event_date_basis:'release',
            title:'Rainbow Browser Extension released in 2023',
            description:"Rainbow's official extension repository records a production release lineage in 2023, and Rainbow's public release-notes site independently confirms the extension's public release lineage during that year.",
            confidence:'high', event_status_effect:'active', is_major_event:true,
            notes:'Year precision only. 2022 Chrome Web Store manifest and publish-workflow preparation are not treated as launch evidence; neither the first reviewed Production version bump nor a later public release-note date is asserted as the exact initial store launch day.'
          };
          const oldEv = events.find(x => x.id === ev.id);
          if (oldEv && JSON.stringify(oldEv) !== JSON.stringify(ev)) throw new Error('wlr_ev_000109 collision');
          if (!oldEv) events.push(ev);

          const src1 = {
            id:'wlr_src_000171', entity_id:'wlr_ent_000019', product_id:'wlr_prod_000058', event_id:'wlr_ev_000109',
            source_type:'source_code', title:'Rainbow Browser Extension Production version bump v1.0.75',
            url:'https://github.com/rainbow-me/browser-extension/commit/c66590173eeb339226f1c590f68facfd75a90f09', publisher:'Rainbow', published_at:'2023-03-18', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'Official Rainbow browser-extension repository commit explicitly marked Version Bump (Production) - v1.0.75. Used to establish the 2023 production-release lineage, not as proof of the exact first Chrome Web Store launch day.'
          };
          const src2 = {
            id:'wlr_src_000172', entity_id:'wlr_ent_000019', product_id:'wlr_prod_000058', event_id:'wlr_ev_000109',
            source_type:'release_notes', title:'Rainbow Extension v1.2.39 — Bridging and Testnets',
            url:'https://rainbow.me/updates/extension-v1-2-39', publisher:'Rainbow', published_at:'2023-10-11', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'First-party public Rainbow extension release notes during 2023. Used as independent first-party corroboration of the public release lineage in that year, not as the initial launch-day assertion.'
          };
          for (const src of [src1, src2]) {
            const old = evidence.find(x => x.id === src.id);
            if (old && JSON.stringify(old) !== JSON.stringify(src)) throw new Error(`${src.id} collision`);
            if (!old) evidence.push(src);
          }

          write('data/products.json', products);
          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_prod_000058") | .launch_date == "2023" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000109") | .entity_id == "wlr_ent_000019" and .product_id == "wlr_prod_000058" and .event_type == "product_released" and .event_date == "2023" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000171") | .event_id == "wlr_ev_000109" and .source_type == "source_code" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000172") | .event_id == "wlr_ev_000109" and .source_type == "release_notes" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed Rainbow Extension launch year'
          git push origin HEAD:review/rainbow-extension-launch-year
