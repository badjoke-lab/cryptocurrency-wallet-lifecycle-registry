name: Stage reviewed Passport Core launch history

on:
  push:
    branches: [data/passport-core-launch-history]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/passport-core-launch-history
          fetch-depth: 0

      - name: Add Passport Core launch month, event, and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          products_path=Path('data/products.json')
          events_path=Path('data/events.json')
          evidence_path=Path('data/evidence.json')
          products=json.loads(products_path.read_text())
          events=json.loads(events_path.read_text())
          evidence=json.loads(evidence_path.read_text())

          assert len(products)==74 and len(events)==89 and len(evidence)==147
          p=next(x for x in products if x['id']=='wlr_prod_000051')
          assert p['entity_id']=='wlr_ent_000017' and p['slug']=='passport-core'
          assert p['product_name']=='Passport Core'
          assert 'Passport Batch 2' in p.get('aliases',[])
          assert p['predecessor_product_id']=='wlr_prod_000050'
          assert p.get('launch_date') is None and p.get('launch_date_precision') in (None,'approximate')
          assert any(e['id']=='wlr_ev_000051' and e['event_type']=='rebranded' and e['product_id']=='wlr_prod_000051' for e in events)
          assert not any(e.get('product_id')=='wlr_prod_000051' and e.get('event_type')=='product_released' for e in events)
          assert 'wlr_ev_000090' not in {e['id'] for e in events}
          assert 'wlr_src_000148' not in {s['id'] for s in evidence}

          lines=products_path.read_text().splitlines()
          idx=[i for i,line in enumerate(lines) if '"id":"wlr_prod_000051"' in line]
          assert len(idx)==1
          i=idx[0]
          assert '"launch_date":null' in lines[i]
          lines[i]=lines[i].replace('"launch_date":null','"launch_date":"2022-03","launch_date_precision":"month"',1)
          products_path.write_text('\n'.join(lines)+'\n')

          def append_rows(path, rows):
              text=path.read_text(); stripped=text.rstrip(); assert stripped.endswith(']')
              body=stripped[:-1].rstrip()
              addition=',\n'+',\n'.join(json.dumps(row,ensure_ascii=False,separators=(',',':')) for row in rows)+'\n]'
              path.write_text(body+addition+'\n')

          event={
            'id':'wlr_ev_000090',
            'entity_id':'wlr_ent_000017',
            'product_id':'wlr_prod_000051',
            'affected_product_ids':['wlr_prod_000051'],
            'event_type':'product_released',
            'event_date':'2022-03',
            'event_date_basis':'release',
            'title':'Second-generation Passport launched as Passport Batch 2',
            'description':'Foundation later stated that it launched its second-generation Passport device in March 2022. This second-generation product was originally known as Passport Batch 2 and was renamed Passport Core in 2025.',
            'confidence':'high',
            'event_status_effect':'active',
            'is_major_event':True,
            'notes':'WLR records month precision only. The contemporaneous March 10, 2022 Batch 2 announcement was still at the presale stage, so that announcement date is not treated as an exact shipment or general-availability day.'
          }
          source={
            'id':'wlr_src_000148',
            'entity_id':'wlr_ent_000017',
            'product_ids':['wlr_prod_000051'],
            'event_ids':['wlr_ev_000090'],
            'product_id':'wlr_prod_000051',
            'event_id':'wlr_ev_000090',
            'source_type':'official_blog',
            'title':'Announcing Our $7M Seed Round',
            'url':'https://foundation.xyz/2022/12/announcing-our-7m-seed-round/',
            'publisher':'Foundation',
            'published_at':'2022-12-19',
            'accessed_at':'2026-08-17',
            'reliability':'high',
            'claim_scope':'launch_date',
            'is_primary':True,
            'notes':'First-party Foundation retrospective explicitly stating that in March 2022 Foundation launched its second-generation Passport device.'
          }
          append_rows(events_path,[event])
          append_rows(evidence_path,[source])
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted Passport Core batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          p=next(x for x in products if x['id']=='wlr_prod_000051')
          assert p['launch_date']=='2022-03' and p['launch_date_precision']=='month'
          assert p['predecessor_product_id']=='wlr_prod_000050' and 'Passport Batch 2' in p['aliases']
          founder=next(x for x in products if x['id']=='wlr_prod_000050')
          assert founder['launch_date']=='2020' and founder['successor_product_id']=='wlr_prod_000051'
          e=next(x for x in events if x['id']=='wlr_ev_000090')
          assert e['entity_id']=='wlr_ent_000017' and e['product_id']=='wlr_prod_000051'
          assert e['event_type']=='product_released' and e['event_date']=='2022-03' and e['event_date_basis']=='release'
          assert any(x['id']=='wlr_ev_000051' and x['event_type']=='rebranded' for x in events)
          s=next(x for x in evidence if x['id']=='wlr_src_000148')
          assert s['product_id']=='wlr_prod_000051' and s['event_id']=='wlr_ev_000090'
          assert s['source_type']=='official_blog' and s['claim_scope']=='launch_date' and s['reliability']=='high' and s['is_primary'] is True
          assert len(products)==74 and len(events)==90 and len(evidence)==148
          launch_known=sum(p.get('launch_date') not in (None,'') for p in products)
          assert launch_known==53
          print('PASSPORT_CORE_LAUNCH_STAGE_OK products=74 events=90 evidence=148 launch_coverage_expected=53/74')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed Passport Core launch history'
          git push origin HEAD:data/passport-core-launch-history
