name: Apply XRPH Wallet wind-down record once

on:
  push:
    branches:
      - feat/xrph-wallet-winddown-20260910
    paths:
      - '.github/workflows/apply-xrph-winddown-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xrph-wallet-winddown-20260910
          fetch-depth: 0

      - name: Append reviewed XRPH lifecycle records
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          event = {
            "id": "wlr_ev_000268",
            "entity_id": "wlr_ent_000103",
            "product_id": "wlr_prod_000152",
            "affected_product_ids": ["wlr_prod_000152"],
            "event_type": "service_shutdown",
            "event_date": "2026-09-10",
            "event_date_basis": "announcement",
            "title": "XRP Healthcare began winding down normal operations while XRPH Wallet remained offline",
            "description": "XRP Healthcare announced that it had begun winding down normal operations after nearly three years, citing accumulated operating and public-listing costs and additional pressure from the September 3 XRPH Wallet incident. The company said XRPH Wallet remained offline while incident-recovery work would continue and XRPH and XRPHAI delistings were being coordinated with exchange partners.",
            "confidence": "high",
            "impact_level": "critical",
            "event_status_effect": "limited",
            "is_major_event": True,
            "notes": "This records the operator wind-down and continued wallet-offline boundary, not a confirmed permanent discontinuation of XRPH Wallet. XRP Healthcare said incident recovery, cooperation, record preservation, and material updates would continue. Canonical entity and product statuses therefore remain limited pending an explicit permanent wallet shutdown, app withdrawal, or support-end boundary."
          }

          evidence = [
            {
              "id": "wlr_src_000546",
              "entity_id": "wlr_ent_000103",
              "product_id": "wlr_prod_000152",
              "event_id": "wlr_ev_000268",
              "source_type": "official_social",
              "title": "XRP Healthcare operational wind-down statement",
              "url": "https://x.com/XRPHealthcare",
              "publisher": "XRP Healthcare",
              "published_at": "2026-09-10",
              "accessed_at": "2026-09-10",
              "reliability": "medium",
              "claim_scope": "event",
              "is_primary": True,
              "notes": "Primary XRP Healthcare statement reviewed for the 2026-09-10 operational wind-down, continued XRPH Wallet offline state, incident-recovery commitments, and coordinated XRPH/XRPHAI delistings. The exact post permalink was not independently resolvable during review, so the official account URL is retained temporarily and should be replaced with the exact status URL when resolved."
            },
            {
              "id": "wlr_src_000547",
              "entity_id": "wlr_ent_000103",
              "product_id": "wlr_prod_000152",
              "event_id": "wlr_ev_000268",
              "source_type": "official_statement",
              "title": "MEXC Announcement on ST Warning (September 2026)",
              "url": "https://www.mexc.com/announcements/article/mexc-announcement-on-st-warning-september-2026-17827791538064",
              "publisher": "MEXC",
              "published_at": "2026-09-01",
              "accessed_at": "2026-09-10",
              "reliability": "high",
              "claim_scope": "event",
              "is_primary": False,
              "notes": "Official exchange notice corroborating the delisting path described by XRP Healthcare. MEXC lists XRPHAI under ST on 2026-09-09 with estimated delisting 2026-09-12 and XRPH under ST on 2026-09-09 with estimated delisting 2026-09-16. Used only to corroborate the exchange-delisting component, not to establish permanent wallet discontinuation."
            }
          ]

          def append_rows(path_str, rows):
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              parsed = json.loads(text)
              ids = {row.get("id") for row in parsed}
              for row in rows:
                  if row["id"] in ids:
                      raise SystemExit(f"duplicate id before append: {row['id']}")
              body = text.rstrip()
              if not body.endswith("]"):
                  raise SystemExit(f"expected top-level JSON array: {path}")
              body = body[:-1].rstrip()
              serialized = []
              for row in rows:
                  serialized.append(textwrap.indent(json.dumps(row, ensure_ascii=False, indent=2), "  "))
              if body.endswith("["):
                  out = body + "\n" + ",\n".join(serialized) + "\n]\n"
              else:
                  out = body + ",\n" + ",\n".join(serialized) + "\n]\n"
              json.loads(out)
              path.write_text(out, encoding="utf-8")

          append_rows("data/events.json", [event])
          append_rows("data/evidence.json", evidence)
          PY

      - name: Validate canonical records
        run: |
          python3 -m pip install -r requirements.txt
          npm install --no-audit --no-fund
          npm run validate:records
          npm run validate:identity-evidence
          npm run coverage:audit

      - name: Commit canonical data update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/evidence.json
          git diff --cached --check
          git commit -m "Record XRP Healthcare operational wind-down"
          git push origin HEAD:feat/xrph-wallet-winddown-20260910
