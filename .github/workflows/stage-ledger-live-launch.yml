name: Stage reviewed Ledger Live launch history

on:
  push:
    branches: [data/ledger-live-launch-history]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/ledger-live-launch-history
          fetch-depth: 0

      - name: Add Ledger Live launch date, event, and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          products_path=Path('data/products.json')
          events_path=Path('data/events.json')
          evidence_path=Path('data/evidence.json')

          products=json.loads(products_path.read_text())
          events=json.loads(events_path.read_text())
          evidence=json.loads(evidence_path.read_text())
          assert len(products)==69 and len(events)==83 and len(evidence)==139
          product=next(p for p in products if p['id']=='wlr_prod_000013')
          assert product['product_name']=='Ledger Wallet'
          assert 'Ledger Live' in product.get('aliases',[])
          assert product.get('launch_date') is None
          assert product.get('launch_date_precision')=='approximate'
          assert any(e['id']=='wlr_ev_000018' and e['event_type']=='rebranded' and e['product_id']=='wlr_prod_000013' for e in events)
          assert 'wlr_ev_000084' not in {e['id'] for e in events}
          assert 'wlr_src_000140' not in {s['id'] for s in evidence}

          # Preserve existing products.json formatting; only edit the one compact product row.
          lines=products_path.read_text().splitlines()
          matches=[i for i,line in enumerate(lines) if '"id":"wlr_prod_000013"' in line]
          assert len(matches)==1
          i=matches[0]
          old='"launch_date":null,"launch_date_precision":"approximate"'
          new='"launch_date":"2018-07-09","launch_date_precision":"day"'
          assert old in lines[i]
          lines[i]=lines[i].replace(old,new,1)
          products_path.write_text('\n'.join(lines)+'\n')

          def append_rows(path, rows):
              text=path.read_text()
              stripped=text.rstrip()
              assert stripped.endswith(']')
              body=stripped[:-1].rstrip()
              addition=',\n'+',\n'.join(json.dumps(row,ensure_ascii=False,separators=(',',':')) for row in rows)+'\n]'
              path.write_text(body+addition+'\n')

          event={
            'id':'wlr_ev_000084',
            'entity_id':'wlr_ent_000002',
            'product_id':'wlr_prod_000013',
            'affected_product_ids':['wlr_prod_000013'],
            'event_type':'product_released',
            'event_date':'2018-07-09',
            'event_date_basis':'release',
            'title':'Ledger Live launched as Ledger companion application',
            'description':'Ledger launched Ledger Live as a new all-in-one companion application for Ledger devices on Windows, Mac, and Linux. The same product lineage was later renamed Ledger Wallet in 2025.',
            'confidence':'high',
            'event_status_effect':'active',
            'is_major_event':True,
            'notes':'This launch event belongs to the existing Ledger Wallet product lineage, which retains Ledger Live as a historical alias. The later 2025 rebrand event remains separate.'
          }
          source={
            'id':'wlr_src_000140',
            'entity_id':'wlr_ent_000002',
            'product_ids':['wlr_prod_000013'],
            'event_ids':['wlr_ev_000084'],
            'product_id':'wlr_prod_000013',
            'event_id':'wlr_ev_000084',
            'source_type':'official_blog',
            'title':'Ledger launches Ledger Live, the all-in-one companion app to your Ledger device',
            'url':'https://www.ledger.com/ledger-launches-ledger-live-the-all-in-one-companion-app-to-your-ledger-device',
            'publisher':'Ledger',
            'published_at':'2018-07-09',
            'accessed_at':'2026-08-17',
            'reliability':'high',
            'claim_scope':'launch_date',
            'is_primary':True,
            'notes':'First-party Ledger launch announcement explicitly introducing Ledger Live as the new all-in-one companion application.'
          }
          append_rows(events_path,[event])
          append_rows(evidence_path,[source])
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted Ledger batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          p=next(x for x in products if x['id']=='wlr_prod_000013')
          assert p['launch_date']=='2018-07-09' and p['launch_date_precision']=='day'
          assert p['product_name']=='Ledger Wallet' and 'Ledger Live' in p['aliases']
          e=next(x for x in events if x['id']=='wlr_ev_000084')
          assert e['event_type']=='product_released' and e['event_date']=='2018-07-09' and e['event_date_basis']=='release'
          assert e['product_id']=='wlr_prod_000013' and e['entity_id']=='wlr_ent_000002'
          s=next(x for x in evidence if x['id']=='wlr_src_000140')
          assert s['product_id']=='wlr_prod_000013' and s['event_id']=='wlr_ev_000084'
          assert s['source_type']=='official_blog' and s['claim_scope']=='launch_date' and s['reliability']=='high' and s['is_primary'] is True
          assert len(products)==69 and len(events)==84 and len(evidence)==140
          print('LEDGER_LIVE_LAUNCH_STAGE_OK products=69 events=84 evidence=140 launch_coverage_expected=48/69 incidents=18 remediation=7')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed Ledger Live launch history'
          git push origin HEAD:data/ledger-live-launch-history
