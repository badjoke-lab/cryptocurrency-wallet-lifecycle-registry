name: Apply IZAKA-YA Wallet once
on:
  push:
    branches:
      - agent/izakaya-wallet-material-concerns
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/izakaya-wallet-material-concerns
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: node scripts/apply-izakaya-wallet-record.mjs
      - run: npm run validate:records
      - run: npm run validate:identity-evidence
      - run: npm run build
      - name: Remove one-shot machinery
        run: git rm .github/workflows/apply-izakaya-wallet-once.yml scripts/apply-izakaya-wallet-record.mjs
      - name: Commit bounded canonical result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data public
          git commit -m "data: add IZAKA-YA Wallet canonical record"
          git push origin HEAD:agent/izakaya-wallet-material-concerns
