name: Normalize Zengo security batch diff

on:
  push:
    branches: [data/zengo-bitforge-security-history]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/zengo-bitforge-security-history
          fetch-depth: 0
      - name: Restore main formatting and append only reviewed records
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          current_events=json.loads(ep.read_text())
          current_sources=json.loads(sp.read_text())
          new_events=[row for row in current_events if row['id'] in {'wlr_ev_000077','wlr_ev_000078'}]
          new_sources=[row for row in current_sources if row['id'] in {'wlr_src_000126','wlr_src_000127','wlr_src_000128','wlr_src_000129'}]
          assert len(new_events)==2 and len(new_sources)==4
          subprocess.run(['git','checkout','origin/main','--','data/events.json','data/evidence.json'], check=True)

          def append_rows(path, rows):
              text=path.read_text()
              stripped=text.rstrip()
              assert stripped.endswith(']')
              body=stripped[:-1].rstrip()
              assert body
              addition=',\n' + ',\n'.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) for row in rows) + '\n]'
              path.write_text(body + addition + '\n')

          append_rows(ep, new_events)
          append_rows(sp, new_sources)
          PY
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py
          git diff -- data/events.json data/evidence.json
      - name: Commit normalized diff
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events.json data/evidence.json
          git commit -m 'Normalize Zengo security history diff'
          git push origin HEAD:data/zengo-bitforge-security-history
