name: Promote Wave 01A
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/promote_wave_01a.py'
      - '.github/workflows/promote-wave-01a.yml'
permissions:
  contents: write
jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/promote_wave_01a.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/events.json data/evidence.json
          git commit -m 'Promote coverage recovery wave 01A canonical' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
