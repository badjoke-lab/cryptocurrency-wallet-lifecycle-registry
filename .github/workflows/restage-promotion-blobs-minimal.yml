name: Restage promotion blobs minimal
on:
  push:
    branches: [agent/growth-batch-2]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'badjoke-lab/cryptocurrency-wallet-lifecycle-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore pre-promotion canonical input and candidate in workspace only
        env:
          SOURCE_COMMIT: 08352419b83f478340e3b9371fe4adbf386a4abc
        run: |
          git show "$SOURCE_COMMIT:data/entities.json" > data/entities.json
          git show "$SOURCE_COMMIT:data/products.json" > data/products.json
          git show "$SOURCE_COMMIT:data/events.json" > data/events.json
          git show "$SOURCE_COMMIT:data/evidence.json" > data/evidence.json
          git show "$SOURCE_COMMIT:data-staging/candidates/growth-batch-2.json" > /tmp/growth-batch-2.json
      - run: python scripts/render_candidate_promotion.py --candidate /tmp/growth-batch-2.json --output-dir promotion-preview-minimal
      - name: Validate rendered record counts
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('promotion-preview-minimal')
          expected = {'entities.json':16,'products.json':49,'events.json':49,'evidence.json':72}
          for name, count in expected.items():
              rows = json.loads((root/name).read_text())
              assert len(rows) == count, (name, len(rows), count)
              print(f'COUNT {name} {len(rows)}')
          PY
      - name: Create unattached minimal-diff Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          root = pathlib.Path('promotion-preview-minimal')
          result = {}
          for name in ['entities.json','products.json','events.json','evidence.json']:
              raw = (root/name).read_bytes()
              payload = json.dumps({'content':base64.b64encode(raw).decode('ascii'),'encoding':'base64'}).encode()
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization':f'Bearer {token}',
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'Content-Type':'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = json.load(response)
              result[name] = {'sha':body['sha'],'bytes':len(raw)}
              print(f"MINIMAL_BLOB {name} {body['sha']} {len(raw)}")
          pathlib.Path('minimal-promotion-blobs.json').write_text(json.dumps(result, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wlr-growth-batch-2-minimal-promotion-blobs
          path: minimal-promotion-blobs.json
          if-no-files-found: error
          retention-days: 7
