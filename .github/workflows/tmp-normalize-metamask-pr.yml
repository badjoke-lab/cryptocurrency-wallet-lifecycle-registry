name: Normalize MetaMask canonical diff

on:
  push:
    branches:
      - data/metamask-company-rebrand-20260910

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message != 'Normalize MetaMask canonical update diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/metamask-company-rebrand-20260910
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild canonical files from main with minimal byte changes
        shell: bash
        run: |
          git fetch origin main
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          def main_text(path):
              return subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)

          def replace_in_record(raw, record_id, replacements):
              needle = f'"id": "{record_id}"'
              pos = raw.index(needle)
              start = raw.rfind('  {', 0, pos)
              end = raw.find('\n  },', pos)
              if end == -1:
                  end = raw.find('\n  }\n]', pos)
                  end += len('\n  }')
              else:
                  end += len('\n  }')
              block = raw[start:end]
              for old, new in replacements:
                  if block.count(old) != 1:
                      raise SystemExit(f'expected one occurrence in {record_id}: {old!r}, got {block.count(old)}')
                  block = block.replace(old, new, 1)
              return raw[:start] + block + raw[end:]

          def append_records(raw, records):
              stripped = raw.rstrip()
              if not stripped.endswith(']'):
                  raise SystemExit('canonical JSON is not a top-level array')
              prefix = stripped[:-1].rstrip()
              rendered = []
              for record in records:
                  text = json.dumps(record, ensure_ascii=False, indent=2)
                  rendered.append('\n'.join('  ' + line for line in text.splitlines()))
              separator = '' if prefix.endswith('[') else ','
              out = prefix + separator + '\n' + ',\n'.join(rendered) + '\n]\n'
              json.loads(out)
              return out

          entities = main_text('data/entities.json')
          entities = replace_in_record(entities, 'wlr_ent_000004', [
              ('"developer_or_company": "Consensys"', '"developer_or_company": "MetaMask"'),
              ('"last_verified_at": "2026-08-14"', '"last_verified_at": "2026-09-10"'),
              ('"notes": "Browser extension and mobile app are separate products because their distribution and security boundaries differ."',
               '"notes": "Browser extension and mobile app are separate products because their distribution and security boundaries differ. On 2026-09-09 Consensys Software Inc. announced that it would continue as the same company under the MetaMask name, while the protocols and institutional infrastructure business would become a newly formed company carrying the Consensys name; completion of the separation is expected by the end of 2026."')
          ])

          products = main_text('data/products.json')
          for pid in ('wlr_prod_000019', 'wlr_prod_000020'):
              products = replace_in_record(products, pid, [
                  ('"last_verified_at": "2026-08-14"', '"last_verified_at": "2026-09-10"')
              ])

          event = {
              'id': 'wlr_ev_000267',
              'entity_id': 'wlr_ent_000004',
              'product_id': None,
              'affected_product_ids': ['wlr_prod_000019', 'wlr_prod_000020'],
              'event_type': 'rebranded',
              'event_date': '2026-09-09',
              'event_date_basis': 'announcement',
              'title': 'Consensys Software Inc. announced its rebrand as MetaMask and business separation',
              'description': "Consensys Software Inc. announced that it would continue as the same company under the MetaMask name, focused on the consumer platform, while its protocols and institutional infrastructure business would become a newly formed company carrying the Consensys name. Completion of the separation was expected by the end of 2026, and MetaMask said users' app, assets, keys, and access were unchanged at announcement.",
              'confidence': 'high',
              'event_status_effect': 'none',
              'is_major_event': True,
              'user_actions_required': ['none'],
              'notes': 'This records the 2026-09-09 corporate rebrand and separation announcement, not completion of the legal and operational separation.'
          }
          events = append_records(main_text('data/events.json'), [event])

          sources = [
              {
                  'id': 'wlr_src_000544',
                  'entity_id': 'wlr_ent_000004',
                  'product_id': None,
                  'event_id': 'wlr_ev_000267',
                  'source_type': 'official_statement',
                  'title': 'Consensys Software Inc. to become two independent companies: MetaMask, the consumer platform, and Consensys, the protocols and institutional infrastructure company',
                  'url': 'https://metamask.io/news/consensys-software-inc-to-become-two-independent-companies-metamask-and-consensys',
                  'publisher': 'Consensys Software Inc. / MetaMask',
                  'published_at': '2026-09-09',
                  'accessed_at': '2026-09-10',
                  'reliability': 'high',
                  'claim_scope': 'rebrand',
                  'is_primary': True,
                  'notes': 'First-party corporate announcement establishing the CSI-to-MetaMask rebrand, creation of the new Consensys company, independent operation, and expected separation completion by the end of 2026.'
              },
              {
                  'id': 'wlr_src_000545',
                  'entity_id': 'wlr_ent_000004',
                  'product_id': None,
                  'event_id': 'wlr_ev_000267',
                  'source_type': 'official_blog',
                  'title': "MetaMask's next chapter",
                  'url': 'https://metamask.io/news/metamask-next-chapter',
                  'publisher': 'MetaMask / Joseph Lubin',
                  'published_at': '2026-09-09',
                  'accessed_at': '2026-09-10',
                  'reliability': 'high',
                  'claim_scope': 'rebrand',
                  'is_primary': True,
                  'notes': 'First-party leadership article confirming the two-company structure and explicitly stating that MetaMask users had no immediate app, asset, key, or access changes.'
              }
          ]
          evidence = append_records(main_text('data/evidence.json'), sources)

          Path('data/entities.json').write_text(entities, encoding='utf-8')
          Path('data/products.json').write_text(products, encoding='utf-8')
          Path('data/events.json').write_text(events, encoding='utf-8')
          Path('data/evidence.json').write_text(evidence, encoding='utf-8')
          PY

      - name: Regenerate public and machine-readable outputs
        run: npm run prebuild

      - name: Commit normalized diff
        shell: bash
        run: |
          rm .github/workflows/tmp-normalize-metamask-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize MetaMask canonical update diff"
          git push origin HEAD:data/metamask-company-rebrand-20260910
