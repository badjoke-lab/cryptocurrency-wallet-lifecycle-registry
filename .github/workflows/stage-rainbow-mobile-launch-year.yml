name: Stage reviewed Rainbow Mobile launch year

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/rainbow-mobile-launch-year'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/rainbow-mobile-launch-year
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const product = products.find(x => x.id === 'wlr_prod_000057');
          if (!product || product.entity_id !== 'wlr_ent_000019' || product.slug !== 'rainbow-mobile') throw new Error('Unexpected Rainbow Mobile identity');
          if (product.launch_date !== null && product.launch_date !== '2019') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2019';
          product.launch_date_precision = 'year';
          product.last_verified_at = '2026-08-18';
          product.notes = "Rainbow's official repository preserves the mobile wallet's earlier Balance Wallet release lineage. A 2019-02-05 commit explicitly records a beta external release and the exact README identifies the product as a mobile wallet focused on iOS; the repository then records a v1.0.0 Production Release on 2019-06-20. WLR records 2019 at year precision because the reviewed history establishes external/public release during 2019 but not one defensible exact first App Store release day. Earlier 2018 beta-release commits are not used because their external/public status is ambiguous.";

          const ev = {
            id:'wlr_ev_000108', entity_id:'wlr_ent_000019', product_id:'wlr_prod_000057', affected_product_ids:['wlr_prod_000057'],
            event_type:'product_released', event_date:'2019', event_date_basis:'release',
            title:'Rainbow Mobile released externally in 2019',
            description:"Rainbow's official mobile-wallet repository records an external beta release in February 2019 and a v1.0.0 production release in June 2019, establishing the public mobile release lineage during 2019.",
            confidence:'high', event_status_effect:'active', is_major_event:true,
            notes:'Year precision only. Earlier 2018 beta-release commits do not clearly establish an external/public boundary; neither the 2019 external-beta commit nor the later production-release commit is treated as proof of one exact initial App Store launch day.'
          };
          const oldEv = events.find(x => x.id === ev.id);
          if (oldEv && JSON.stringify(oldEv) !== JSON.stringify(ev)) throw new Error('wlr_ev_000108 collision');
          if (!oldEv) events.push(ev);

          const src1 = {
            id:'wlr_src_000169', entity_id:'wlr_ent_000019', product_id:'wlr_prod_000057', event_id:'wlr_ev_000108',
            source_type:'source_code', title:'Rainbow predecessor mobile wallet beta external release v0.3.0 (22)',
            url:'https://github.com/rainbow-me/rainbow/commit/9f6fcd4946f45ff9cea500ad2dd7fd2cefd0e8fc', publisher:'Rainbow', published_at:'2019-02-05', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'Official Rainbow repository history from the earlier Balance Wallet naming. The commit explicitly records a beta external release, adds release tag v0.3.0-22, increments the iOS CFBundleVersion, and bumps the wallet package version. Used to establish the 2019 external-release boundary, not an exact first App Store launch day.'
          };
          const src2 = {
            id:'wlr_src_000170', entity_id:'wlr_ent_000019', product_id:'wlr_prod_000057', event_id:'wlr_ev_000108',
            source_type:'source_code', title:'Rainbow v1.0.0 (11) Production Release',
            url:'https://github.com/rainbow-me/rainbow/commit/80dc8fd0bbb230432946e8a4b6a79f0322702b3f', publisher:'Rainbow', published_at:'2019-06-20', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'Official Rainbow repository commit explicitly marking v1.0.0 (11) Production Release. Used as first-party corroboration that the public mobile release lineage was established during 2019, not as proof that 2019-06-20 was the initial launch day.'
          };
          for (const src of [src1, src2]) {
            const old = evidence.find(x => x.id === src.id);
            if (old && JSON.stringify(old) !== JSON.stringify(src)) throw new Error(`${src.id} collision`);
            if (!old) evidence.push(src);
          }

          write('data/products.json', products);
          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_prod_000057") | .launch_date == "2019" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000108") | .entity_id == "wlr_ent_000019" and .product_id == "wlr_prod_000057" and .event_type == "product_released" and .event_date == "2019" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000169") | .event_id == "wlr_ev_000108" and .source_type == "source_code" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000170") | .event_id == "wlr_ev_000108" and .source_type == "source_code" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed Rainbow Mobile launch year'
          git push origin HEAD:review/rainbow-mobile-launch-year
