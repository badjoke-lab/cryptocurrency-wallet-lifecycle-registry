name: Promote Wave 03 D
on:
  push:
    branches: [promotion/coverage-recovery-wave-03-d]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote fixed reviewed records
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          E=[
          {'id':'wlr_ev_902601','entity_id':'wlr_ent_000069','product_id':'wlr_prod_000118','affected_product_ids':['wlr_prod_000118'],'event_type':'other','event_date':'2026-01-19','event_date_basis':'release','title':'Taho Wallet extension v0.66.0 released','description':'The official Taho Wallet extension repository published v0.66.0 on 2026-01-19 with a Chrome extension artifact and release notes covering swap updates, balance lookup fixes, and maintenance changes.','confidence':'high','event_status_effect':'active','is_major_event':False},
          {'id':'wlr_ev_902602','entity_id':'wlr_ent_000071','product_id':'wlr_prod_000120','affected_product_ids':['wlr_prod_000120'],'event_type':'other','event_date':'2026-08-27','event_date_basis':'release','title':'Blockstream Green 3.5.3 released','description':'The official Blockstream Green desktop repository published release 3.5.3 on 2026-08-27 with macOS, Linux, and Windows artifacts plus fixes for login hangs, account-loading crashes, payment-sync crashes, macOS HID handling, and concurrent Jade requests.','confidence':'high','event_status_effect':'active','is_major_event':False},
          {'id':'wlr_ev_902603','entity_id':'wlr_ent_000072','product_id':'wlr_prod_000121','affected_product_ids':['wlr_prod_000121'],'event_type':'other','event_date':'2026-03-26','event_date_basis':'release','title':'AirGap Wallet v3.34.4 released','description':'The official AirGap Wallet repository published v3.34.4 on 2026-03-26 with an Android APK and changes including a Coreum-to-TX Chain rebrand, transaction-history search, balance-loading improvements, camera-permission handling, an RSR contract update, and Kusama/Polkadot explorer fixes.','confidence':'high','event_status_effect':'active','is_major_event':False},
          {'id':'wlr_ev_902604','entity_id':'wlr_ent_000073','product_id':'wlr_prod_000122','affected_product_ids':['wlr_prod_000122'],'event_type':'other','event_date':'2026-08-27','event_date_basis':'release','title':'Unstoppable Wallet Android 0.50.1 released','description':'The official Horizontal Systems Unstoppable Wallet Android repository published version 0.50.1 on 2026-08-27 with GitHub and Google Play APK artifacts, providing dated first-party evidence of continuing wallet maintenance.','confidence':'high','event_status_effect':'active','is_major_event':False},
          {'id':'wlr_ev_902701','entity_id':'wlr_ent_000076','product_id':'wlr_prod_000125','affected_product_ids':['wlr_prod_000125'],'event_type':'product_announced','event_date':'2022-07-04','event_date_basis':'announcement','title':'Nightly Wallet introduced publicly','description':'Nightly first-party 2022-07-04 introduction presented Nightly Wallet as the first part of the Nightly ecosystem and described its multichain wallet functionality. The source says the extension was live in the Chrome Web Store but not yet public, so this record is an announcement/introduction event and does not infer the later public launch date.','confidence':'high','event_status_effect':'active','is_major_event':True},
          {'id':'wlr_ev_902801','entity_id':'wlr_ent_000087','product_id':'wlr_prod_000136','affected_product_ids':['wlr_prod_000136'],'event_type':'other','event_date':'2026-01-26','event_date_basis':'announcement','title':'Xverse launched Lightning payments through Sati','description':'Xverse announced on 2026-01-26 that Lightning Network payments had launched in partnership with Sati and were available from the Xverse web wallet, while the user main Bitcoin wallet remained self-custodial.','confidence':'high','event_status_effect':'active','is_major_event':False}
          ]
          S=[
          {'id':'wlr_src_902601','entity_id':'wlr_ent_000069','product_id':'wlr_prod_000118','event_id':'wlr_ev_902601','source_type':'release_notes','title':'Taho Wallet extension v0.66.0','url':'https://github.com/tahowallet/extension/releases/tag/v0.66.0','publisher':'Taho Wallet','published_at':'2026-01-19','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official Taho Wallet GitHub release with packaged Chrome extension artifact.'},
          {'id':'wlr_src_902602','entity_id':'wlr_ent_000071','product_id':'wlr_prod_000120','event_id':'wlr_ev_902602','source_type':'release_notes','title':'Blockstream Green Release 3.5.3','url':'https://github.com/Blockstream/green_qt/releases/tag/release_3.5.3','publisher':'Blockstream','published_at':'2026-08-27','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official Blockstream Green GitHub release with packaged desktop artifacts.'},
          {'id':'wlr_src_902603','entity_id':'wlr_ent_000072','product_id':'wlr_prod_000121','event_id':'wlr_ev_902603','source_type':'release_notes','title':'AirGap Wallet v3.34.4','url':'https://github.com/airgap-it/airgap-wallet/releases/tag/v3.34.4','publisher':'AirGap','published_at':'2026-03-26','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official AirGap Wallet GitHub release with Android APK artifact.'},
          {'id':'wlr_src_902604','entity_id':'wlr_ent_000073','product_id':'wlr_prod_000122','event_id':'wlr_ev_902604','source_type':'release_notes','title':'Unstoppable Wallet Version 0.50.1','url':'https://github.com/horizontalsystems/unstoppable-wallet-android/releases/tag/0.50.1','publisher':'Horizontal Systems','published_at':'2026-08-27','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official Unstoppable Wallet Android GitHub release with packaged APK artifacts.'},
          {'id':'wlr_src_902701','entity_id':'wlr_ent_000076','product_id':'wlr_prod_000125','event_id':'wlr_ev_902701','source_type':'official_blog','title':'Hello World! Nightly Wallet','url':'https://nightly.app/blog/hello-world-nightly-wallet','publisher':'Nightly','published_at':'2022-07-04','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Nightly introduction. It documents the wallet and explicitly says the extension was not yet public, so no launch date is inferred from this source.'},
          {'id':'wlr_src_902801','entity_id':'wlr_ent_000087','product_id':'wlr_prod_000136','event_id':'wlr_ev_902801','source_type':'official_blog','title':'Xverse Gets a Lightning Fast Upgrade in Partnership With Sati','url':'https://www.xverse.app/blog/lightning-network-on-xverse','publisher':'Xverse','published_at':'2026-01-26','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Xverse announcement explicitly states that Lightning Network payments launched through the Sati partnership.'}
          ]
          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          events=json.loads(ep.read_text()); sources=json.loads(sp.read_text())
          def nxt(rows,p): return max([int(x['id'][len(p):]) for x in rows if re.fullmatch(re.escape(p)+r'\d+',x['id'])],default=0)+1
          ne=nxt(events,'wlr_ev_'); ns=nxt(sources,'wlr_src_'); urls={x['url'] for x in sources}; keys={(x.get('entity_id'),x.get('product_id'),x.get('event_type'),x.get('event_date'),x.get('title')) for x in events}
          smap={x['event_id']:x for x in S}; emap={}; pe=[]; ps=[]
          for e in E:
            k=(e['entity_id'],e['product_id'],e['event_type'],e['event_date'],e['title']); s=smap[e['id']]
            if k in keys or s['url'] in urls: continue
            n=dict(e); nid=f'wlr_ev_{ne:06d}'; ne+=1; n['id']=nid; emap[e['id']]=nid; pe.append(n); keys.add(k)
          for s in S:
            if s['event_id'] not in emap or s['url'] in urls: continue
            n=dict(s); n['id']=f'wlr_src_{ns:06d}'; ns+=1; n['event_id']=emap[s['event_id']]; ps.append(n); urls.add(s['url'])
          events+=pe; sources+=ps
          ep.write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n'); sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          print('PROMOTED',len(pe),len(ps),emap)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate and validate
        run: |
          npm run prebuild
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote Wave 03 parts 7-9 records'
          git push origin HEAD:promotion/coverage-recovery-wave-03-d
