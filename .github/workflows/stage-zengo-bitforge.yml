name: Stage reviewed Zengo BitForge security history

on:
  push:
    branches: [data/zengo-bitforge-security-history]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/zengo-bitforge-security-history
          fetch-depth: 0

      - name: Append reviewed Zengo events and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          events_path = Path('data/events.json')
          evidence_path = Path('data/evidence.json')
          events = json.loads(events_path.read_text())
          evidence = json.loads(evidence_path.read_text())

          new_event_ids = {'wlr_ev_000077', 'wlr_ev_000078'}
          new_source_ids = {'wlr_src_000126', 'wlr_src_000127', 'wlr_src_000128', 'wlr_src_000129'}
          assert not new_event_ids.intersection({row['id'] for row in events}), 'target event ID already exists'
          assert not new_source_ids.intersection({row['id'] for row in evidence}), 'target evidence ID already exists'
          assert any(row['id'] == 'wlr_ev_000044' and row['entity_id'] == 'wlr_ent_000012' for row in events), 'expected existing Zengo launch event missing'

          events.extend([
            {
              'id': 'wlr_ev_000077',
              'entity_id': 'wlr_ent_000012',
              'product_id': 'wlr_prod_000040',
              'affected_product_ids': ['wlr_prod_000040'],
              'event_type': 'vulnerability_disclosed',
              'event_date': '2023-08-09',
              'event_date_basis': 'disclosure',
              'disclosed_at': '2023-08-09',
              'title': 'BitForge Lindell17 key-exfiltration vulnerability disclosed',
              'description': 'Fireblocks publicly disclosed a Lindell17 implementation vulnerability initially discovered in Zengo that could leak key material across repeated failed signing attempts when an attacker had privileged access. Fireblocks and Zengo state that Zengo mitigated the issue through responsible disclosure and that no Zengo wallets were exploited.',
              'confidence': 'high',
              'impact_level': 'high',
              'security_scope': 'transaction_signing',
              'funds_affected': 'no',
              'event_status_effect': 'none',
              'cve_ids': ['CVE-2023-33242'],
              'is_major_event': True,
              'user_actions_required': ['none'],
              'affected_components': ['Lindell17 two-party ECDSA implementation'],
              'notes': 'The public sources do not establish a Zengo app version range or an exact private remediation date, so WLR does not invent either. Fireblocks describes privileged access and repeated signing attempts as preconditions for the demonstrated attack.'
            },
            {
              'id': 'wlr_ev_000078',
              'entity_id': 'wlr_ent_000012',
              'product_id': 'wlr_prod_000040',
              'affected_product_ids': ['wlr_prod_000040'],
              'event_type': 'security_fix',
              'event_date': '2023-08-10',
              'event_date_basis': 'announcement',
              'title': 'Zengo publicly confirmed BitForge issue was addressed',
              'description': 'Zengo published its response to the BitForge disclosure, stating that its research team worked with Fireblocks and promptly addressed the identified issue and that no Zengo users were impacted. Fireblocks separately confirmed Zengo had mitigated the Lindell17 issue.',
              'confidence': 'high',
              'impact_level': 'high',
              'security_scope': 'transaction_signing',
              'funds_affected': 'no',
              'event_status_effect': 'none',
              'cve_ids': ['CVE-2023-33242'],
              'is_major_event': True,
              'user_actions_required': ['none'],
              'affected_components': ['Lindell17 two-party ECDSA implementation'],
              'notes': 'This event records the public remediation confirmation date, not an inferred patch-release date. No Zengo app version or exact private mitigation timestamp is asserted.'
            }
          ])

          evidence.extend([
            {
              'id': 'wlr_src_000126',
              'entity_id': 'wlr_ent_000012',
              'product_ids': ['wlr_prod_000040'],
              'event_ids': ['wlr_ev_000077'],
              'product_id': 'wlr_prod_000040',
              'event_id': 'wlr_ev_000077',
              'source_type': 'security_research',
              'title': 'Lindell17 Abort Vulnerability [CVE-2023-33242]: Technical Report',
              'url': 'https://www.fireblocks.com/blog/lindell17-abort-vulnerability-technical-report',
              'publisher': 'Fireblocks',
              'published_at': '2023-08-09',
              'accessed_at': '2026-08-17',
              'reliability': 'high',
              'claim_scope': 'vulnerability',
              'is_primary': True,
              'notes': 'Primary researcher report: vulnerability initially discovered in Zengo, public disclosure on 2023-08-09, CVE-2023-33242, privileged-access/repeated-signing attack model, and prompt Zengo mitigation with no exploited wallets reported.'
            },
            {
              'id': 'wlr_src_000127',
              'entity_id': 'wlr_ent_000012',
              'product_ids': ['wlr_prod_000040'],
              'event_ids': ['wlr_ev_000077'],
              'product_id': 'wlr_prod_000040',
              'event_id': 'wlr_ev_000077',
              'source_type': 'official_security_advisory',
              'title': 'BitForge: Strengthening Zengo’s security',
              'url': 'https://zengo.com/bitforge-strengthening-zengos-security/',
              'publisher': 'Zengo',
              'published_at': '2023-08-10',
              'accessed_at': '2026-08-17',
              'reliability': 'high',
              'claim_scope': 'vulnerability',
              'is_primary': True,
              'notes': 'First-party Zengo response confirming Zengo was among affected MPC wallets, describing the device-malware precondition, and stating no Zengo users were impacted.'
            },
            {
              'id': 'wlr_src_000128',
              'entity_id': 'wlr_ent_000012',
              'product_ids': ['wlr_prod_000040'],
              'event_ids': ['wlr_ev_000078'],
              'product_id': 'wlr_prod_000040',
              'event_id': 'wlr_ev_000078',
              'source_type': 'official_security_advisory',
              'title': 'BitForge: Strengthening Zengo’s security',
              'url': 'https://zengo.com/bitforge-strengthening-zengos-security/',
              'publisher': 'Zengo',
              'published_at': '2023-08-10',
              'accessed_at': '2026-08-17',
              'reliability': 'high',
              'claim_scope': 'security_fix',
              'is_primary': True,
              'notes': 'Separate remediation claim scope: Zengo states it collaborated with Fireblocks and promptly addressed the discovery, with no Zengo users impacted.'
            },
            {
              'id': 'wlr_src_000129',
              'entity_id': 'wlr_ent_000012',
              'product_ids': ['wlr_prod_000040'],
              'event_ids': ['wlr_ev_000078'],
              'product_id': 'wlr_prod_000040',
              'event_id': 'wlr_ev_000078',
              'source_type': 'security_research',
              'title': 'Lindell17 Abort Vulnerability [CVE-2023-33242]: Technical Report',
              'url': 'https://www.fireblocks.com/blog/lindell17-abort-vulnerability-technical-report',
              'publisher': 'Fireblocks',
              'published_at': '2023-08-09',
              'accessed_at': '2026-08-17',
              'reliability': 'high',
              'claim_scope': 'security_fix',
              'is_primary': True,
              'notes': 'Separate remediation claim scope: Fireblocks states Zengo promptly mitigated the issue during responsible disclosure and reported that no wallets were exploited.'
            }
          ])

          events_path.write_text(json.dumps(events, ensure_ascii=False, separators=(',', ':')) + '\n')
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, separators=(',', ':')) + '\n')
          print('staged', len(events), 'events', len(evidence), 'evidence')
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted Zengo batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          assert len(events) == 78
          assert len(evidence) == 129
          targets=[e for e in events if e['id'] in {'wlr_ev_000077','wlr_ev_000078'}]
          assert len(targets)==2 and all(e['entity_id']=='wlr_ent_000012' and e['product_id']=='wlr_prod_000040' for e in targets)
          assert next(e for e in targets if e['id']=='wlr_ev_000077')['cve_ids']==['CVE-2023-33242']
          assert next(e for e in targets if e['id']=='wlr_ev_000077')['funds_affected']=='no'
          assert next(e for e in targets if e['id']=='wlr_ev_000078')['event_type']=='security_fix'
          src=[s for s in evidence if s['id'] in {'wlr_src_000126','wlr_src_000127','wlr_src_000128','wlr_src_000129'}]
          assert len(src)==4 and all(s['reliability']=='high' and s['is_primary'] is True for s in src)
          print('ZENGO_BITFORGE_STAGE_OK events=78 evidence=129')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed Zengo BitForge security history'
          git push origin HEAD:data/zengo-bitforge-security-history
