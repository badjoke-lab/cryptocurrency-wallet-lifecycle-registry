name: Promote Phantom Sui announcement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.head.ref == 'promote/phantom-sui-announcement'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - name: Apply bounded canonical promotion
        run: node scripts/promote-phantom-sui-announcement.mjs
      - name: Regenerate public and Series outputs
        run: npm run prebuild
      - name: Validate promoted canonical data
        run: |
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:series
      - name: Remove one-shot promotion machinery
        run: |
          rm scripts/promote-phantom-sui-announcement.mjs
          rm .github/workflows/promote-phantom-sui-announcement.yml
      - name: Commit validated canonical delta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote Phantom Sui support announcement [phantom-sui promoted]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
