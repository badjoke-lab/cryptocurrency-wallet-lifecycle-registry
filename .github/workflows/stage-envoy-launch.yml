name: Stage Envoy launch year

on:
  push:
    branches: [cleanup/envoy-launch-year]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/envoy-launch-year
          fetch-depth: 0

      - name: Apply reviewed canonical change
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          products_path = Path('data/products.json')
          events_path = Path('data/events.json')
          evidence_path = Path('data/evidence.json')

          products = json.loads(products_path.read_text())
          events = json.loads(events_path.read_text())
          evidence = json.loads(evidence_path.read_text())

          assert max(int(x['id'].split('_')[-1]) for x in events) == 102, 'unexpected event head'
          assert max(int(x['id'].split('_')[-1]) for x in evidence) == 160, 'unexpected evidence head'
          assert not any(x['id'] == 'wlr_ev_000103' for x in events)
          assert not any(x['id'] in {'wlr_src_000161','wlr_src_000162'} for x in evidence)

          product = next(x for x in products if x['id'] == 'wlr_prod_000053')
          assert product['slug'] == 'foundation-envoy'
          assert product['entity_id'] == 'wlr_ent_000017'
          assert product.get('launch_date') is None
          product['launch_date'] = '2022'
          product['launch_date_precision'] = 'year'
          product['last_verified_at'] = '2026-08-18'
          product['notes'] = (
              'Foundation announced Envoy as a forthcoming Passport companion/mobile wallet in March 2022, and first-party distribution evidence shows Envoy was publicly released during 2022. '
              'WLR records year precision only because the reviewed sources do not establish a single defensible initial app-store release day. The later 2023 standalone-hot-wallet expansion is not treated as the initial Envoy launch.'
          )

          events.append({
              'id': 'wlr_ev_000103',
              'entity_id': 'wlr_ent_000017',
              'product_id': 'wlr_prod_000053',
              'affected_product_ids': ['wlr_prod_000053'],
              'event_type': 'product_released',
              'event_date': '2022',
              'event_date_basis': 'release',
              'title': 'Foundation Envoy released on mobile platforms',
              'description': 'Foundation released Envoy during 2022 as a mobile Passport companion and Bitcoin software-wallet application for iOS and Android.',
              'confidence': 'high',
              'event_status_effect': 'active',
              'is_major_event': True,
              'notes': 'Year precision only. Foundation stated on 2022-03-10 that Envoy would launch later, while the official Envoy repository published v1.0.7 Android/iOS release artifacts in October 2022 and Foundation subsequently described v1.0.7 as live on mobile platforms.'
          })

          evidence.extend([
              {
                  'id': 'wlr_src_000161',
                  'entity_id': 'wlr_ent_000017',
                  'product_ids': ['wlr_prod_000053'],
                  'event_ids': ['wlr_ev_000103'],
                  'product_id': 'wlr_prod_000053',
                  'event_id': 'wlr_ev_000103',
                  'source_type': 'official_blog',
                  'title': 'Introducing Passport Batch 2 & Envoy Mobile App',
                  'url': 'https://foundation.xyz/2022/03/introducing-passport-batch-2-envoy/',
                  'publisher': 'Foundation',
                  'published_at': '2022-03-10',
                  'accessed_at': '2026-08-18',
                  'reliability': 'high',
                  'claim_scope': 'launch_date',
                  'is_primary': True,
                  'notes': 'First-party pre-launch boundary: Foundation announces Envoy and explicitly says it will launch in app stores later alongside Passport Batch 2. This source is not treated as the release date itself.'
              },
              {
                  'id': 'wlr_src_000162',
                  'entity_id': 'wlr_ent_000017',
                  'product_ids': ['wlr_prod_000053'],
                  'event_ids': ['wlr_ev_000103'],
                  'product_id': 'wlr_prod_000053',
                  'event_id': 'wlr_ev_000103',
                  'source_type': 'release_notes',
                  'title': 'Envoy Release 1.0.7',
                  'url': 'https://github.com/Foundation-Devices/envoy/releases/tag/v1.0.7',
                  'publisher': 'Foundation Devices',
                  'published_at': '2022-10-17',
                  'accessed_at': '2026-08-18',
                  'reliability': 'high',
                  'claim_scope': 'launch_date',
                  'is_primary': True,
                  'notes': 'Official Envoy repository release containing Android App Bundle/APK and iOS IPA artifacts in October 2022. Used with the March pre-launch announcement to establish only that the initial public product launch occurred in 2022.'
              }
          ])

          for path, data in ((products_path, products), (events_path, events), (evidence_path, evidence)):
              path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY

      - name: Validate reviewed change
        run: |
          set -euo pipefail
          npm run validate:records
          npm run validate:identity-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          p=next(x for x in products if x['id']=='wlr_prod_000053')
          e=next(x for x in events if x['id']=='wlr_ev_000103')
          src=[x for x in evidence if x['id'] in {'wlr_src_000161','wlr_src_000162'}]
          assert p['launch_date']=='2022' and p['launch_date_precision']=='year'
          assert e['event_type']=='product_released' and e['event_date']=='2022' and e['event_date_basis']=='release'
          assert len(src)==2 and all(x['event_id']=='wlr_ev_000103' and x['reliability']=='high' and x['is_primary'] is True for x in src)
          print('ENVOY_STAGE_OK')
          PY

      - name: Commit canonical staging result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          git diff --cached --quiet && { echo 'No staged canonical change'; exit 1; }
          git commit -m 'Add reviewed Envoy launch year'
          git push origin HEAD:cleanup/envoy-launch-year
