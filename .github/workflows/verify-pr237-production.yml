name: Verify WLR PR237 Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-main-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Pin exact merged main
        run: test "$(git rev-parse HEAD)" = "fa997ab3a04f9b41c133f986db6cd324ec2829ee"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npm run validate:records
      - run: npm run validate:machine-records
      - run: npm run validate:stats
      - run: npm run coverage:audit
      - run: npm run build
      - name: Verify PR237 records and Series
        run: |
          set -euo pipefail
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          git diff --exit-code -- public/data/series
          jq -e '.registry.entities == 100 and .registry.products == 149 and .registry.events == 141 and .registry.evidence == 368' public/data/stats.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000141") | .entity_id == "wlr_ent_000029" and .event_type == "unauthorized_access" and .event_date == "2018-06-09" and .funds_affected == "no"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000368") | .event_id == "wlr_ev_000141" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          jq -e '.record_counts.primary_records == 100 and .record_counts.native.events == 141 and .record_counts.native.evidence == 368' public/data/series/registry.json >/dev/null

  production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Resolve exact Cloudflare production deployment
        id: cf
        run: |
          set -euo pipefail
          expected="fa997ab3a04f9b41c133f986db6cd324ec2829ee"
          test "$(git rev-parse HEAD)" = "$expected"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          match=""
          for attempt in $(seq 1 100); do
            deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
            match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
            if [ -n "$match" ] && jq -e '.latest_stage.status == "success"' <<<"$match" >/dev/null; then break; fi
            echo "Waiting for exact deployment attempt=${attempt}"; sleep 10
          done
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and .deployment_trigger.metadata.commit_dirty == false and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          echo "deployment_url=$(jq -r '.url' <<<"$match")" >> "$GITHUB_OUTPUT"
          echo "$match" | jq '{id,url,aliases,latest_stage,deployment_trigger}'
      - name: Verify production canonical and Series
        env:
          DEPLOYMENT_URL: ${{ steps.cf.outputs.deployment_url }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            nonce="fa997ab3-${attempt}-$(date +%s)"; ok=1
            for name in events evidence stats; do curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/${name}.json?verify=${nonce}" -o "$work/${name}.json" || ok=0; done
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/registry.json?verify=${nonce}" -o "$work/series-registry.json" || ok=0
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/records/wallet--imtoken.json?verify=${nonce}" -o "$work/imtoken-series.json" || ok=0
            if [ "$ok" -eq 1 ] && jq -e '.registry.events == 141 and .registry.evidence == 368' "$work/stats.json" >/dev/null 2>&1 && jq -e '.record_counts.native.events == 141 and .record_counts.native.evidence == 368' "$work/series-registry.json" >/dev/null 2>&1; then
              good=1
              jq -e '.[] | select(.id == "wlr_ev_000141") | .event_type == "unauthorized_access" and .event_date == "2018-06-09"' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_src_000368") | .event_id == "wlr_ev_000141"' "$work/evidence.json" >/dev/null 2>&1 || good=0
              jq -e '.events.records[] | select(.id == "wlr_ev_000141")' "$work/imtoken-series.json" >/dev/null 2>&1 || good=0
              if [ "$good" -eq 1 ]; then ready=1; echo "Public PR237 exact on attempt=${attempt}"; break; fi
            fi
            sleep 10
          done
          test "$ready" -eq 1
          for route in wallet/imtoken product/imtoken-app data/series/records/wallet--imtoken.json data/series/records/product--imtoken-app.json; do
            suffix="/"; [[ "$route" == *.json ]] && suffix=""
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://wlr.badjoke-lab.com/${route}${suffix}?verify=$(date +%s)")"
            test "$code" -ge 200 && test "$code" -lt 400
          done
          echo 'PR237_PRODUCTION_VERIFY_OK entities=100 products=149 events=141 evidence=368 series_records=249'
