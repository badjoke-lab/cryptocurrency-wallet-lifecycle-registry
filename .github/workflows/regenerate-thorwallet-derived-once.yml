name: Regenerate THORWallet derived outputs once

on:
  push:
    branches:
      - feat/thorwallet-canonical-promotion

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/thorwallet-canonical-promotion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --progress=false
      - name: Regenerate tracked derived outputs
        run: npm run prebuild
      - name: Remove one-shot workflow
        run: rm .github/workflows/regenerate-thorwallet-derived-once.yml
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate THORWallet derived registry outputs"
          git push origin HEAD:feat/thorwallet-canonical-promotion
