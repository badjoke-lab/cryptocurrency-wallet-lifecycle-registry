name: Promote Wave 03 Thin History 1
on:
  push:
    branches: [promotion/coverage-recovery-wave-03-thin-history-1]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote reviewed thin-history records
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          expected_entities={
            'wlr_ent_000032':'Atomic Wallet',
            'wlr_ent_000039':'CoolWallet',
            'wlr_ent_000038':"D'CENT",
            'wlr_ent_000036':'Edge',
            'wlr_ent_000054':'Bitcoin.com Wallet',
          }
          expected_products={
            'wlr_prod_000081':'Atomic Wallet Desktop',
            'wlr_prod_000088':'CoolWallet Pro',
            'wlr_prod_000087':"D'CENT Biometric Wallet",
            'wlr_prod_000085':'Edge Wallet',
            'wlr_prod_000103':'Bitcoin.com Wallet App',
          }
          entities={x['id']:x for x in json.loads(Path('data/entities.json').read_text())}
          products={x['id']:x for x in json.loads(Path('data/products.json').read_text())}
          for i,n in expected_entities.items(): assert entities.get(i,{}).get('canonical_name')==n,(i,entities.get(i,{}).get('canonical_name'),n)
          for i,n in expected_products.items(): assert products.get(i,{}).get('product_name')==n,(i,products.get(i,{}).get('product_name'),n)
          E=[
            {'id':'wlr_ev_903301','entity_id':'wlr_ent_000032','product_id':'wlr_prod_000081','affected_product_ids':['wlr_prod_000081'],'event_type':'other','event_date':'2026-01-20','event_date_basis':'discovery','title':'Atomic Wallet documented its 2025 perpetual futures launch','description':"Atomic Wallet's 2025 year-in-review, published 2026-01-20, states that perpetual futures trading launched in November 2025 across its self-custodial wallet experience. The publication date is used as discovery chronology because the source does not provide an exact November launch day.",'confidence':'high','event_status_effect':'active','is_major_event':True},
            {'id':'wlr_ev_903302','entity_id':'wlr_ent_000039','product_id':'wlr_prod_000088','affected_product_ids':['wlr_prod_000088'],'event_type':'other','event_date':'2025-07-15','event_date_basis':'announcement','title':'CoolWallet added multi-wallet management','description':'CoolWallet announced on 2025-07-15 that its new Multi-Wallet Management feature was live, allowing users to manage multiple CoolWallet cold wallets and one hot wallet in the CoolWallet App and introducing a refreshed CoolWallet Pro and S setup experience.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903303','entity_id':'wlr_ent_000038','product_id':'wlr_prod_000087','affected_product_ids':['wlr_prod_000087'],'event_type':'other','event_date':'2026-08-10','event_date_basis':'announcement','title':"D'CENT added scam-address detection safeguards",'description':"D'CENT announced on 2026-08-10 that its wallet added checks for known spam and phishing addresses, visible risk labels for suspicious transactions, in-app blocking/reporting, XRP tag reminders, and related send-flow safeguards.",'confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903304','entity_id':'wlr_ent_000036','product_id':'wlr_prod_000085','affected_product_ids':['wlr_prod_000085'],'event_type':'other','event_date':'2025-09-02','event_date_basis':'announcement','title':'Edge Wallet launched direct Revolut integration','description':"Edge announced on 2025-09-02 that the wallet added a direct Revolut integration for buying crypto into the self-custody wallet and selling crypto back to a user's Revolut account without an additional intermediary account.",'confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903305','entity_id':'wlr_ent_000054','product_id':'wlr_prod_000103','affected_product_ids':['wlr_prod_000103'],'event_type':'other','event_date':'2026-03-06','event_date_basis':'discovery','title':'Bitcoin.com Wallet push notification incident occurred','description':'Bitcoin.com reported that on 2026-03-06 a test push notification was inadvertently sent to iOS and Android Wallet users because of a third-party misconfiguration. Bitcoin.com stated the issue was resolved and did not involve user funds, wallet access, private keys, or wallet-infrastructure compromise.','confidence':'high','event_status_effect':'active','is_major_event':False},
          ]
          S=[
            {'id':'wlr_src_903301','entity_id':'wlr_ent_000032','product_id':'wlr_prod_000081','event_id':'wlr_ev_903301','source_type':'official_blog','title':'Atomic Wallet 2025: Year in Review','url':'https://atomicwallet.io/blog/articles/atomic-wallet-2025-year-in-review','publisher':'Atomic Wallet','published_at':'2026-01-20','accessed_at':'2026-09-01','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Atomic Wallet year-in-review; exact November launch day is not inferred.'},
            {'id':'wlr_src_903302','entity_id':'wlr_ent_000039','product_id':'wlr_prod_000088','event_id':'wlr_ev_903302','source_type':'official_blog','title':'CoolWallet’s New Feature: Multi-Wallet Management','url':'https://www.coolwallet.io/blogs/blog/multiple-wallet-management','publisher':'CoolWallet','published_at':'2025-07-15','accessed_at':'2026-09-01','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party CoolWallet product announcement states the feature is live.'},
            {'id':'wlr_src_903303','entity_id':'wlr_ent_000038','product_id':'wlr_prod_000087','event_id':'wlr_ev_903303','source_type':'official_blog','title':'Your Wallet Now Says No to Scam Addresses','url':'https://store.dcentwallet.com/blogs/post/dcent-spam-phishing-address-detection','publisher':"D'CENT Wallet",'published_at':'2026-08-10','accessed_at':'2026-09-01','reliability':'high','claim_scope':'event','is_primary':True,'notes':"First-party D'CENT Wallet update announcement."},
            {'id':'wlr_src_903304','entity_id':'wlr_ent_000036','product_id':'wlr_prod_000085','event_id':'wlr_ev_903304','source_type':'official_blog','title':'Edge Launches Direct Revolut Integration','url':'https://edge.app/blog/company-news/edge-revolut-crypto-on-off-ramps/','publisher':'Edge','published_at':'2025-09-02','accessed_at':'2026-09-01','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Edge announcement for a live wallet integration.'},
            {'id':'wlr_src_903305','entity_id':'wlr_ent_000054','product_id':'wlr_prod_000103','event_id':'wlr_ev_903305','source_type':'official_statement','title':'Push Notification Incident','url':'https://support.bitcoin.com/en/articles/13982373-push-notification-incident','publisher':'Bitcoin.com','published_at':'2026-03-07','accessed_at':'2026-09-01','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Bitcoin.com incident statement; explicitly states no funds, keys, wallet access, or infrastructure compromise.'},
          ]
          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          events=json.loads(ep.read_text()); sources=json.loads(sp.read_text())
          def nxt(rows,p): return max([int(x['id'][len(p):]) for x in rows if re.fullmatch(re.escape(p)+r'\d+',x['id'])],default=0)+1
          ne=nxt(events,'wlr_ev_'); ns=nxt(sources,'wlr_src_')
          urls={x['url'] for x in sources}; keys={(x.get('entity_id'),x.get('product_id'),x.get('event_type'),x.get('event_date'),x.get('title')) for x in events}
          smap={x['event_id']:x for x in S}; emap={}; pe=[]; ps=[]
          for e in E:
            s=smap[e['id']]; k=(e['entity_id'],e['product_id'],e['event_type'],e['event_date'],e['title'])
            if k in keys or s['url'] in urls: continue
            n=dict(e); nid=f'wlr_ev_{ne:06d}'; ne+=1; n['id']=nid; emap[e['id']]=nid; pe.append(n); keys.add(k)
          for s in S:
            if s['event_id'] not in emap or s['url'] in urls: continue
            n=dict(s); n['id']=f'wlr_src_{ns:06d}'; ns+=1; n['event_id']=emap[s['event_id']]; ps.append(n); urls.add(s['url'])
          assert len(pe)==5 and len(ps)==5,f'expected 5/5 promotion, got {len(pe)}/{len(ps)}'
          events+=pe; sources+=ps
          ep.write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n'); sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          print('PROMOTED',len(pe),len(ps),emap)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate and validate
        run: |
          npm run prebuild
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote Wave 03 thin-history batch 1 records'
          git push origin HEAD:promotion/coverage-recovery-wave-03-thin-history-1
