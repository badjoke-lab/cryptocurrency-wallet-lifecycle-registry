name: Stage reviewed BlueWallet Mobile launch year

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/bluewallet-mobile-launch-year'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/bluewallet-mobile-launch-year
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const product = products.find(x => x.id === 'wlr_prod_000063');
          if (!product || product.entity_id !== 'wlr_ent_000023' || product.slug !== 'bluewallet-mobile') throw new Error('Unexpected BlueWallet Mobile identity');
          if (product.launch_date !== null && product.launch_date !== '2018') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2018';
          product.launch_date_precision = 'year';
          product.last_verified_at = '2026-08-18';
          product.notes = 'First-party BlueWallet source history shows the mobile app in a store-versioned release lineage during 2018, including store version 1.2.0 with iOS bundle/build metadata on 2018-05-12. WLR records year precision only because the reviewed history does not establish a defensible exact initial public-release day.';

          const ev = {
            id:'wlr_ev_000105', entity_id:'wlr_ent_000023', product_id:'wlr_prod_000063', affected_product_ids:['wlr_prod_000063'],
            event_type:'product_released', event_date:'2018', event_date_basis:'release',
            title:'BlueWallet Mobile released by 2018',
            description:"BlueWallet's official source history records a store-versioned mobile build during 2018, establishing the mobile product as released by that year.",
            confidence:'high', event_status_effect:'active', is_major_event:true,
            notes:'Year precision only. The reviewed source history establishes a store/release lineage in 2018 but does not establish a defensible exact initial public-release day.'
          };
          const oldEv = events.find(x => x.id === ev.id);
          if (oldEv && JSON.stringify(oldEv) !== JSON.stringify(ev)) throw new Error('wlr_ev_000105 collision');
          if (!oldEv) events.push(ev);

          const src = {
            id:'wlr_src_000164', entity_id:'wlr_ent_000023', product_id:'wlr_prod_000063', event_id:'wlr_ev_000105',
            source_type:'source_code', title:'BlueWallet store version 1.2.0',
            url:'https://github.com/BlueWallet/BlueWallet/commit/8646f1d06ed9c874c1b11e729cb091e191f6e921',
            publisher:'BlueWallet', published_at:'2018-05-12', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'Official BlueWallet source history showing a 2018 store-versioned mobile build with BlueWallet iOS bundle/build metadata. Used for year-level launch chronology, not as proof of the exact initial release day.'
          };
          const oldSrc = evidence.find(x => x.id === src.id);
          if (oldSrc && JSON.stringify(oldSrc) !== JSON.stringify(src)) throw new Error('wlr_src_000164 collision');
          if (!oldSrc) evidence.push(src);

          write('data/products.json', products);
          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_prod_000063") | .launch_date == "2018" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000105") | .entity_id == "wlr_ent_000023" and .product_id == "wlr_prod_000063" and .event_type == "product_released" and .event_date == "2018" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000164") | .event_id == "wlr_ev_000105" and .source_type == "source_code" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed BlueWallet Mobile launch year'
          git push origin HEAD:review/bluewallet-mobile-launch-year
