name: Stage reviewed Rainbow Demonic mitigation history

on:
  push:
    branches: [data/rainbow-demonic-mitigation]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/rainbow-demonic-mitigation
          fetch-depth: 0

      - name: Append reviewed Rainbow event and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def append_row(path, row):
              text = path.read_text()
              stripped = text.rstrip()
              assert stripped.endswith(']')
              body = stripped[:-1].rstrip()
              addition = ',\n' + json.dumps(row, ensure_ascii=False, separators=(',', ':')) + '\n]'
              path.write_text(body + addition + '\n')

          events_path = Path('data/events.json')
          evidence_path = Path('data/evidence.json')
          events = json.loads(events_path.read_text())
          evidence = json.loads(evidence_path.read_text())

          assert len(events) == 78
          assert len(evidence) == 129
          assert 'wlr_ev_000079' not in {row['id'] for row in events}
          assert 'wlr_src_000130' not in {row['id'] for row in evidence}
          assert any(row['id'] == 'wlr_ev_000070' and row['entity_id'] == 'wlr_ent_000019' for row in events)

          event = {
            'id': 'wlr_ev_000079',
            'entity_id': 'wlr_ent_000019',
            'product_id': 'wlr_prod_000058',
            'affected_product_ids': ['wlr_prod_000058'],
            'event_type': 'software_fix',
            'event_date': '2023-06-15',
            'event_date_basis': 'release',
            'title': 'Rainbow Extension v1.1.0 added Demonic mitigation',
            'description': 'Rainbow Extension v1.1.0 redesigned the secret-recovery-phrase import flow to mitigate the known Demonic browser-wallet vulnerability reported by Halborn.',
            'confidence': 'high',
            'security_scope': 'browser_extension',
            'event_status_effect': 'none',
            'fixed_versions': [
              {
                'product_ids': ['wlr_prod_000058'],
                'track': 'browser extension',
                'version': '1.1.0'
              }
            ],
            'user_actions_required': ['update'],
            'affected_components': ['secret recovery phrase import flow'],
            'is_major_event': False,
            'notes': 'The official Rainbow release establishes that v1.1.0 contained the mitigation. WLR does not infer an affected-version range, exploitation, realized loss, Rainbow-specific severity, or the extension launch date from this source.'
          }

          source = {
            'id': 'wlr_src_000130',
            'entity_id': 'wlr_ent_000019',
            'product_ids': ['wlr_prod_000058'],
            'event_ids': ['wlr_ev_000079'],
            'product_id': 'wlr_prod_000058',
            'event_id': 'wlr_ev_000079',
            'source_type': 'release_notes',
            'title': 'Rainbow Extension v1.1.0',
            'url': 'https://github.com/rainbow-me/browser-extension/releases/tag/v1.1.0',
            'publisher': 'Rainbow',
            'published_at': '2023-06-15',
            'accessed_at': '2026-08-17',
            'reliability': 'high',
            'claim_scope': 'security_fix',
            'is_primary': True,
            'notes': 'Official Rainbow browser-extension release notes. The Security section states that the import flow was redesigned to mitigate the known Demonic vulnerability reported by Halborn.'
          }

          append_row(events_path, event)
          append_row(evidence_path, source)
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted Rainbow batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          assert len(events)==79
          assert len(evidence)==130
          e=next(row for row in events if row['id']=='wlr_ev_000079')
          assert e['entity_id']=='wlr_ent_000019'
          assert e['product_id']=='wlr_prod_000058'
          assert e['event_type']=='software_fix'
          assert e['event_date']=='2023-06-15'
          assert e['fixed_versions'][0]['version']=='1.1.0'
          assert 'impact_level' not in e and 'funds_affected' not in e and 'affected_versions' not in e
          s=next(row for row in evidence if row['id']=='wlr_src_000130')
          assert s['reliability']=='high' and s['is_primary'] is True
          assert s['claim_scope']=='security_fix'
          print('RAINBOW_DEMONIC_STAGE_OK events=79 evidence=130 remediation_expected=5')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed Rainbow Demonic mitigation history'
          git push origin HEAD:data/rainbow-demonic-mitigation
