name: Verify WLR PR65 Production

on:
  push:
    branches: [ops/pr65-production-verify]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact Cloudflare production deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          expected="c734e8ee55779ed2599e72289f8c9deb5614c26e"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          match=""
          for attempt in $(seq 1 40); do
            deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
            match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
            if [ -n "$match" ] && jq -e '.latest_stage.status == "success"' <<<"$match" >/dev/null; then break; fi
            echo "Waiting for exact deployment attempt=${attempt}"
            sleep 10
          done
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          echo "$match" | jq '{id,short_id,aliases,latest_stage,deployment_trigger}'

      - name: Verify public MyCrypto support state and derived Stats
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 https://wlr.badjoke-lab.com/data/products.json -o "$work/products.json"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 https://wlr.badjoke-lab.com/data/evidence.json -o "$work/evidence.json"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 https://wlr.badjoke-lab.com/data/stats.json -o "$work/stats.json"

          echo '=== PUBLIC MYCRYPTO PRODUCTS ==='
          jq -c '.[] | select(.id == "wlr_prod_000068" or .id == "wlr_prod_000069") | {id,product_name,status,support_status,official_url,last_verified_at,notes}' "$work/products.json"
          echo '=== PUBLIC SUPPORT EVIDENCE ==='
          jq -c '.[] | select(.id == "wlr_src_000121")' "$work/evidence.json"
          echo '=== PUBLIC SUPPORT COVERAGE ==='
          jq '{registry,support_known:.data_quality.products.support_status_known}' "$work/stats.json"

          check() { label="$1"; shift; echo "CHECK ${label}"; "$@"; echo "PASS ${label}"; }
          check 'MyCrypto Web App remains unknown' jq -e '.[] | select(.id == "wlr_prod_000068") | .support_status == "unknown"' "$work/products.json"
          check 'MyCrypto Desktop support ended' jq -e '.[] | select(.id == "wlr_prod_000069") | .support_status == "ended" and .last_verified_at == "2026-08-17"' "$work/products.json"
          check 'MyCrypto Desktop primary evidence' jq -e '.[] | select(.id == "wlr_src_000121") | .product_id == "wlr_prod_000069" and .url == "https://support.mycrypto.com/staying-safe/verifying-authenticity-of-desktop-app/" and .reliability == "high" and .is_primary == true and .claim_scope == "support_status"' "$work/evidence.json"
          check 'Registry totals' jq -e '.registry.entities == 25 and .registry.products == 69 and .registry.events == 73 and .registry.evidence == 121' "$work/stats.json"
          check 'Known support coverage' jq -e '.data_quality.products.support_status_known.count == 68 and .data_quality.products.support_status_known.denominator == 69' "$work/stats.json"
          check 'MyCrypto Desktop product route' curl -fsSL -o /dev/null https://wlr.badjoke-lab.com/product/mycrypto-desktop/
          check 'Official MyCrypto maintenance source' curl -fsSL -o /dev/null https://support.mycrypto.com/staying-safe/verifying-authenticity-of-desktop-app/
          echo 'PR65_PRODUCTION_VERIFY_OK evidence=121 support_known=68/69 mycrypto_desktop=ended mycrypto_web=unknown'
