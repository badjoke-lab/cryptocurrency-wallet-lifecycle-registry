name: Promote Wave 03 Thin History 6

on:
  push:
    branches:
      - promotion/coverage-recovery-wave-03-thin-history-6

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: node scripts/promote-wave-03-thin-history-6.mjs
      - run: npm run prebuild
      - run: npm run validate:records
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:series
      - run: npm run check:staging-boundary
      - name: Commit promoted canonical records and generated layers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data public/data public/version.json public/llms.txt public/ai.txt
          git add -u
          git commit -m "Promote Wave 03 thin-history batch 6 records"
          git push
