name: Verify WLR PR76 Production

on:
  push:
    branches: [ops/pr76-production-verify]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact deployment and public BlueWallet state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          expected="e17fa1cf391c4bf31e6b1fe8f1f00b558afa1361"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
          match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          echo "$match" | jq '{id,short_id,url,aliases,latest_stage,deployment_trigger}'

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          nonce="e17fa1cf-$(date +%s)"
          for name in events evidence stats; do
            curl -fsSL "https://wlr.badjoke-lab.com/data/${name}.json?verify=${nonce}" -o "$work/${name}.json"
          done

          python3 - "$work" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          events = json.loads((root / 'events.json').read_text())
          evidence = json.loads((root / 'evidence.json').read_text())
          stats = json.loads((root / 'stats.json').read_text())

          registry = stats['registry']
          assert registry['entities'] == 25
          assert registry['products'] == 69
          assert registry['events'] == 81
          assert registry['evidence'] == 135
          assert registry['incident_events'] == 17
          assert registry['remediation_events'] == 6
          assert stats['products']['launch_date']['count'] == 47
          assert stats['products']['launch_date']['denominator'] == 69
          assert stats['data_quality']['products']['support_status_known']['count'] == 68
          assert stats['data_quality']['products']['support_status_known']['denominator'] == 69

          event = next(e for e in events if e['id'] == 'wlr_ev_000081')
          assert event['entity_id'] == 'wlr_ent_000023'
          assert event['product_id'] == 'wlr_prod_000063'
          assert event['affected_product_ids'] == ['wlr_prod_000063']
          assert event['event_type'] == 'software_fix'
          assert event['event_date'] == '2025-01-31'
          assert event['event_date_basis'] == 'release'
          assert event['security_scope'] == 'mobile_app'
          assert event['event_status_effect'] == 'none'
          assert event['user_actions_required'] == ['update']
          assert event['fixed_versions'] == [{'product_ids':['wlr_prod_000063'],'track':'BlueWallet Mobile','version':'7.0.9'}]
          assert 'funds_affected' not in event
          assert 'affected_versions' not in event
          assert 'impact_level' not in event

          sources = {s['id']: s for s in evidence if s['id'] in {'wlr_src_000134','wlr_src_000135'}}
          assert set(sources) == {'wlr_src_000134','wlr_src_000135'}
          for source in sources.values():
              assert source['reliability'] == 'high'
              assert source['is_primary'] is True
              assert source['claim_scope'] == 'security_fix'
              assert source['event_id'] == 'wlr_ev_000081'
              assert source['product_id'] == 'wlr_prod_000063'
          assert sources['wlr_src_000134']['url'] == 'https://github.com/BlueWallet/BlueWallet/releases/tag/v7.0.9'
          assert sources['wlr_src_000135']['url'] == 'https://github.com/BlueWallet/BlueWallet/pull/7546'
          print('BLUEWALLET_PUBLIC_DATA_OK events=81 evidence=135 incidents=17 remediation=6')
          PY

          curl -fsSL -o /dev/null "https://wlr.badjoke-lab.com/wallet/bluewallet/?verify=${nonce}"
          curl -fsSL -o /dev/null "https://wlr.badjoke-lab.com/product/bluewallet-mobile/?verify=${nonce}"
          echo 'PR76_PRODUCTION_VERIFY_OK'
