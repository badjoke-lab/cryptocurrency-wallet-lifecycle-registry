name: Phase 9 Series Adapter Contract

on:
  pull_request:
    paths:
      - 'data/**'
      - 'public/data/series/**'
      - 'config/ledger-series-phase9-stage5-relationship-authority.json'
      - 'scripts/generate-series-adapter.mjs'
      - 'scripts/generate-stage5-relationships.mjs'
      - 'scripts/validate-series-adapter.mjs'
      - 'scripts/validate-stage5-relationships.mjs'
      - 'package.json'
      - '.github/workflows/phase9-series-adapter.yml'
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'public/data/series/**'
      - 'config/ledger-series-phase9-stage5-relationship-authority.json'
      - 'scripts/generate-series-adapter.mjs'
      - 'scripts/generate-stage5-relationships.mjs'
      - 'scripts/validate-series-adapter.mjs'
      - 'scripts/validate-stage5-relationships.mjs'
      - 'package.json'
      - '.github/workflows/phase9-series-adapter.yml'

permissions:
  contents: write

jobs:
  series-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --progress=false
      - name: Build native machine layer and production-derived Series output
        run: npm run prebuild
      - name: Regenerate Series adapter and reviewed relationships
        run: node scripts/generate-series-adapter.mjs && node scripts/generate-stage5-relationships.mjs
      - name: Validate Series adapter and reviewed relationships
        run: node scripts/validate-series-adapter.mjs && node scripts/validate-stage5-relationships.mjs
      - name: Commit regenerated tracked Series records for batch 08
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'promote/post-100-depth-batch-08'
        run: |
          git add public/data/series/records public/data/series/index.json
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'Regenerate Series records for batch 08'
            git push origin HEAD:promote/post-100-depth-batch-08
          fi
      - name: Fail on tracked Stage 3 envelope/index drift
        run: git diff --exit-code -- public/data/series/records public/data/series/index.json
