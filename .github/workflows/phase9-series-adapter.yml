name: Phase 9 Series Adapter Contract

on:
  pull_request:
    paths:
      - 'data/**'
      - 'public/data/series/**'
      - 'scripts/generate-series-adapter.mjs'
      - 'scripts/validate-series-adapter.mjs'
      - '.github/workflows/phase9-series-adapter.yml'
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - 'public/data/series/**'
      - 'scripts/generate-series-adapter.mjs'
      - 'scripts/validate-series-adapter.mjs'
      - '.github/workflows/phase9-series-adapter.yml'

permissions:
  contents: read

jobs:
  series-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --progress=false
      - name: Build native machine layer
        run: npm run prebuild
      - name: Regenerate Series adapter
        run: node scripts/generate-series-adapter.mjs
      - name: Validate Series adapter
        run: node scripts/validate-series-adapter.mjs
      - name: Fail on Series drift
        run: git diff --exit-code -- public/data/series
