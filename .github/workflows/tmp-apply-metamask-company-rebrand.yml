name: Apply MetaMask corporate rebrand update

on:
  push:
    branches:
      - data/metamask-company-rebrand-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply MetaMask corporate rebrand canonical update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/metamask-company-rebrand-20260910
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update canonical records
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          entities_path = root / 'data/entities.json'
          products_path = root / 'data/products.json'
          events_path = root / 'data/events.json'
          evidence_path = root / 'data/evidence.json'

          def load(path):
              return json.loads(path.read_text(encoding='utf-8'))

          def save(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          entities = load(entities_path)
          products = load(products_path)
          events = load(events_path)
          evidence = load(evidence_path)

          entity = next(item for item in entities if item['id'] == 'wlr_ent_000004')
          assert entity['canonical_name'] == 'MetaMask'
          assert entity['status'] == 'active'
          assert entity['developer_or_company'] == 'Consensys'
          entity['developer_or_company'] = 'MetaMask'
          entity['last_verified_at'] = '2026-09-10'
          entity['notes'] = (
              'Browser extension and mobile app are separate products because their distribution and security boundaries differ. '
              'On 2026-09-09 Consensys Software Inc. announced that it would continue as the same company under the MetaMask name, '
              'while the protocols and institutional infrastructure business would become a newly formed company carrying the Consensys name; '
              'completion of the separation is expected by the end of 2026.'
          )

          for product_id in ('wlr_prod_000019', 'wlr_prod_000020'):
              product = next(item for item in products if item['id'] == product_id)
              assert product['entity_id'] == 'wlr_ent_000004'
              assert product['status'] == 'active'
              product['last_verified_at'] = '2026-09-10'

          assert not any(item['id'] == 'wlr_ev_000267' for item in events)
          events.append({
              'id': 'wlr_ev_000267',
              'entity_id': 'wlr_ent_000004',
              'product_id': None,
              'affected_product_ids': ['wlr_prod_000019', 'wlr_prod_000020'],
              'event_type': 'rebranded',
              'event_date': '2026-09-09',
              'event_date_basis': 'announcement',
              'title': 'Consensys Software Inc. announced its rebrand as MetaMask and business separation',
              'description': (
                  'Consensys Software Inc. announced that it would continue as the same company under the MetaMask name, focused on the consumer platform, '
                  'while its protocols and institutional infrastructure business would become a newly formed company carrying the Consensys name. '
                  'Completion of the separation was expected by the end of 2026, and MetaMask said users\' app, assets, keys, and access were unchanged at announcement.'
              ),
              'confidence': 'high',
              'event_status_effect': 'none',
              'is_major_event': True,
              'user_actions_required': ['none'],
              'notes': 'This records the 2026-09-09 corporate rebrand and separation announcement, not completion of the legal and operational separation.'
          })

          for source_id in ('wlr_src_000544', 'wlr_src_000545'):
              assert not any(item['id'] == source_id for item in evidence)

          evidence.extend([
              {
                  'id': 'wlr_src_000544',
                  'entity_id': 'wlr_ent_000004',
                  'product_id': None,
                  'event_id': 'wlr_ev_000267',
                  'source_type': 'official_statement',
                  'title': 'Consensys Software Inc. to become two independent companies: MetaMask, the consumer platform, and Consensys, the protocols and institutional infrastructure company',
                  'url': 'https://metamask.io/news/consensys-software-inc-to-become-two-independent-companies-metamask-and-consensys',
                  'publisher': 'Consensys Software Inc. / MetaMask',
                  'published_at': '2026-09-09',
                  'accessed_at': '2026-09-10',
                  'reliability': 'high',
                  'claim_scope': 'rebrand',
                  'is_primary': True,
                  'notes': 'First-party corporate announcement establishing the CSI-to-MetaMask rebrand, creation of the new Consensys company, independent operation, and expected separation completion by the end of 2026.'
              },
              {
                  'id': 'wlr_src_000545',
                  'entity_id': 'wlr_ent_000004',
                  'product_id': None,
                  'event_id': 'wlr_ev_000267',
                  'source_type': 'official_blog',
                  'title': "MetaMask's next chapter",
                  'url': 'https://metamask.io/news/metamask-next-chapter',
                  'publisher': 'MetaMask / Joseph Lubin',
                  'published_at': '2026-09-09',
                  'accessed_at': '2026-09-10',
                  'reliability': 'high',
                  'claim_scope': 'rebrand',
                  'is_primary': True,
                  'notes': 'First-party leadership article confirming the two-company structure and explicitly stating that MetaMask users had no immediate app, asset, key, or access changes.'
              }
          ])

          save(entities_path, entities)
          save(products_path, products)
          save(events_path, events)
          save(evidence_path, evidence)
          PY

      - name: Regenerate committed public and machine-readable outputs
        run: npm run prebuild

      - name: Commit canonical update
        shell: bash
        run: |
          rm .github/workflows/tmp-apply-metamask-company-rebrand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply MetaMask corporate rebrand canonical update"
          git push origin HEAD:data/metamask-company-rebrand-20260910
