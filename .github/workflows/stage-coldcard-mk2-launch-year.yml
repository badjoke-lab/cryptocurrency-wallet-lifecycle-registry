name: Stage reviewed COLDCARD Mk2 launch year

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/coldcard-mk2-launch-year'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/coldcard-mk2-launch-year
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');
          const product = products.find(x => x.id === 'wlr_prod_000014');
          if (!product || product.entity_id !== 'wlr_ent_000003' || product.slug !== 'coldcard-mk2') throw new Error('Unexpected COLDCARD Mk2 identity');
          if (product.launch_date !== null && product.launch_date !== '2019') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2019';
          product.launch_date_precision = 'year';
          product.last_verified_at = '2026-08-18';
          product.notes = "Coinkite/Coldcard first-party history separates the older touch-key COLDCARD lineage from Mk2. Firmware updates through late 2018 still document touch sensitivity controls; Coinkite's 2019-01-28 article explicitly describes the new Mk2 and its mechanical buttons, and the official firmware repository adds Mk2-specific hardware pins and explicit is_mark2() hardware detection on 2019-02-08. WLR therefore records the Mk2 launch at 2019 year precision without asserting an exact first shipping or sale day.";
          const ev = {id:'wlr_ev_000113',entity_id:'wlr_ent_000003',product_id:'wlr_prod_000014',affected_product_ids:['wlr_prod_000014'],event_type:'product_released',event_date:'2019',event_date_basis:'release',title:'COLDCARD Mk2 released in 2019',description:'Coinkite first-party product history and official firmware hardware support establish the mechanical-key COLDCARD Mk2 lineage during 2019.',confidence:'high',event_status_effect:'active',is_major_event:true,notes:'Year precision only. Late-2018 firmware still documents the older touch-key hardware lineage; January/February 2019 first-party history establishes the Mk2 hardware boundary without one exact first sale or shipping day.'};
          const oldEv = events.find(x => x.id === ev.id); if (oldEv && JSON.stringify(oldEv)!==JSON.stringify(ev)) throw new Error('wlr_ev_000113 collision'); if(!oldEv) events.push(ev);
          const src1={id:'wlr_src_000178',entity_id:'wlr_ent_000003',product_id:'wlr_prod_000014',event_id:'wlr_ev_000113',source_type:'official_blog',title:'Keep Your Pins Long, and Your Peace of Mind Intact',url:'https://blog.coinkite.com/use-long-pins/',publisher:'Coinkite',published_at:'2019-01-28',accessed_at:'2026-08-18',reliability:'high',claim_scope:'launch_date',is_primary:true,notes:'First-party Coinkite article explicitly describing the new Coldcard Mk2, its mechanical buttons, and Mk2-specific hardware/firmware mitigations. Used to establish the 2019 product boundary, not an exact first sale day.'};
          const src2={id:'wlr_src_000179',entity_id:'wlr_ent_000003',product_id:'wlr_prod_000014',event_id:'wlr_ev_000113',source_type:'source_code',title:'Coldcard firmware Mark2 support',url:'https://github.com/Coldcard/firmware/commit/972d4782902352b551a89e1794245886df6ede46',publisher:'Coldcard',published_at:'2019-02-08',accessed_at:'2026-08-18',reliability:'high',claim_scope:'launch_date',is_primary:true,notes:'Official Coldcard firmware commit adding explicit is_mark2() hardware detection, with PA10 distinguishing Mk2 from previous revisions. Used as first-party corroboration for the 2019 Mk2 hardware lineage, not as an exact sale date.'};
          for(const src of [src1,src2]){const old=evidence.find(x=>x.id===src.id);if(old&&JSON.stringify(old)!==JSON.stringify(src))throw new Error(`${src.id} collision`);if(!old)evidence.push(src);}
          write('data/products.json',products);write('data/events.json',events);write('data/evidence.json',evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_prod_000014") | .launch_date == "2019" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000113") | .product_id == "wlr_prod_000014" and .event_date == "2019" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000178") | .event_id == "wlr_ev_000113" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000179") | .event_id == "wlr_ev_000113" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed COLDCARD Mk2 launch year'
          git push origin HEAD:review/coldcard-mk2-launch-year
