name: Stage reviewed BitBoxApp launch history

on:
  push:
    branches: [data/bitboxapp-launch-history]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/bitboxapp-launch-history
          fetch-depth: 0

      - name: Add BitBoxApp launch year, event, and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          products_path=Path('data/products.json')
          events_path=Path('data/events.json')
          evidence_path=Path('data/evidence.json')
          products=json.loads(products_path.read_text())
          events=json.loads(events_path.read_text())
          evidence=json.loads(evidence_path.read_text())

          assert len(products)==69 and len(events)==85 and len(evidence)==141
          p=next(x for x in products if x['id']=='wlr_prod_000031')
          assert p['entity_id']=='wlr_ent_000007' and p['slug']=='bitbox-app'
          assert p.get('launch_date') is None and p.get('launch_date_precision')=='approximate'
          assert not any(e.get('product_id')=='wlr_prod_000031' and e.get('event_type')=='product_released' for e in events)
          assert 'wlr_ev_000086' not in {e['id'] for e in events}
          assert 'wlr_src_000142' not in {s['id'] for s in evidence}

          lines=products_path.read_text().splitlines()
          idx=[i for i,line in enumerate(lines) if '"id":"wlr_prod_000031"' in line]
          assert len(idx)==1
          i=idx[0]
          old='"launch_date":null,"launch_date_precision":"approximate"'
          new='"launch_date":"2018","launch_date_precision":"year"'
          assert old in lines[i]
          lines[i]=lines[i].replace(old,new,1)
          products_path.write_text('\n'.join(lines)+'\n')

          def append_rows(path, rows):
              text=path.read_text(); stripped=text.rstrip(); assert stripped.endswith(']')
              body=stripped[:-1].rstrip()
              addition=',\n'+',\n'.join(json.dumps(row,ensure_ascii=False,separators=(',',':')) for row in rows)+'\n]'
              path.write_text(body+addition+'\n')

          event={
            'id':'wlr_ev_000086',
            'entity_id':'wlr_ent_000007',
            'product_id':'wlr_prod_000031',
            'affected_product_ids':['wlr_prod_000031'],
            'event_type':'product_released',
            'event_date':'2018',
            'event_date_basis':'release',
            'title':'BitBoxApp launched as BitBox companion application',
            'description':'BitBox states that the BitBoxApp was launched in 2018 as the companion application for its hardware-wallet ecosystem. The reviewed first-party retrospective establishes the launch year but not a month or day.',
            'confidence':'high',
            'event_status_effect':'active',
            'is_major_event':True,
            'notes':'WLR records year precision only. This event describes the BitBoxApp product lineage and does not alter hardware-product launch dates or the later Android general-release timeline.'
          }
          source={
            'id':'wlr_src_000142',
            'entity_id':'wlr_ent_000007',
            'product_ids':['wlr_prod_000031'],
            'event_ids':['wlr_ev_000086'],
            'product_id':'wlr_prod_000031',
            'event_id':'wlr_ev_000086',
            'source_type':'official_blog',
            'title':'BitBoxApp for Android: who needs a computer anyway?',
            'url':'https://blog.bitbox.swiss/en/bitboxapp-for-android-who-needs-a-computer-anyway/',
            'publisher':'BitBox',
            'published_at':'2020-07-21',
            'accessed_at':'2026-08-17',
            'reliability':'high',
            'claim_scope':'launch_date',
            'is_primary':True,
            'notes':'First-party retrospective explicitly stating that the BitBoxApp was launched in 2018. The 2020 article date is not treated as the app launch date.'
          }
          append_rows(events_path,[event])
          append_rows(evidence_path,[source])
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted BitBoxApp batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          p=next(x for x in products if x['id']=='wlr_prod_000031')
          assert p['launch_date']=='2018' and p['launch_date_precision']=='year'
          e=next(x for x in events if x['id']=='wlr_ev_000086')
          assert e['entity_id']=='wlr_ent_000007' and e['product_id']=='wlr_prod_000031'
          assert e['event_type']=='product_released' and e['event_date']=='2018' and e['event_date_basis']=='release'
          s=next(x for x in evidence if x['id']=='wlr_src_000142')
          assert s['product_id']=='wlr_prod_000031' and s['event_id']=='wlr_ev_000086'
          assert s['source_type']=='official_blog' and s['claim_scope']=='launch_date' and s['reliability']=='high' and s['is_primary'] is True
          assert s['published_at']=='2020-07-21'
          assert len(products)==69 and len(events)==86 and len(evidence)==142
          print('BITBOXAPP_LAUNCH_STAGE_OK products=69 events=86 evidence=142 launch_coverage_expected=50/69 incidents=18 remediation=7')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed BitBoxApp launch history'
          git push origin HEAD:data/bitboxapp-launch-history
