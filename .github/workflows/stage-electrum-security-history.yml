name: Stage Electrum 4.7.2 security history

on:
  push:
    branches: [data/electrum-4-7-2-security-history]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/electrum-4-7-2-security-history
          fetch-depth: 0

      - name: Add reviewed Electrum vulnerability and fix records
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          events_path = Path('data/events.json')
          evidence_path = Path('data/evidence.json')
          events_text = events_path.read_text()
          evidence_text = evidence_path.read_text()
          events = json.loads(events_text)
          evidence = json.loads(evidence_text)

          new_event_ids = ['wlr_ev_000074','wlr_ev_000075','wlr_ev_000076']
          new_evidence_ids = ['wlr_src_000122','wlr_src_000123','wlr_src_000124','wlr_src_000125']
          if any(row.get('id') in new_event_ids for row in events):
              raise SystemExit('one or more planned event IDs already exist')
          if any(row.get('id') in new_evidence_ids for row in evidence):
              raise SystemExit('one or more planned evidence IDs already exist')

          product_id = 'wlr_prod_000037'
          entity_id = 'wlr_ent_000010'
          affected_versions = ['4.6.0 <= x < 4.7.2']
          fixed_versions = [{'product_ids':[product_id],'track':'Electrum','version':'4.7.2'}]

          new_events = [
            {
              'id':'wlr_ev_000074','entity_id':entity_id,'product_id':product_id,'affected_product_ids':[product_id],
              'event_type':'vulnerability_disclosed','event_date':'2026-04-28','event_date_basis':'disclosure','disclosed_at':'2026-04-28',
              'title':'External plugin authorization bypass disclosed',
              'description':'Electrum disclosed an external-plugin authorization bypass that could allow a rogue local process with filesystem write access to the Electrum data directory to execute arbitrary plugin code inside Electrum. The official advisory states the external-plugin system was affected from Electrum 4.6.0 until the fix in 4.7.2.',
              'confidence':'high','impact_level':'medium','security_scope':'software','funds_affected':'unknown','event_status_effect':'none',
              'affected_versions':affected_versions,'fixed_versions':fixed_versions,'cve_ids':[],'is_major_event':False,
              'user_actions_required':['update'],'affected_components':['external plugin system'],
              'notes':'Official Electrum GHSA-vw94-r84p-66qf. Private disclosure was received 2026-03-26; public disclosure occurred 2026-04-28. No exploitation or actual fund loss is inferred.'
            },
            {
              'id':'wlr_ev_000075','entity_id':entity_id,'product_id':product_id,'affected_product_ids':[product_id],
              'event_type':'vulnerability_disclosed','event_date':'2026-04-28','event_date_basis':'disclosure','disclosed_at':'2026-04-28',
              'title':'Nostr Wallet Connect spending-limit bypass disclosed',
              'description':'Electrum disclosed two flaws in its Nostr Wallet Connect plugin that could let a malicious or compromised NWC client spend above the configured daily limit through concurrent budget checks and millisatoshi truncation. The official advisory states the NWC plugin was affected from Electrum 4.6.0 until the fix in 4.7.2.',
              'confidence':'high','impact_level':'low','security_scope':'software','funds_affected':'unknown','event_status_effect':'none',
              'affected_versions':affected_versions,'fixed_versions':fixed_versions,'cve_ids':[],'is_major_event':False,
              'user_actions_required':['update'],'affected_components':['Nostr Wallet Connect plugin'],
              'notes':'Official Electrum GHSA-q7m2-785w-r585. Private disclosure was received 2026-03-02; public disclosure occurred 2026-04-28. Potential overspending is described by the advisory; no actual exploitation or loss is inferred.'
            },
            {
              'id':'wlr_ev_000076','entity_id':entity_id,'product_id':product_id,'affected_product_ids':[product_id],
              'event_type':'software_fix','event_date':'2026-04-02','event_date_basis':'release',
              'title':'Electrum 4.7.2 released with plugin security fixes',
              'description':'Electrum 4.7.2 was released with fixes for the external-plugin authorization bypass and the Nostr Wallet Connect daily spending-limit bypass later documented in the project security advisories.',
              'confidence':'high','impact_level':'medium','security_scope':'software','funds_affected':'unknown','event_status_effect':'none',
              'affected_versions':affected_versions,'fixed_versions':fixed_versions,'cve_ids':[],'is_major_event':False,
              'user_actions_required':['update'],'affected_components':['external plugin system','Nostr Wallet Connect plugin'],
              'notes':'Both first-party Electrum security advisories state that version 4.7.2 was released on 2026-04-02 with the fixes included.'
            }
          ]

          ghsa_external = 'https://github.com/spesmilo/electrum/security/advisories/GHSA-vw94-r84p-66qf'
          ghsa_nwc = 'https://github.com/spesmilo/electrum/security/advisories/GHSA-q7m2-785w-r585'
          new_evidence = [
            {
              'id':'wlr_src_000122','entity_id':entity_id,'product_ids':[product_id],'event_ids':['wlr_ev_000074'],'product_id':product_id,'event_id':'wlr_ev_000074',
              'source_type':'official_security_advisory','title':'External Plugin authorization bypass: local code execution','url':ghsa_external,'publisher':'Electrum','published_at':'2026-04-28','accessed_at':'2026-08-17','reliability':'high','claim_scope':'vulnerability','is_primary':True,
              'notes':'First-party Electrum GitHub security advisory for GHSA-vw94-r84p-66qf; states affected range 4.6.0<=x<4.7.2 and patched version 4.7.2.'
            },
            {
              'id':'wlr_src_000123','entity_id':entity_id,'product_ids':[product_id],'event_ids':['wlr_ev_000075'],'product_id':product_id,'event_id':'wlr_ev_000075',
              'source_type':'official_security_advisory','title':'Nostr Wallet Connect plugin: daily spending limit bypass','url':ghsa_nwc,'publisher':'Electrum','published_at':'2026-04-28','accessed_at':'2026-08-17','reliability':'high','claim_scope':'vulnerability','is_primary':True,
              'notes':'First-party Electrum GitHub security advisory for GHSA-q7m2-785w-r585; states affected range 4.6.0<=x<4.7.2 and patched version 4.7.2.'
            },
            {
              'id':'wlr_src_000124','entity_id':entity_id,'product_ids':[product_id],'event_ids':['wlr_ev_000076'],'product_id':product_id,'event_id':'wlr_ev_000076',
              'source_type':'official_security_advisory','title':'External Plugin authorization bypass: local code execution','url':ghsa_external,'publisher':'Electrum','published_at':'2026-04-28','accessed_at':'2026-08-17','reliability':'high','claim_scope':'security_fix','is_primary':True,
              'notes':'Same first-party advisory is reused with a separate security_fix claim scope because its timeline explicitly states Electrum 4.7.2 was released on 2026-04-02 with the fix included.'
            },
            {
              'id':'wlr_src_000125','entity_id':entity_id,'product_ids':[product_id],'event_ids':['wlr_ev_000076'],'product_id':product_id,'event_id':'wlr_ev_000076',
              'source_type':'official_security_advisory','title':'Nostr Wallet Connect plugin: daily spending limit bypass','url':ghsa_nwc,'publisher':'Electrum','published_at':'2026-04-28','accessed_at':'2026-08-17','reliability':'high','claim_scope':'security_fix','is_primary':True,
              'notes':'Same first-party advisory is reused with a separate security_fix claim scope because its timeline explicitly states Electrum 4.7.2 was released on 2026-04-02 with the fixes included.'
            }
          ]

          def append_records(text, rows):
              closing = text.rfind(']')
              prefix = text[:closing].rstrip()
              separator = '' if prefix.endswith('[') else ','
              additions = ',\n'.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) for row in rows)
              return prefix + separator + '\n' + additions + '\n' + text[closing:]

          events_path.write_text(append_records(events_text, new_events))
          evidence_path.write_text(append_records(evidence_text, new_evidence))
          PY

          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py
          echo '=== ELECTRUM EVENTS ==='
          jq -c '.[] | select(.entity_id == "wlr_ent_000010") | {id,event_type,event_date,event_date_basis,title,impact_level,funds_affected,affected_versions,fixed_versions,user_actions_required,affected_components}' data/events.json
          echo '=== ELECTRUM NEW EVIDENCE ==='
          jq -c '.[] | select(.id == "wlr_src_000122" or .id == "wlr_src_000123" or .id == "wlr_src_000124" or .id == "wlr_src_000125") | {id,event_id,source_type,title,url,published_at,reliability,claim_scope,is_primary}' data/evidence.json
          git diff --check
          git diff -- data/events.json data/evidence.json

      - name: Commit staged Electrum security history
        run: |
          set -euo pipefail
          if git diff --quiet -- data/events.json data/evidence.json; then
            echo 'No security-history changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/evidence.json
          git commit -m 'Add reviewed Electrum 4.7.2 security history'
          git push origin HEAD:data/electrum-4-7-2-security-history
