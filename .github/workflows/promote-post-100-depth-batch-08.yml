name: Promote post-100 depth batch 08

on:
  push:
    branches:
      - promote/post-100-depth-batch-08

permissions:
  contents: write

jobs:
  promote:
    if: ${{ !contains(github.event.head_commit.message, '[batch08 promoted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: promote/post-100-depth-batch-08
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/promote_post_100_depth_batch_08.py
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npm run validate:records
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:stats
      - run: npm run coverage:audit
      - run: npm run build
      - name: Remove temporary promotion files
        run: |
          git rm scripts/promote_post_100_depth_batch_08.py
          git rm .github/workflows/promote-post-100-depth-batch-08.yml
      - name: Commit promoted canonical records
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/events.json data/evidence.json
          git commit -m 'Promote post-100 depth batch 08 [batch08 promoted]'
          git push origin HEAD:promote/post-100-depth-batch-08
