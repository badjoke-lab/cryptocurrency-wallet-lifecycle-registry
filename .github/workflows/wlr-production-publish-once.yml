name: WLR One-Time Production Publish
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wlr-production-publish-once.yml']
permissions:
  contents: read
concurrency:
  group: wlr-one-time-production-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build static site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Publish WLR production to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Required Cloudflare Actions credentials are unavailable."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy out --project-name cryptocurrency-wallet-lifecycle-registry --branch main --commit-hash "$GITHUB_SHA"
