name: Verify WLR PR69 Production

on:
  push:
    branches: [ops/pr69-production-verify]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve exact Cloudflare production deployment
        id: cf
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          expected="925492031fde9e65dee134b4571cb87e95d7f671"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          match=""
          for attempt in $(seq 1 60); do
            deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
            match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
            if [ -n "$match" ] && jq -e '.latest_stage.status == "success"' <<<"$match" >/dev/null; then break; fi
            echo "Waiting exact deployment attempt=${attempt}"
            sleep 10
          done
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          url="$(jq -r '.url' <<<"$match")"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"
          echo "$match" | jq '{id,short_id,url,aliases,latest_stage,deployment_trigger}'

      - name: Verify deployment-specific canonical totals
        env:
          DEPLOYMENT_URL: ${{ steps.cf.outputs.deployment_url }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL "${DEPLOYMENT_URL}/data/stats.json?verify=92549203" -o "$work/stats.json"
          jq '{registry,launch:.products.launch_date,support:.data_quality.products.support_status_known}' "$work/stats.json"
          jq -e '.registry.entities == 25 and .registry.products == 69 and .registry.events == 78 and .registry.evidence == 129 and .registry.incident_events == 16 and .registry.remediation_events == 4' "$work/stats.json" >/dev/null
          jq -e '.products.launch_date.count == 47 and .products.launch_date.denominator == 69' "$work/stats.json" >/dev/null
          jq -e '.data_quality.products.support_status_known.count == 68 and .data_quality.products.support_status_known.denominator == 69' "$work/stats.json" >/dev/null

      - name: Wait for custom domain exact content
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            nonce="92549203-${attempt}-$(date +%s)"
            if curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/stats.json?verify=${nonce}" -o "$work/stats.json"; then
              events="$(jq -r '.registry.events' "$work/stats.json")"
              evidence="$(jq -r '.registry.evidence' "$work/stats.json")"
              incidents="$(jq -r '.registry.incident_events' "$work/stats.json")"
              remediation="$(jq -r '.registry.remediation_events' "$work/stats.json")"
              echo "custom attempt=${attempt} events=${events} evidence=${evidence} incidents=${incidents} remediation=${remediation}"
              if [ "$events" = 78 ] && [ "$evidence" = 129 ] && [ "$incidents" = 16 ] && [ "$remediation" = 4 ]; then ready=1; break; fi
            fi
            sleep 10
          done
          test "$ready" -eq 1

      - name: Verify public Zengo records, routes and sources
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          nonce="$(date +%s)"
          for name in events evidence stats; do
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 "https://wlr.badjoke-lab.com/data/${name}.json?verify=${nonce}" -o "$work/${name}.json"
          done
          echo '=== ZENGO EVENTS ==='
          jq -c '.[] | select(.id == "wlr_ev_000077" or .id == "wlr_ev_000078") | {id,event_type,event_date,event_date_basis,title,impact_level,security_scope,funds_affected,cve_ids}' "$work/events.json"
          echo '=== ZENGO EVIDENCE ==='
          jq -c '.[] | select(.id == "wlr_src_000126" or .id == "wlr_src_000127" or .id == "wlr_src_000128" or .id == "wlr_src_000129") | {id,event_id,source_type,publisher,url,reliability,claim_scope,is_primary}' "$work/evidence.json"
          check() { label="$1"; shift; echo "CHECK ${label}"; "$@"; echo "PASS ${label}"; }
          check 'Zengo BitForge vulnerability' jq -e '.[] | select(.id == "wlr_ev_000077") | .event_type == "vulnerability_disclosed" and .event_date == "2023-08-09" and .event_date_basis == "disclosure" and .impact_level == "high" and .security_scope == "transaction_signing" and .funds_affected == "no" and (.cve_ids | index("CVE-2023-33242")) != null' "$work/events.json"
          check 'Zengo remediation confirmation' jq -e '.[] | select(.id == "wlr_ev_000078") | .event_type == "security_fix" and .event_date == "2023-08-10" and .event_date_basis == "announcement" and .funds_affected == "no" and (.cve_ids | index("CVE-2023-33242")) != null' "$work/events.json"
          check 'Four primary Zengo evidence' jq -e '[.[] | select(.id == "wlr_src_000126" or .id == "wlr_src_000127" or .id == "wlr_src_000128" or .id == "wlr_src_000129") | select(.reliability == "high" and .is_primary == true)] | length == 4' "$work/evidence.json"
          check 'Registry totals' jq -e '.registry.entities == 25 and .registry.products == 69 and .registry.events == 78 and .registry.evidence == 129 and .registry.incident_events == 16 and .registry.remediation_events == 4' "$work/stats.json"
          check 'Zengo wallet route' curl -fsSL -o /dev/null "https://wlr.badjoke-lab.com/wallet/zengo/?verify=${nonce}"
          check 'Zengo product route' curl -fsSL -o /dev/null "https://wlr.badjoke-lab.com/product/zengo-crypto-wallet/?verify=${nonce}"
          check 'Zengo BitForge source' curl -fsSL -o /dev/null https://zengo.com/bitforge-strengthening-zengos-security/
          check 'Fireblocks Lindell17 report' curl -fsSL -o /dev/null https://www.fireblocks.com/blog/lindell17-abort-vulnerability-technical-report
          echo 'PR69_PRODUCTION_VERIFY_OK events=78 evidence=129 incidents=16 remediation=4 zengo_cve=CVE-2023-33242'
