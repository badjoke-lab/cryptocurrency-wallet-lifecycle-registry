name: IZAKA-YA Wallet production closeout

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'public/**'
      - '.github/workflows/izakaya-production-closeout.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wlr-izakaya-production-closeout
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify IZAKA-YA Wallet human and machine publication
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 40); do
            wallet_html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://wlr.badjoke-lab.com/wallet/izaka-ya-wallet/?publication_closeout='"${attempt}" 2>/dev/null || true)"
            product_html="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://wlr.badjoke-lab.com/product/izaka-ya-wallet-app/?publication_closeout='"${attempt}" 2>/dev/null || true)"
            wallet_json="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://wlr.badjoke-lab.com/data/wallets/izaka-ya-wallet.json?publication_closeout='"${attempt}" 2>/dev/null || true)"
            product_json="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' 'https://wlr.badjoke-lab.com/data/products/izaka-ya-wallet-app.json?publication_closeout='"${attempt}" 2>/dev/null || true)"
            if grep -Fq 'Crypto Yield Archive — IZAKA-YA' <<<"$wallet_html" \
              && grep -Fq 'Stable or Gone — JPYR' <<<"$wallet_html" \
              && grep -Fq 'Historical Exchange Index — IZAKA-YA' <<<"$wallet_html" \
              && grep -Fq 'Crypto Yield Archive — IZAKA-YA' <<<"$product_html" \
              && jq -e '.record_key.platform_id? == null and (.record.id == "wlr_ent_000101" or .entity.id == "wlr_ent_000101" or .id == "wlr_ent_000101")' <<<"$wallet_json" >/dev/null 2>&1 \
              && jq -e '.product.id == "wlr_prod_000150" or .id == "wlr_prod_000150"' <<<"$product_json" >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 15
          done
          test "$ok" = 1

      - name: Close IZAKA-YA Wallet publication issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 275, body: `IZAKA-YA Wallet production closeout passed. Wallet/product human pages, machine records, and all three cross-registry links are live. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: 275, state: 'closed', state_reason: 'completed'});
