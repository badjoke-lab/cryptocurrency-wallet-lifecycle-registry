name: Compute Wave 03 Thin History 4
on:
  push:
    branches: [research/coverage-recovery-wave-03-thin-history-4]
permissions:
  contents: write
jobs:
  compute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute fresh-main one-event queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          entities=json.loads(Path('data/entities.json').read_text())
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          by_ent_products={}
          for p in products: by_ent_products.setdefault(p['entity_id'],[]).append(p)
          ev_count={}
          sole={}
          for e in events:
            ev_count[e['entity_id']]=ev_count.get(e['entity_id'],0)+1
            sole[e['entity_id']]=e
          evd_count={}
          for s in evidence: evd_count[s['entity_id']]=evd_count.get(s['entity_id'],0)+1
          rows=[]
          for ent in entities:
            if ev_count.get(ent['id'],0)!=1: continue
            ps=by_ent_products.get(ent['id'],[])
            ml=sum(1 for p in ps if not p.get('launch_date'))
            us=sum(1 for p in ps if p.get('support_status')=='unknown')
            ec=evd_count.get(ent['id'],0)
            score=ml*4+us*3+max(0,4-ec)
            rows.append({'entity_id':ent['id'],'canonical_name':ent['canonical_name'],'slug':ent.get('slug'),'wallet_type':ent.get('wallet_type'),'entity_status':ent.get('status'),'official_url':ent.get('official_url'),'product_count':len(ps),'products':[{'id':p['id'],'product_name':p['product_name'],'status':p.get('status'),'launch_date':p.get('launch_date'),'support_status':p.get('support_status'),'official_url':p.get('official_url')} for p in ps],'sole_event':{'id':sole[ent['id']]['id'],'product_id':sole[ent['id']].get('product_id'),'event_type':sole[ent['id']].get('event_type'),'event_date':sole[ent['id']].get('event_date'),'title':sole[ent['id']].get('title')},'evidence_count':ec,'missing_launch_count':ml,'unknown_support_count':us,'priority_score':score})
          rows.sort(key=lambda r:(-r['priority_score'],r['evidence_count'],r['entity_id']))
          out={'generated_from_main_sha':'04953b4ab585947fe106085d7265c3fbeec3d92d','authority':'current canonical branch state; historical Wave 03 queue IDs are not identity authority','one_event_count':len(rows),'selection_rule':'exactly one canonical event; priority_score = missing_launch*4 + unknown_support*3 + max(0,4-evidence_count), then evidence_count asc, entity_id asc','selected_first_10':rows[:10],'all_one_event_entities':rows}
          path=Path('data-staging/coverage/coverage-recovery-wave-03-thin-history-4.json'); path.parent.mkdir(parents=True,exist_ok=True); path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('ONE_EVENT_COUNT',len(rows)); print('TOP10',[(r['entity_id'],r['canonical_name'],r['priority_score']) for r in rows[:10]])
          PY
      - name: Remove temporary workflow and commit queue
        run: |
          rm .github/workflows/compute-wave-03-thin-history-4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Stage fresh-main Wave 03 thin-history batch 4 queue'
          git push origin HEAD:research/coverage-recovery-wave-03-thin-history-4
