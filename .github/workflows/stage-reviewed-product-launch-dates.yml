name: Stage reviewed product launch dates

on:
  push:
    branches: [fix/backfill-reviewed-product-launch-dates]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backfill-reviewed-product-launch-dates
          fetch-depth: 0

      - name: Apply reviewed launch dates without reformatting unrelated records
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/products.json')
          text = path.read_text()
          decoder = json.JSONDecoder()

          updates = {
              'wlr_prod_000044': {
                  'launch_date': '2026-02-27',
                  'launch_date_precision': 'day',
                  'last_verified_at': '2026-08-17',
                  'notes': 'Launch date is established by the reviewed February 27, 2026 first-party Tangem Mobile Wallet release event and official Tangem blog evidence.'
              },
              'wlr_prod_000049': {
                  'launch_date': '2022-08-16',
                  'launch_date_precision': 'day',
                  'last_verified_at': '2026-08-17',
                  'notes': 'Launch date is established by the reviewed August 16, 2022 first-party Exodus browser-extension release event and official Exodus announcement.'
              },
          }

          for target_id, fields in updates.items():
              pos = text.find('[') + 1
              found = False
              while True:
                  while pos < len(text) and text[pos] in ' \r\n\t,':
                      pos += 1
                  if pos >= len(text) or text[pos] == ']':
                      break
                  obj, end = decoder.raw_decode(text, pos)
                  if obj.get('id') == target_id:
                      for key, value in fields.items():
                          obj[key] = value
                      replacement = json.dumps(obj, ensure_ascii=False, separators=(',', ':'))
                      text = text[:pos] + replacement + text[end:]
                      found = True
                      break
                  pos = end
              if not found:
                  raise SystemExit(f'{target_id} not found')

          path.write_text(text)
          PY

          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py
          echo '=== TANGEM MOBILE ==='
          jq -c '.[] | select(.id == "wlr_prod_000044")' data/products.json
          echo '=== EXODUS WEB3 ==='
          jq -c '.[] | select(.id == "wlr_prod_000049")' data/products.json
          git diff --check
          git diff -- data/products.json

      - name: Commit reviewed launch dates
        run: |
          set -euo pipefail
          if git diff --quiet -- data/products.json; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json
          git commit -m 'Backfill reviewed product launch dates'
          git push origin HEAD:fix/backfill-reviewed-product-launch-dates
