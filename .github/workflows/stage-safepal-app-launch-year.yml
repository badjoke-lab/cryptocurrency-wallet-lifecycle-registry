name: Stage reviewed SafePal App launch year

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/safepal-app-launch-year'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/safepal-app-launch-year
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const product = products.find(x => x.id === 'wlr_prod_000073');
          if (!product || product.entity_id !== 'wlr_ent_000026' || product.slug !== 'safepal-app') throw new Error('Unexpected SafePal App identity');
          if (product.launch_date !== null && product.launch_date !== '2019') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2019';
          product.launch_date_precision = 'year';
          product.last_verified_at = '2026-08-18';
          product.notes = "SafePal's first-party 2019 history establishes an active SafePal App release lineage before the later software-wallet upgrade: a July 2019 DEX announcement refers to the SafePal App and an upcoming official App/firmware version, while a September 2019 progress update states that nine App versions had already been released. SafePal separately records May 2020 as the launch of the SafePal Software Wallet capability. WLR therefore records the App's initial launch as 2019 at year precision and treats the 2020 software-wallet milestone as a later capability expansion, not the App's initial release.";

          const ev = {
            id:'wlr_ev_000110', entity_id:'wlr_ent_000026', product_id:'wlr_prod_000073', affected_product_ids:['wlr_prod_000073'],
            event_type:'product_released', event_date:'2019', event_date_basis:'release',
            title:'SafePal App released in 2019',
            description:"SafePal's first-party 2019 history establishes an active mobile-app release lineage, including an official App version announcement and a later statement that nine App versions had already been released.",
            confidence:'high', event_status_effect:'active', is_major_event:true,
            notes:'Year precision only. The July 2019 source concerns a DEX-capable official App version and already refers to the SafePal App; it is not treated as the exact initial App launch day. The May 2020 Software Wallet milestone is modeled as a later capability expansion rather than the initial App release.'
          };
          const oldEv = events.find(x => x.id === ev.id);
          if (oldEv && JSON.stringify(oldEv) !== JSON.stringify(ev)) throw new Error('wlr_ev_000110 collision');
          if (!oldEv) events.push(ev);

          const src1 = {
            id:'wlr_src_000173', entity_id:'wlr_ent_000026', product_id:'wlr_prod_000073', event_id:'wlr_ev_000110',
            source_type:'official_blog', title:'Pre-announcement: Trade on DEX, with SafePal',
            url:'https://www.safepal.com/en/blog/pre-announcement-trade-on-dex-with-safepal', publisher:'SafePal', published_at:'2019-07-13', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'First-party SafePal article referring to users trading through the SafePal App and announcing an official App/firmware version for July 2019. Used to establish the 2019 App release lineage, not as proof that the announced DEX version date was the initial App launch day.'
          };
          const src2 = {
            id:'wlr_src_000174', entity_id:'wlr_ent_000026', product_id:'wlr_prod_000073', event_id:'wlr_ev_000110',
            source_type:'official_blog', title:'SafePal Progress Update',
            url:'https://www.safepal.com/en/blog/safepal-progress-update', publisher:'SafePal', published_at:'2019-09-11', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'First-party SafePal progress report stating that nine App versions and three firmware updates had already been released. This directly establishes an active SafePal App release lineage in 2019 while leaving the exact first public store-release day unresolved.'
          };
          for (const src of [src1, src2]) {
            const old = evidence.find(x => x.id === src.id);
            if (old && JSON.stringify(old) !== JSON.stringify(src)) throw new Error(`${src.id} collision`);
            if (!old) evidence.push(src);
          }

          write('data/products.json', products);
          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_prod_000073") | .launch_date == "2019" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000110") | .entity_id == "wlr_ent_000026" and .product_id == "wlr_prod_000073" and .event_type == "product_released" and .event_date == "2019" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000173") | .event_id == "wlr_ev_000110" and .source_type == "official_blog" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000174") | .event_id == "wlr_ev_000110" and .source_type == "official_blog" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed SafePal App launch year'
          git push origin HEAD:review/safepal-app-launch-year
