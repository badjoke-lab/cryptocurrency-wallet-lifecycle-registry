name: Promote Batch 06 Staging

on:
  pull_request:
    branches: [main]
    paths:
      - 'data-staging/candidates/post-100-depth-batch-06.json'
      - '.github/workflows/promote-batch06-staging.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.head_ref == 'promote/post-100-depth-batch-06'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - name: Validate candidate
        run: npm run validate:candidates
      - name: Render canonical promotion
        run: |
          set -euo pipefail
          rm -rf .promotion-preview
          python scripts/render_candidate_promotion.py --candidate data-staging/candidates/post-100-depth-batch-06.json --output-dir .promotion-preview
          cp .promotion-preview/events.json data/events.json
          cp .promotion-preview/evidence.json data/evidence.json
          npm run validate:records
          npm run validate:identity-evidence
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
      - name: Commit bounded generated delta
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events.json data/evidence.json \
            public/data/series/records/wallet--ngrave.json \
            public/data/series/records/product--ngrave-zero.json \
            public/data/series/records/wallet--cypherock.json \
            public/data/series/records/product--cypherock-x1.json \
            public/data/series/records/wallet--secux.json \
            public/data/series/records/product--secux-v20.json \
            public/data/series/registry.json
          if git diff --cached --quiet; then
            echo 'No generated delta to commit'
            exit 0
          fi
          git commit -m 'Promote reviewed batch 06 canonical history'
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin HEAD:"${GITHUB_HEAD_REF}"
