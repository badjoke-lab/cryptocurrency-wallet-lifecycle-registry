name: Compute Wave 03 Thin History 6

on:
  push:
    branches:
      - research/coverage-recovery-wave-03-thin-history-6

permissions:
  contents: write

jobs:
  compute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/compute-wave-03-thin-history-6.mjs
      - name: Commit queue
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data-staging/coverage/coverage-recovery-wave-03-thin-history-6.json
          git commit -m "Compute Wave 03 thin-history batch 6 queue"
          git push
