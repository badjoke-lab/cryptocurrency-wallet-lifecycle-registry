name: Validate Wave 02 candidates

on:
  push:
    branches:
      - research/coverage-recovery-wave-02
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:candidates
      - run: npm run test:candidates
      - run: npm run check:staging-boundary
