name: Promote Wave 01B Part1
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/promote-wave-01b-part1.mjs'
      - '.github/workflows/promote-wave-01b-part1.yml'
permissions:
  contents: write
jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/promote-wave-01b-part1.mjs
      - run: npm install --progress=false
      - run: npm run prebuild
      - run: npm run validate:all
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/evidence.json public/data
          git commit -m 'Promote Wave 01B part1 canonical data' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
