name: Promote IZAKA-YA Wallet Aug 24 lifecycle on main
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  promote:
    if: github.event.head_commit.message != 'Promote IZAKA-YA Wallet Aug 24 lifecycle canonical'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote reviewed candidate
        run: |
          node <<'NODE'
          const fs = require('fs');
          const candidatePath = 'data-staging/candidates/izaka-ya-wallet-20260824-restriction.json';
          if (!fs.existsSync(candidatePath)) process.exit(0);
          const c = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          const eventsPath = 'data/events.json';
          const evidencePath = 'data/evidence.json';
          const events = JSON.parse(fs.readFileSync(eventsPath, 'utf8'));
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          for (const row of c.records.events) if (!events.some(x => x.id === row.id)) events.push(row);
          for (const row of c.records.evidence) if (!evidence.some(x => x.id === row.id)) evidence.push(row);
          fs.writeFileSync(eventsPath, JSON.stringify(events, null, 2) + '\n');
          fs.writeFileSync(evidencePath, JSON.stringify(evidence, null, 2) + '\n');
          fs.unlinkSync(candidatePath);
          fs.unlinkSync('.github/workflows/promote-izakaya-wallet-20260824-main.yml');
          NODE
      - name: Validate canonical data
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund
          npm run validate:records
          npm run validate:identity-evidence
          npm run check:staging-boundary
          npm run build
      - name: Commit canonical promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Promote IZAKA-YA Wallet Aug 24 lifecycle canonical'
          git push origin HEAD:main
