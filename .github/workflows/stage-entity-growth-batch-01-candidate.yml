name: Stage entity growth batch 01 candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'research/entity-growth-batch-01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/entity-growth-batch-01
          fetch-depth: 0
      - name: Materialize reviewed research candidate
        run: |
          set -euo pipefail
          mkdir -p data-staging/candidates
          cat > /tmp/candidate.b64 <<'B64'

B64
          base64 -d /tmp/candidate.b64 | gunzip > data-staging/candidates/entity-growth-batch-01.json
          jq -e '.review_state == "researching" and (.records.entities|length)==10 and (.records.products|length)==10 and (.records.events|length)==0 and (.records.evidence|length)==21' data-staging/candidates/entity-growth-batch-01.json >/dev/null
          jq -e '[.records.entities[].id] == ["wlr_ent_000027","wlr_ent_000028","wlr_ent_000029","wlr_ent_000030","wlr_ent_000031","wlr_ent_000032","wlr_ent_000033","wlr_ent_000034","wlr_ent_000035","wlr_ent_000036"]' data-staging/candidates/entity-growth-batch-01.json >/dev/null
          jq -e '[.records.products[].id] == ["wlr_prod_000076","wlr_prod_000077","wlr_prod_000078","wlr_prod_000079","wlr_prod_000080","wlr_prod_000081","wlr_prod_000082","wlr_prod_000083","wlr_prod_000084","wlr_prod_000085"]' data-staging/candidates/entity-growth-batch-01.json >/dev/null
          jq -e '[.records.evidence[].id] | min == "wlr_src_000198" and max == "wlr_src_000218"' data-staging/candidates/entity-growth-batch-01.json >/dev/null
      - name: Commit candidate-only bundle
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-staging/candidates/entity-growth-batch-01.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add entity growth batch 01 candidate'
          git push origin HEAD:research/entity-growth-batch-01
