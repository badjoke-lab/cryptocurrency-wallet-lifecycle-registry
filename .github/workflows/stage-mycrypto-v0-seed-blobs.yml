name: Stage MyCrypto v0 seed promotion blobs
on:
  push:
    branches: [agent/v0-seed-mycrypto]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'badjoke-lab/cryptocurrency-wallet-lifecycle-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_candidates.py
      - run: python scripts/render_candidate_promotion.py --candidate data-staging/candidates/v0-seed-mycrypto.json --output-dir promotion-preview
      - name: Validate rendered counts
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path('promotion-preview')
          expected = {'entities.json':25,'products.json':69,'events.json':66,'evidence.json':112}
          for name, count in expected.items():
              rows = json.loads((root/name).read_text())
              assert len(rows) == count, (name, len(rows), count)
              print(f'COUNT {name} {len(rows)}')
          PY
      - name: Create unattached Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          root = pathlib.Path('promotion-preview')
          for name in ['entities.json','products.json','events.json','evidence.json']:
              raw = (root/name).read_bytes()
              payload = json.dumps({'content':base64.b64encode(raw).decode('ascii'),'encoding':'base64'}).encode()
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization':f'Bearer {token}',
                      'Accept':'application/vnd.github+json',
                      'X-GitHub-Api-Version':'2022-11-28',
                      'Content-Type':'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = json.load(response)
              print(f"PROMOTION_BLOB {name} {body['sha']} {len(raw)}")
          PY
