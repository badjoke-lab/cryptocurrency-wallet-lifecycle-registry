name: Verify WLR PR251 Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-main-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Pin exact merged main
        run: test "$(git rev-parse HEAD)" = "c24916eb96f09ee322b185cafaef360b762bea61"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npm run validate:records
      - run: npm run validate:machine-records
      - run: npm run validate:stats
      - run: npm run coverage:audit
      - run: npm run build
      - name: Verify Batch 07 records and Series
        run: |
          set -euo pipefail
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          git diff --exit-code -- public/data/series
          jq -e '.registry.entities == 100 and .registry.products == 149 and .registry.events == 147 and .registry.evidence == 374' public/data/stats.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000145") | .entity_id == "wlr_ent_000038" and .event_date == "2021-04-08" and .event_type == "other"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000146") | .entity_id == "wlr_ent_000039" and .event_date == "2021-05-20" and .event_type == "product_released"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000147") | .entity_id == "wlr_ent_000062" and .event_date == "2021-10-23" and .event_type == "product_released"' data/events.json >/dev/null
          jq -e '.record_counts.primary_records == 100 and .record_counts.native.events == 147 and .record_counts.native.evidence == 374' public/data/series/registry.json >/dev/null

  production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Resolve exact Cloudflare production deployment
        run: |
          set -euo pipefail
          expected="c24916eb96f09ee322b185cafaef360b762bea61"
          test "$(git rev-parse HEAD)" = "$expected"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          match=""
          for attempt in $(seq 1 100); do
            deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
            match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
            if [ -n "$match" ] && jq -e '.latest_stage.status == "success"' <<<"$match" >/dev/null; then break; fi
            echo "Waiting for exact deployment attempt=${attempt}"; sleep 10
          done
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and .deployment_trigger.metadata.commit_dirty == false and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          echo "$match" | jq '{id,url,aliases,latest_stage,deployment_trigger}'
      - name: Verify production canonical and Series
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            nonce="c24916eb-${attempt}-$(date +%s)"; ok=1
            for name in events evidence stats; do curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/${name}.json?verify=${nonce}" -o "$work/${name}.json" || ok=0; done
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/registry.json?verify=${nonce}" -o "$work/series-registry.json" || ok=0
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/records/wallet--dcent.json?verify=${nonce}" -o "$work/dcent.json" || ok=0
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/records/wallet--coolwallet.json?verify=${nonce}" -o "$work/coolwallet.json" || ok=0
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/records/wallet--hashpack.json?verify=${nonce}" -o "$work/hashpack.json" || ok=0
            if [ "$ok" -eq 1 ] && jq -e '.registry.events == 147 and .registry.evidence == 374' "$work/stats.json" >/dev/null 2>&1 && jq -e '.record_counts.native.events == 147 and .record_counts.native.evidence == 374' "$work/series-registry.json" >/dev/null 2>&1; then
              good=1
              jq -e '.[] | select(.id == "wlr_ev_000145")' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_ev_000146")' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_ev_000147")' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.events.records[] | select(.id == "wlr_ev_000145")' "$work/dcent.json" >/dev/null 2>&1 || good=0
              jq -e '.events.records[] | select(.id == "wlr_ev_000146")' "$work/coolwallet.json" >/dev/null 2>&1 || good=0
              jq -e '.events.records[] | select(.id == "wlr_ev_000147")' "$work/hashpack.json" >/dev/null 2>&1 || good=0
              if [ "$good" -eq 1 ]; then ready=1; echo "Public PR251 exact on attempt=${attempt}"; break; fi
            fi
            sleep 10
          done
          test "$ready" -eq 1
          echo 'PR251_PRODUCTION_VERIFY_OK entities=100 products=149 events=147 evidence=374 series_records=249'
