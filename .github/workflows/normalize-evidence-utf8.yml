name: Normalize evidence UTF-8
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/normalize-evidence-utf8.yml'
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Restore literal UTF-8 JSON representation
        run: |
          python - <<'PY'
          import json
          p='data/evidence.json'
          with open(p, encoding='utf-8') as f: rows=json.load(f)
          with open(p,'w',encoding='utf-8') as f:
              json.dump(rows,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run prebuild
      - run: npm run validate:records
      - run: npm run build
      - name: Commit normalization and generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/evidence.json public/data
          git commit -m 'Restore literal UTF-8 evidence JSON' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
