name: Stage directly evidenced hardware sales status

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/direct-hardware-sales-status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/direct-hardware-sales-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical corrections
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p,v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const evidence = read('data/evidence.json');

          const updates = [
            ['wlr_prod_000016','coldcard-mk4'],
            ['wlr_prod_000070','safepal-s1'],
            ['wlr_prod_000071','safepal-s1-pro'],
            ['wlr_prod_000072','safepal-x1'],
          ];
          for (const [id,slug] of updates) {
            const row = products.find(x => x.id === id);
            if (!row || row.slug !== slug) throw new Error(`Unexpected product identity ${id}`);
            if (row.sales_status !== 'unknown' && row.sales_status !== 'on_sale') throw new Error(`Unexpected sales status ${id}=${row.sales_status}`);
            row.sales_status = 'on_sale';
            row.last_verified_at = '2026-08-18';
          }
          const mk4 = products.find(x => x.id === 'wlr_prod_000016');
          mk4.notes = 'Current first-party COLDCARD Mk4 product page presents Mk4 as a current commercial product with a Buy Now purchase action. Mk4 remains supported alongside Mk5; WLR therefore records sales_status=on_sale without inferring a separate sales start or end date.';
          for (const id of ['wlr_prod_000070','wlr_prod_000071','wlr_prod_000072']) {
            const row = products.find(x => x.id === id);
            row.notes = `${row.product_name} is listed in SafePal's current first-party hardware-wallet store with a current price and active purchase action. WLR therefore records sales_status=on_sale while retaining the separately reviewed launch/support boundaries.`;
          }

          const sources = [
            {
              id:'wlr_src_000186', entity_id:'wlr_ent_000003', product_id:'wlr_prod_000016',
              source_type:'official_statement', title:'COLDCARD Mk4 — Secure Bitcoin Hardware Wallet',
              url:'https://coldcard.com/mk4', publisher:'COLDCARD / Coinkite', published_at:null, accessed_at:'2026-08-18',
              reliability:'high', claim_scope:'sales_status', is_primary:true,
              notes:'Current first-party Mk4 product page presents the device as a current product and includes a Buy Now commercial action. Used only for current sales status.'
            },
            {
              id:'wlr_src_000187', entity_id:'wlr_ent_000026', product_ids:['wlr_prod_000070','wlr_prod_000071','wlr_prod_000072'],
              source_type:'official_statement', title:'SafePal Products — Hardware Wallets',
              url:'https://www.safepal.com/en/store', publisher:'SafePal', published_at:null, accessed_at:'2026-08-18',
              reliability:'high', claim_scope:'sales_status', is_primary:true,
              notes:'Current first-party SafePal store lists S1, X1 and S1 Pro with prices and active Buy Now purchase actions. Used only for current sales status.'
            }
          ];
          for (const src of sources) {
            const old = evidence.find(x => x.id === src.id);
            if (old && JSON.stringify(old) !== JSON.stringify(src)) throw new Error(`${src.id} collision`);
            if (!old) evidence.push(src);
          }
          write('data/products.json', products);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          for id in wlr_prod_000016 wlr_prod_000070 wlr_prod_000071 wlr_prod_000072; do
            jq -e --arg id "$id" '.[] | select(.id == $id) | .sales_status == "on_sale" and .support_status == "supported" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          done
          jq -e '.[] | select(.id == "wlr_prod_000014") | .sales_status == "unknown"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_prod_000015") | .sales_status == "unknown"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_prod_000025") | .sales_status == "unknown"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000186") | .product_id == "wlr_prod_000016" and .claim_scope == "sales_status" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000187") | (.product_ids | sort) == (["wlr_prod_000070","wlr_prod_000071","wlr_prod_000072"] | sort) and .claim_scope == "sales_status" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          node scripts/build-stats.mjs
          jq -e '.registry.entities == 26 and .registry.products == 74 and .registry.events == 115 and .registry.evidence == 187' public/data/stats.json >/dev/null
          jq -e '.data_quality.products.sales_status_known.count == 71 and .data_quality.products.sales_status_known.denominator == 74 and .data_quality.products.sales_status_known.percentage == 95.9' public/data/stats.json >/dev/null
          jq -e '.entities.launch_date.count == 26 and .entities.launch_date.percentage == 100 and .products.launch_date.count == 74 and .products.launch_date.percentage == 100 and .data_quality.products.support_status_known.count == 74 and .data_quality.products.support_status_known.percentage == 100' public/data/stats.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resolve directly evidenced hardware sales status'
          git push origin HEAD:review/direct-hardware-sales-status
