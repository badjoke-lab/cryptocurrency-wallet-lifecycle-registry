name: Stage Rabby Desktop launch year on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/rabby-desktop-launch-year'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/rabby-desktop-launch-year
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');

          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');
          const product = products.find(x => x.id === 'wlr_prod_000056');
          if (!product || product.entity_id !== 'wlr_ent_000018' || product.slug !== 'rabby-desktop') throw new Error('Unexpected Rabby Desktop identity');
          if (product.launch_date !== null && product.launch_date !== '2022') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2022';
          product.launch_date_precision = 'year';
          product.last_verified_at = '2026-08-18';
          product.notes = 'First-party Rabby Desktop source history establishes a 2022 release series, including desktop release packaging in September and Release v0.1.1 on 2022-09-30. WLR records year precision only because the reviewed history does not establish a defensible exact initial launch day or a surfaced v0.1.0 release commit.';

          const ev = {id:'wlr_ev_000104',entity_id:'wlr_ent_000018',product_id:'wlr_prod_000056',affected_product_ids:['wlr_prod_000056'],event_type:'product_released',event_date:'2022',event_date_basis:'release',title:'Rabby Desktop released in 2022',description:"Rabby's official desktop source repository records desktop release packaging and a v0.1.1 release during 2022, establishing the desktop product as released by that year.",confidence:'high',event_status_effect:'active',is_major_event:true,notes:'Year precision only. The reviewed repository does not surface a v0.1.0 release commit, so WLR does not infer an exact initial launch day from the 2022-09-30 v0.1.1 commit.'};
          const oldEv = events.find(x => x.id === ev.id);
          if (oldEv && JSON.stringify(oldEv) !== JSON.stringify(ev)) throw new Error('wlr_ev_000104 collision');
          if (!oldEv) events.push(ev);

          const src = {id:'wlr_src_000163',entity_id:'wlr_ent_000018',product_id:'wlr_prod_000056',event_id:'wlr_ev_000104',source_type:'source_code',title:'Rabby Desktop Release v0.1.1',url:'https://github.com/RabbyHub/RabbyDesktop/commit/87c9f355475992cf7902b13900679fd50b3482e4',publisher:'RabbyHub',published_at:'2022-09-30',accessed_at:'2026-08-18',reliability:'high',claim_scope:'launch_date',is_primary:true,notes:'Official Rabby Desktop source-repository release commit establishing that the desktop product was in release during 2022. WLR uses it to support year-level launch chronology, not as proof of the exact initial launch day.'};
          const oldSrc = evidence.find(x => x.id === src.id);
          if (oldSrc && JSON.stringify(oldSrc) !== JSON.stringify(src)) throw new Error('wlr_src_000163 collision');
          if (!oldSrc) evidence.push(src);

          write('data/products.json', products);
          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify boundary
        run: |
          jq -e '.[] | select(.id == "wlr_prod_000056") | .launch_date == "2022" and .launch_date_precision == "year"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000104") | .event_date == "2022" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000163") | .event_id == "wlr_ev_000104" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed Rabby Desktop launch year'
          git push origin HEAD:review/rabby-desktop-launch-year
