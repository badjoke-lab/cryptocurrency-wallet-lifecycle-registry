name: Stage reviewed Keystone 3 Pro launch year

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/keystone-3-pro-launch-year'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/keystone-3-pro-launch-year
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const product = products.find(x => x.id === 'wlr_prod_000041');
          if (!product || product.entity_id !== 'wlr_ent_000013' || product.slug !== 'keystone-3-pro') throw new Error('Unexpected Keystone 3 Pro identity');
          if (product.launch_date !== null && product.launch_date !== '2023') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2023';
          product.launch_date_precision = 'year';
          product.last_verified_at = '2026-08-18';
          product.notes = "Keystone's first-party site and official firmware repository establish the Keystone 3 Pro / Keystone 3 release lineage during 2023. WLR records year precision only because the reviewed sources do not establish one defensible exact first public-release day for Keystone 3 Pro.";

          const ev = {
            id:'wlr_ev_000106', entity_id:'wlr_ent_000013', product_id:'wlr_prod_000041', affected_product_ids:['wlr_prod_000041'],
            event_type:'product_released', event_date:'2023', event_date_basis:'release',
            title:'Keystone 3 Pro released in 2023',
            description:"Keystone's first-party product history and official Keystone 3 firmware release lineage establish Keystone 3 Pro as a released product during 2023.",
            confidence:'high', event_status_effect:'active', is_major_event:true,
            notes:'Year precision only. A July 2023 Keystone article still described the launch as forthcoming, while Pro-specific first-party content and firmware release history appear later in 2023; no exact commercial launch day is inferred.'
          };
          const oldEv = events.find(x => x.id === ev.id);
          if (oldEv && JSON.stringify(oldEv) !== JSON.stringify(ev)) throw new Error('wlr_ev_000106 collision');
          if (!oldEv) events.push(ev);

          const src1 = {
            id:'wlr_src_000165', entity_id:'wlr_ent_000013', product_id:'wlr_prod_000041', event_id:'wlr_ev_000106',
            source_type:'official_blog', title:'Keystone 3 Pro: A Community-Centric Designed Hardware Wallet',
            url:'https://keyst.one/', publisher:'Keystone', published_at:'2023-09-04', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:"Keystone's own site indexes this Keystone 3 Pro-specific article as published on 2023-09-04. It supports the 2023 product boundary but is not treated as proof of an exact first release day."
          };
          const src2 = {
            id:'wlr_src_000166', entity_id:'wlr_ent_000013', product_id:'wlr_prod_000041', event_id:'wlr_ev_000106',
            source_type:'source_code', title:'Keystone 3 firmware release v0.9.0 lineage',
            url:'https://github.com/KeystoneHQ/keystone3-firmware/commit/fc0acf531cd5593ae08f745c8febeb35c939c317', publisher:'KeystoneHQ', published_at:'2023-09-11', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'Official Keystone 3 firmware repository commit merging release/v0.9.0 during 2023. Used as first-party release-lineage corroboration for year-level chronology, not as an exact commercial launch date.'
          };
          for (const src of [src1, src2]) {
            const old = evidence.find(x => x.id === src.id);
            if (old && JSON.stringify(old) !== JSON.stringify(src)) throw new Error(`${src.id} collision`);
            if (!old) evidence.push(src);
          }

          write('data/products.json', products);
          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_prod_000041") | .launch_date == "2023" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000106") | .entity_id == "wlr_ent_000013" and .product_id == "wlr_prod_000041" and .event_type == "product_released" and .event_date == "2023" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000165") | .event_id == "wlr_ev_000106" and .source_type == "official_blog" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000166") | .event_id == "wlr_ev_000106" and .source_type == "source_code" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed Keystone 3 Pro launch year'
          git push origin HEAD:review/keystone-3-pro-launch-year
