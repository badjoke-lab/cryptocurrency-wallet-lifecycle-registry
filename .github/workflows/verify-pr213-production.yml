name: Verify WLR PR213 Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-main-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Pin exact merged main
        run: test "$(git rev-parse HEAD)" = "fb6880a751d274949a2d4ca42f6b33b8fbfdf0ad"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npm run validate:records
      - run: npm run validate:candidates
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:structured-discovery
      - run: npm run test:natural-filters
      - run: npm run validate:natural-filters
      - run: npm run validate:compare
      - run: npm run validate:stats
      - run: npm run test:monitoring
      - run: npm run validate:monitoring
      - run: npm run test:candidates
      - run: npm run test:identity-evidence
      - run: npm run check:staging-boundary
      - run: npm run coverage:audit
      - run: npm run seed:gate
      - run: npm run cloudflare:config:print
      - run: npm run build
      - name: Verify Phase 9 Series contract at exact main
        run: |
          set -euo pipefail
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          git diff --exit-code -- public/data/series

  production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact-main expected state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fb6880a751d274949a2d4ca42f6b33b8fbfdf0ad"
          npm install --no-audit --no-fund
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          git diff --exit-code -- public/data/series
          jq -e '.registry.entities == 100 and .registry.products == 149 and .registry.events == 126 and .registry.evidence == 352 and .registry.incident_events == 25 and .registry.remediation_events == 9 and .registry.eol_events == 7' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_impact_level.count == 25 and .data_quality.events.incident_funds_affected.count == 25' public/data/stats.json >/dev/null
          jq -e '.record_counts.primary_records == 100 and .record_counts.native.events == 126 and .record_counts.native.evidence == 352' public/data/series/registry.json >/dev/null
          jq -e '.record_count == 249 and .record_counts.wallets == 100 and .record_counts.products == 149' public/data/series/index.json >/dev/null
          for n in $(seq 122 126); do id=$(printf 'wlr_ev_%06d' "$n"); jq -e --arg id "$id" '.[] | select(.id == $id)' data/events.json >/dev/null; done
          for n in $(seq 347 352); do id=$(printf 'wlr_src_%06d' "$n"); jq -e --arg id "$id" '.[] | select(.id == $id)' data/evidence.json >/dev/null; done
          jq -e '.[] | select(.id == "wlr_ev_000124") | .event_type == "unauthorized_access" and .event_date == "2023-06-03" and .impact_level == "high" and .funds_affected == "yes" and .security_scope == "other" and .product_id == null' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000125") | .event_type == "service_shutdown" and .event_date == "2024-04-24" and .event_status_effect == "dead"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000126") | .event_type == "phishing_campaign" and .event_date == "2018-04-24" and .funds_affected == "yes" and .security_scope == "other" and .product_id == null' data/events.json >/dev/null
      - name: Resolve exact Cloudflare production deployment
        id: cf
        run: |
          set -euo pipefail
          expected="fb6880a751d274949a2d4ca42f6b33b8fbfdf0ad"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          match=""
          for attempt in $(seq 1 100); do
            deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
            match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
            if [ -n "$match" ] && jq -e '.latest_stage.status == "success"' <<<"$match" >/dev/null; then break; fi
            echo "Waiting for exact deployment attempt=${attempt}"
            sleep 10
          done
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and .deployment_trigger.metadata.commit_dirty == false and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          echo "deployment_url=$(jq -r '.url' <<<"$match")" >> "$GITHUB_OUTPUT"
          echo "$match" | jq '{id,short_id,url,aliases,latest_stage,deployment_trigger}'
      - name: Verify exact deployment and public depth batch 01
        env:
          DEPLOYMENT_URL: ${{ steps.cf.outputs.deployment_url }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          curl -fsSL "${DEPLOYMENT_URL}/data/stats.json?verify=fb6880a7" -o "$work/deploy-stats.json"
          curl -fsSL "${DEPLOYMENT_URL}/data/series/registry.json?verify=fb6880a7" -o "$work/deploy-series-registry.json"
          jq -e '.registry.events == 126 and .registry.evidence == 352 and .registry.incident_events == 25' "$work/deploy-stats.json" >/dev/null
          jq -e '.record_counts.native.events == 126 and .record_counts.native.evidence == 352' "$work/deploy-series-registry.json" >/dev/null

          ready=0
          for attempt in $(seq 1 60); do
            nonce="fb6880a7-${attempt}-$(date +%s)"; ok=1
            for name in events evidence stats; do
              curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/${name}.json?verify=${nonce}" -o "$work/${name}.json" || ok=0
            done
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/registry.json?verify=${nonce}" -o "$work/series-registry.json" || ok=0
            if [ "$ok" -eq 1 ] && jq -e '.registry.events == 126 and .registry.evidence == 352 and .registry.incident_events == 25' "$work/stats.json" >/dev/null 2>&1 && jq -e '.record_counts.native.events == 126 and .record_counts.native.evidence == 352' "$work/series-registry.json" >/dev/null 2>&1; then
              good=1
              for n in $(seq 122 126); do id=$(printf 'wlr_ev_%06d' "$n"); jq -e --arg id "$id" '.[] | select(.id == $id)' "$work/events.json" >/dev/null 2>&1 || good=0; done
              for n in $(seq 347 352); do id=$(printf 'wlr_src_%06d' "$n"); jq -e --arg id "$id" '.[] | select(.id == $id)' "$work/evidence.json" >/dev/null 2>&1 || good=0; done
              jq -e '.[] | select(.id == "wlr_ev_000124") | .impact_level == "high" and .funds_affected == "yes" and .product_id == null' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_ev_000125") | .event_status_effect == "dead" and .event_date == "2024-04-24"' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_ev_000126") | .funds_affected == "yes" and .product_id == null' "$work/events.json" >/dev/null 2>&1 || good=0
              if [ "$good" -eq 1 ]; then ready=1; echo "Public depth batch exact on attempt=${attempt}"; break; fi
            fi
            sleep 10
          done
          test "$ready" -eq 1

          routes=(
            wallet/taho product/taho-browser-extension data/series/records/wallet--taho.json data/series/records/product--taho-browser-extension.json
            wallet/bitget-wallet product/bitget-wallet-mobile data/series/records/wallet--bitget-wallet.json data/series/records/product--bitget-wallet-mobile.json
            wallet/atomic-wallet data/series/records/wallet--atomic-wallet.json
            wallet/samourai-wallet product/samourai-wallet-android data/series/records/wallet--samourai-wallet.json data/series/records/product--samourai-wallet-android.json
            wallet/myetherwallet data/series/records/wallet--myetherwallet.json
            incidents
          )
          nonce="$(date +%s)"
          for route in "${routes[@]}"; do
            suffix="/"; [[ "$route" == *.json ]] && suffix=""
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://wlr.badjoke-lab.com/${route}${suffix}?verify=${nonce}")"
            test "$code" -ge 200 && test "$code" -lt 400
            echo "WLR route ${route}${suffix} -> ${code}"
          done
          echo 'PR213_PRODUCTION_VERIFY_OK entities=100 products=149 events=126 evidence=352 incidents=25 series_records=249'
