name: Promote Wave 03 E
on:
  push:
    branches: [promotion/coverage-recovery-wave-03-e]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote reviewed Wasabi record
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          events=json.loads(ep.read_text()); sources=json.loads(sp.read_text())
          event={'entity_id':'wlr_ent_000022','product_id':'wlr_prod_000062','affected_product_ids':['wlr_prod_000062'],'event_type':'other','event_date':'2026-08-29','event_date_basis':'release','title':'Wasabi Wallet v2.8.2 released','description':'The official WalletWasabi repository published Wasabi Wallet v2.8.2 on 2026-08-29 with signed release artifacts for supported desktop platforms, providing dated first-party evidence of continuing wallet maintenance.','confidence':'high','event_status_effect':'active','is_major_event':False}
          src={'entity_id':'wlr_ent_000022','product_id':'wlr_prod_000062','source_type':'release_notes','title':'Wasabi Wallet v2.8.2','url':'https://github.com/WalletWasabi/WalletWasabi/releases/tag/v2.8.2','publisher':'WalletWasabi','published_at':'2026-08-29','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official WalletWasabi GitHub release published 2026-08-29 with signed packaged artifacts.'}
          if src['url'] in {x['url'] for x in sources}: print('SKIP duplicate URL'); raise SystemExit(0)
          key=(event['entity_id'],event['product_id'],event['event_type'],event['event_date'],event['title'])
          if key in {(x.get('entity_id'),x.get('product_id'),x.get('event_type'),x.get('event_date'),x.get('title')) for x in events}: print('SKIP duplicate event'); raise SystemExit(0)
          ne=max(int(x['id'].split('_')[-1]) for x in events)+1; ns=max(int(x['id'].split('_')[-1]) for x in sources)+1
          eid=f'wlr_ev_{ne:06d}'; sid=f'wlr_src_{ns:06d}'; event['id']=eid; src['id']=sid; src['event_id']=eid
          events.append(event); sources.append(src)
          ep.write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n'); sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          print('PROMOTED',eid,sid)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate and validate
        run: |
          npm run prebuild
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote Wasabi Wave 03 record'
          git push origin HEAD:promotion/coverage-recovery-wave-03-e
