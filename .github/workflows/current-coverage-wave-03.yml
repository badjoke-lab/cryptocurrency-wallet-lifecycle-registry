name: Audit current Wave 03 coverage
on:
  push:
    branches: [audit/current-coverage-wave-03]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit all Wave 03 identities
        run: |
          python3 - <<'PY'
          import json
          E=json.load(open('data/entities.json')); P=json.load(open('data/products.json')); V=json.load(open('data/events.json')); S=json.load(open('data/evidence.json'))
          em={e['id']:e for e in E}; pm={p['id']:p for p in P}
          print('WAVE03 181-198')
          for v in V:
            try:n=int(v['id'].split('_')[-1])
            except:continue
            if 181 <= n <= 198:
              e=em.get(v.get('entity_id'),{}); p=pm.get(v.get('product_id'),{}) if v.get('product_id') else {}
              print(v['id'],'ENTITY',v.get('entity_id'),e.get('canonical_name'),'PRODUCT',v.get('product_id'),p.get('product_name'),'TITLE',v.get('title'))
          print('ENTITY LEVEL EVENT EXAMPLES')
          count=0
          for v in V:
            if not v.get('product_id'):
              print(v['id'],v.get('entity_id'),v.get('affected_product_ids'),v.get('title')); count+=1
              if count>=10:break
          PY
