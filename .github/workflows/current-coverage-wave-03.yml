name: Audit current Wave 03 coverage
on:
  push:
    branches: [audit/current-coverage-wave-03]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact target identities
        run: |
          python3 - <<'PY'
          import json
          E=json.load(open('data/entities.json')); P=json.load(open('data/products.json'))
          em={e['id']:e for e in E}
          needles=['blockstream','green','airgap','unstoppable','taho','nightly','xverse']
          print('NAME MATCHES')
          for p in P:
            text=' '.join(str(p.get(k,'')) for k in ('slug','product_name','official_url','source_code_url')).lower()
            if any(n in text for n in needles):
              e=em[p['entity_id']]
              print(p['id'],p['entity_id'],e.get('slug'),e.get('canonical_name'),'|',p.get('slug'),p.get('product_name'))
          print('OLD IDS 118-122,125,136')
          for p in P:
            if p['id'] in {'wlr_prod_000118','wlr_prod_000119','wlr_prod_000120','wlr_prod_000121','wlr_prod_000122','wlr_prod_000125','wlr_prod_000136'}:
              e=em[p['entity_id']]
              print(p['id'],p['entity_id'],e.get('slug'),e.get('canonical_name'),'|',p.get('slug'),p.get('product_name'))
          PY
