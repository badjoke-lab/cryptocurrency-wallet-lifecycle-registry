name: Stage reviewed post-100 depth batch 02

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/post-100-depth-batch-02'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/post-100-depth-batch-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund
      - name: Apply manually reviewed fixed records and Ctrl current-state correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v)+'\n');
          const entities=read('data/entities.json');
          const products=read('data/products.json');
          const events=read('data/events.json');
          const evidence=read('data/evidence.json');
          if(entities.length!==100||products.length!==149||events.length!==126||evidence.length!==352) throw new Error(`unexpected base counts e=${entities.length} p=${products.length} ev=${events.length} s=${evidence.length}`);
          const E=[
            {"id":"wlr_ev_000127","entity_id":"wlr_ent_000036","product_id":"wlr_prod_000085","affected_product_ids":["wlr_prod_000085"],"event_type":"rebranded","event_date":"2017-10-28","event_date_basis":"announcement","title":"Airbitz announced its rebrand to Edge","description":"Airbitz announced that the wallet company and platform were becoming Edge while carrying the existing client-side security and wallet lineage into the new brand.","confidence":"high","event_status_effect":"none","is_major_event":true,"notes":"This is an entity/product-lineage rebrand event, not the public launch date of the later Edge Wallet release."},
            {"id":"wlr_ev_000128","entity_id":"wlr_ent_000063","product_id":"wlr_prod_000112","affected_product_ids":["wlr_prod_000112"],"event_type":"rebranded","event_date":"2023-05-26","event_date_basis":"announcement","title":"XUMM announced its rebrand to Xaman","description":"The XUMM wallet team announced the Xaman brand and a gradual transition while preserving the existing wallet functionality and operational lineage.","confidence":"high","event_status_effect":"none","is_major_event":true,"notes":"The rebrand announcement does not reset the wallet/product launch chronology."},
            {"id":"wlr_ev_000129","entity_id":"wlr_ent_000052","product_id":"wlr_prod_000101","affected_product_ids":["wlr_prod_000101"],"event_type":"rebranded","event_date":"2024-11-20","event_date_basis":"announcement","title":"Crypto.com DeFi Wallet became Crypto.com Onchain","description":"Crypto.com announced a new Crypto.com Onchain identity for its existing non-custodial DeFi Wallet lineage.","confidence":"high","event_status_effect":"none","is_major_event":true,"notes":"This records brand continuity only. It is not treated as a new wallet or selected-product launch."},
            {"id":"wlr_ev_000130","entity_id":"wlr_ent_000069","product_id":"wlr_prod_000118","affected_product_ids":["wlr_prod_000118"],"event_type":"rebranded","event_date":"2025-04-24","event_date_basis":"announcement","title":"Sui Wallet and Stashed unified under the Slush brand","description":"Mysten Labs announced that Sui Wallet and Stashed were becoming Slush, with existing Sui Wallet users receiving the new name and interface through the standard update path rather than a separate wallet migration.","confidence":"high","event_status_effect":"none","is_major_event":true,"notes":"WLR uses `rebranded` rather than `merged` because the selected existing wallet product continues through the standard update path under the Slush identity; Stashed functionality is acknowledged in the description without creating an unsupported second canonical product relationship."},
            {"id":"wlr_ev_000131","entity_id":"wlr_ent_000059","product_id":"wlr_prod_000108","affected_product_ids":["wlr_prod_000108"],"event_type":"service_shutdown","event_date":"2026-08-03","event_date_basis":"effective","title":"Ctrl Wallet shut down normal wallet functionality","description":"Ctrl announced a permanent shutdown: after removal from app and browser-extension stores on July 7, 2026, normal wallet functionality remained available through August 2 and from August 3 only recovery-phrase export remained while wallet features were disabled.","confidence":"high","event_status_effect":"dead","is_major_event":true,"notes":"The surviving recovery-phrase export path is a recovery mechanism, not normal wallet operation. The canonical Ctrl entity is therefore corrected to dead and the extension product to discontinued/support ended as of 2026-08-03."}
          ];
          const S=[
            {"id":"wlr_src_000353","entity_id":"wlr_ent_000036","product_id":"wlr_prod_000085","event_id":"wlr_ev_000127","source_type":"official_blog","title":"Airbitz is now Edge!","url":"https://edge.app/blog/company-news/airbitz-is-now-edge/","publisher":"Edge","published_at":"2017-10-28","accessed_at":"2026-08-20","reliability":"high","claim_scope":"rebrand","is_primary":true,"notes":"First-party Edge announcement explicitly states that Airbitz is now Edge while carrying forward the company's client-side security platform and wallet lineage."},
            {"id":"wlr_src_000354","entity_id":"wlr_ent_000063","product_id":"wlr_prod_000112","event_id":"wlr_ev_000128","source_type":"official_blog","title":"XUMM evolves into a new era: Welcome Xaman","url":"https://xaman.app/blog/xumm-evolves-into-a-new-era-welcome-xaman","publisher":"Xaman","published_at":"2023-05-26","accessed_at":"2026-08-20","reliability":"high","claim_scope":"rebrand","is_primary":true,"notes":"First-party Xaman announcement explicitly introduces the XUMM-to-Xaman rebrand and describes a gradual transition without a new wallet lineage."},
            {"id":"wlr_src_000355","entity_id":"wlr_ent_000052","product_id":"wlr_prod_000101","event_id":"wlr_ev_000129","source_type":"official_blog","title":"Introducing Crypto.com Onchain: The New and Improved DeFi Wallet","url":"https://crypto.com/uk/product-news/introducing-crypto-com-onchain-the-new-and-improved-defi-wallet","publisher":"Crypto.com","published_at":"2024-11-20","accessed_at":"2026-08-20","reliability":"high","claim_scope":"rebrand","is_primary":true,"notes":"First-party Crypto.com announcement says the existing DeFi Wallet received a new identity as Crypto.com Onchain and continues as the non-custodial wallet product."},
            {"id":"wlr_src_000356","entity_id":"wlr_ent_000069","product_id":"wlr_prod_000118","event_id":"wlr_ev_000130","source_type":"official_blog","title":"Sui Wallet and Stashed are Now Slush","url":"https://www.mystenlabs.com/blog/sui-wallet-and-stashed-are-now-slush","publisher":"Mysten Labs","published_at":"2025-04-24","accessed_at":"2026-08-20","reliability":"high","claim_scope":"rebrand","is_primary":true,"notes":"First-party Mysten Labs announcement states Sui Wallet and Stashed are now Slush and says existing Sui Wallet users receive the change through a standard update without a new download or account migration."},
            {"id":"wlr_src_000357","entity_id":"wlr_ent_000059","product_id":"wlr_prod_000108","event_id":"wlr_ev_000131","source_type":"official_blog","title":"Ctrl Wallet Deprecation: What You Need to Know","url":"https://ctrl.xyz/news/ctrl-wallet-deprecation-what-you-need-to-know/","publisher":"Ctrl","published_at":"2026-07-07","accessed_at":"2026-08-20","reliability":"high","claim_scope":"discontinuation","is_primary":true,"notes":"First-party Ctrl notice states the wallet is permanently shutting down, was removed from stores on July 7, remains normally functional only through August 2, and from August 3 allows only recovery-phrase export while wallet features are disabled."}
          ];
          const add=(arr,row)=>{const old=arr.find(x=>x.id===row.id);if(old&&JSON.stringify(old)!==JSON.stringify(row))throw new Error(`collision ${row.id}`);if(!old)arr.push(row)};
          E.forEach(x=>add(events,x)); S.forEach(x=>add(evidence,x));
          const ctrl=entities.find(x=>x.id==='wlr_ent_000059');
          const ctrlProduct=products.find(x=>x.id==='wlr_prod_000108');
          if(!ctrl||!ctrlProduct) throw new Error('missing Ctrl canonical records');
          if(ctrl.slug!=='ctrl-wallet'||ctrlProduct.slug!=='ctrl-wallet-extension') throw new Error('Ctrl identity boundary changed');
          ctrl.status='dead';
          ctrl.discontinued_date='2026-08-03';
          ctrl.last_verified_at='2026-08-20';
          ctrl.summary='Historical non-custodial multichain wallet ecosystem formerly branded XDEFI Wallet; normal Ctrl Wallet functionality was shut down in August 2026.';
          ctrl.notes="First-party XDEFI/Ctrl material preserves one wallet lineage. Ctrl's 2026-07-07 deprecation notice states permanent shutdown: store distribution ended July 7, normal functionality ended after August 2, and from 2026-08-03 only recovery-phrase export remains. WLR therefore records the wallet entity as dead from the effective shutdown date.";
          ctrlProduct.status='discontinued';
          ctrlProduct.support_status='ended';
          ctrlProduct.discontinued_date='2026-08-03';
          ctrlProduct.last_verified_at='2026-08-20';
          ctrlProduct.summary='Discontinued Ctrl browser wallet extension, continuing the former XDEFI Wallet extension lineage; from 2026-08-03 only recovery-phrase export remains.';
          ctrlProduct.notes="Selected extension boundary only; Ctrl mobile apps are separate. The 2024 rebrand is not treated as initial extension launch. Ctrl removed the wallet from stores on 2026-07-07, left normal wallet functionality available through 2026-08-02, and from 2026-08-03 disabled wallet features except recovery-phrase export. WLR records the extension as discontinued with support ended.";
          if(events.length!==131||evidence.length!==357) throw new Error(`unexpected promoted counts events=${events.length} evidence=${evidence.length}`);
          write('data/entities.json',entities);write('data/products.json',products);write('data/events.json',events);write('data/evidence.json',evidence);
          NODE
      - name: Validate canonical and regenerate Series adapter
        run: |
          set -euo pipefail
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:structured-discovery
          npm run validate:stats
          npm run coverage:audit
          npm run seed:gate
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          npm run build
          jq -e '.registry.entities == 100 and .registry.products == 149 and .registry.events == 131 and .registry.evidence == 357 and .registry.incident_events == 25 and .registry.remediation_events == 9 and .registry.eol_events == 7' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_impact_level.count == 25 and .data_quality.events.incident_funds_affected.count == 25' public/data/stats.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ent_000059") | .status == "dead" and .discontinued_date == "2026-08-03"' data/entities.json >/dev/null
          jq -e '.[] | select(.id == "wlr_prod_000108") | .status == "discontinued" and .support_status == "ended" and .sales_status == "not_applicable" and .discontinued_date == "2026-08-03"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000131") | .event_type == "service_shutdown" and .event_status_effect == "dead" and .event_date_basis == "effective"' data/events.json >/dev/null
          jq -e '.record_counts.primary_records == 100 and .record_counts.native.events == 131 and .record_counts.native.evidence == 357' public/data/series/registry.json >/dev/null
          jq -e '.record_count == 249 and .record_counts.wallets == 100 and .record_counts.products == 149' public/data/series/index.json >/dev/null
      - name: Commit explicit canonical and deterministic Series edits
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entities.json data/products.json data/events.json data/evidence.json public/data/series
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed post-100 depth batch 02'
          git push origin HEAD:review/post-100-depth-batch-02
