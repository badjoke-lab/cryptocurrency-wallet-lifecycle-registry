name: Stage Sparrow issue impact fields

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/sparrow-issue-impact-fields'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/sparrow-issue-impact-fields
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const events = JSON.parse(fs.readFileSync('data/events.json', 'utf8'));
          const event = events.find(x => x.id === 'wlr_ev_000082');
          if (!event || event.entity_id !== 'wlr_ent_000021' || event.product_id !== 'wlr_prod_000061' || event.event_type !== 'software_issue') {
            throw new Error('Unexpected Sparrow event identity');
          }
          if (event.impact_level && event.impact_level !== 'medium') throw new Error(`Unexpected impact ${event.impact_level}`);
          if (event.funds_affected && event.funds_affected !== 'unknown') throw new Error(`Unexpected funds ${event.funds_affected}`);
          event.impact_level = 'medium';
          event.funds_affected = 'unknown';
          event.notes = 'WLR records this as a software issue rather than a CVE or exploit. The reviewed sources describe a reproducible but very narrow local crash/interruption window. The wallet file can become unreadable; retained seed material permits recovery, while a corrupted wallet file that is the only remaining seed-material copy can create a serious loss-of-access scenario. Maintainer Craig Raw characterized practical risk as mostly theoretical because the race window appeared to be only single-digit milliseconds under normal load. No confirmed fund loss is established, but the sources do not support a no-funds-affected claim, so funds_affected remains unknown. No general affected-version range is inferred.';
          fs.writeFileSync('data/events.json', JSON.stringify(events) + '\n');
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_ev_000082") | .impact_level == "medium" and .funds_affected == "unknown" and .security_scope == "software" and .is_major_event == false and (((.affected_versions // [])|length)==0) and (((.affected_version_rules // [])|length)==0)' data/events.json >/dev/null
          node scripts/build-stats.mjs
          jq -e '.registry.entities == 26 and .registry.products == 74 and .registry.events == 115 and .registry.evidence == 188' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_impact_level.count == 19 and .data_quality.events.incident_impact_level.denominator == 19 and .data_quality.events.incident_impact_level.percentage == 100' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_funds_affected.count == 19 and .data_quality.events.incident_funds_affected.denominator == 19 and .data_quality.events.incident_funds_affected.percentage == 100' public/data/stats.json >/dev/null
          jq -e '.data_quality.products.sales_status_known.count == 72 and .data_quality.products.sales_status_known.percentage == 97.3' public/data/stats.json >/dev/null
      - name: Commit canonical file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Complete Sparrow issue impact fields'
          git push origin HEAD:review/sparrow-issue-impact-fields
