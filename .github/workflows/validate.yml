name: Validate WLR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply batch 08 canonical promotion on promotion branch only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'promote/post-100-depth-batch-08'
        run: python scripts/promote_post_100_depth_batch_08.py
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npm run validate:records
      - run: npm run validate:candidates
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:structured-discovery
      - run: npm run test:natural-filters
      - run: npm run validate:natural-filters
      - run: npm run validate:compare
      - run: npm run validate:stats
      - run: npm run test:monitoring
      - run: npm run validate:monitoring
      - run: npm run test:candidates
      - run: npm run test:identity-evidence
      - run: npm run check:staging-boundary
      - run: npm run coverage:audit
      - run: npm run seed:gate
      - run: npm run cloudflare:config:print
      - run: npm run build
      - name: Commit validated canonical promotion and remove temporary machinery
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'promote/post-100-depth-batch-08'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout origin/main -- .github/workflows/validate.yml
          git rm -f .github/workflows/promote-post-100-depth-batch-08.yml scripts/promote_post_100_depth_batch_08.py
          git add data/products.json data/events.json data/evidence.json .github/workflows/validate.yml
          git commit -m 'Promote post-100 depth batch 08 [batch08 promoted]'
          git push origin HEAD:promote/post-100-depth-batch-08
