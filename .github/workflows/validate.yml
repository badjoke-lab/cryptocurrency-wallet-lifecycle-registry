name: Validate WLR
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - name: Apply bounded Phantom Sui promotion
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'promote/phantom-sui-announcement'
        run: |
          node scripts/promote-phantom-sui-announcement.mjs
          npm run prebuild
      - run: npm run validate:records
      - run: npm run validate:candidates
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:structured-discovery
      - run: npm run test:natural-filters
      - run: npm run validate:natural-filters
      - run: npm run validate:compare
      - run: npm run validate:stats
      - run: npm run test:monitoring
      - run: npm run validate:monitoring
      - run: npm run test:candidates
      - run: npm run test:identity-evidence
      - run: npm run check:staging-boundary
      - run: npm run coverage:audit
      - run: npm run seed:gate
      - run: npm run cloudflare:config:print
      - run: npm run build
      - name: Persist validated Phantom Sui canonical delta and self-clean
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'promote/phantom-sui-announcement'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/promote-phantom-sui-announcement.mjs
          rm -f .github/workflows/promote-phantom-sui-announcement.yml
          git checkout origin/main -- .github/workflows/validate.yml
          git add -A
          git commit -m 'Promote Phantom Sui support announcement [phantom-sui promoted]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
