name: Promote batch 07 once
on:
  pull_request:
    branches: [main]
    paths:
      - 'data-staging/candidates/post-100-depth-batch-07.json'
      - '.github/workflows/promote-batch-07-once.yml'
permissions:
  contents: write
jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - name: Render reviewed candidate into canonical
        run: |
          rm -rf .promotion-preview
          python3 scripts/render_candidate_promotion.py --candidate data-staging/candidates/post-100-depth-batch-07.json --output-dir .promotion-preview
          cp .promotion-preview/events.json data/events.json
          cp .promotion-preview/evidence.json data/evidence.json
          node scripts/sync-public-data.mjs
          node scripts/build-machine-layer.mjs
          node scripts/build-stats.mjs
          node scripts/generate-series-adapter.mjs
          node scripts/generate-stage5-relationships.mjs
          python3 scripts/validate_records.py
          node scripts/validate-series-adapter.mjs
          node scripts/validate-stage5-relationships.mjs
      - name: Commit generated promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events.json data/evidence.json public/data public/stats.json 2>/dev/null || true
          git add public/data || true
          if git diff --cached --quiet; then
            echo 'No generated changes' >&2
            exit 1
          fi
          git commit -m 'Promote post-100 depth batch 07 canonical data'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
