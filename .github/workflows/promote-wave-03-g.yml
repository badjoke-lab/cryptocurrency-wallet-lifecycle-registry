name: Promote Wave 03 G
on:
  push:
    branches: [promotion/coverage-recovery-wave-03-g]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote fixed reviewed records with current identity guards
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          expected_entities={
            'wlr_ent_000058':'Ambire',
            'wlr_ent_000050':'Muun',
            'wlr_ent_000028':'OKX Wallet',
            'wlr_ent_000045':'Ronin Wallet',
            'wlr_ent_000047':'Uniswap Wallet',
          }
          expected_products={
            'wlr_prod_000107':'Ambire Extension',
            'wlr_prod_000099':'Muun',
            'wlr_prod_000077':'OKX Wallet',
            'wlr_prod_000094':'Ronin Wallet',
            'wlr_prod_000096':'Uniswap Wallet',
          }
          entities={x['id']:x for x in json.loads(Path('data/entities.json').read_text())}
          products={x['id']:x for x in json.loads(Path('data/products.json').read_text())}
          for i,n in expected_entities.items():
            got=entities.get(i,{}).get('canonical_name')
            assert got==n, f'identity guard entity {i}: expected {n!r}, got {got!r}'
          for i,n in expected_products.items():
            got=products.get(i,{}).get('product_name')
            assert got==n, f'identity guard product {i}: expected {n!r}, got {got!r}'
          E=[
          {'id':'wlr_ev_903101','entity_id':'wlr_ent_000058','product_id':'wlr_prod_000107','affected_product_ids':['wlr_prod_000107'],'event_type':'other','event_date':'2026-03-17','event_date_basis':'announcement','title':'Ambire Extension received a major UI update','description':'Ambire announced on 2026-03-17 that its browser extension received a major UI refresh with a slimmer layout, clearer action buttons, and a redesigned token details page.','confidence':'high','event_status_effect':'active','is_major_event':False},
          {'id':'wlr_ev_903102','entity_id':'wlr_ent_000050','product_id':'wlr_prod_000099','affected_product_ids':['wlr_prod_000099'],'event_type':'other','event_date':'2021-01-11','event_date_basis':'announcement','title':'Muun 2.0 launched','description':'Muun announced the launch of Muun 2.0 on 2021-01-11, describing it as a major iteration of the mobile Bitcoin and Lightning wallet following the earlier Muun 1.0 release.','confidence':'high','event_status_effect':'active','is_major_event':True},
          {'id':'wlr_ev_903103','entity_id':'wlr_ent_000028','product_id':'wlr_prod_000077','affected_product_ids':['wlr_prod_000077'],'event_type':'other','event_date':'2026-04-29','event_date_basis':'announcement','title':'OKX Wallet added Pharos mainnet support','description':'OKX announced on 2026-04-29 that OKX Wallet had completed Pharos mainnet integration from day one, enabling users to manage Pharos assets and interact with ecosystem dApps directly in the wallet.','confidence':'high','event_status_effect':'active','is_major_event':False},
          {'id':'wlr_ev_903104','entity_id':'wlr_ent_000045','product_id':'wlr_prod_000094','affected_product_ids':['wlr_prod_000094'],'event_type':'other','event_date':'2025-12-15','event_date_basis':'announcement','title':'Ronin Wallet upgrades added Solana support and new onramps','description':'Ronin announced on 2025-12-15 that upgrades to the Ronin Wallet browser extension and mobile apps were live, including a refreshed interface, additional fiat-to-RON onramps, and Solana deposit support.','confidence':'high','event_status_effect':'active','is_major_event':False},
          {'id':'wlr_ev_903105','entity_id':'wlr_ent_000047','product_id':'wlr_prod_000096','affected_product_ids':['wlr_prod_000096'],'event_type':'other','event_date':'2026-01-15','event_date_basis':'announcement','title':'Uniswap Wallet added X Layer support','description':'Uniswap announced on 2026-01-15 that X Layer support was live across the Uniswap Protocol, Web App, Wallet, and Trading API, allowing Uniswap Wallet users to access the network directly.','confidence':'high','event_status_effect':'active','is_major_event':False}
          ]
          S=[
          {'id':'wlr_src_903101','entity_id':'wlr_ent_000058','product_id':'wlr_prod_000107','event_id':'wlr_ev_903101','source_type':'official_blog','title':'The Ambire Extension Gets a Major UI Update','url':'https://blog.ambire.com/extension-gets-ui-update/','publisher':'Ambire','published_at':'2026-03-17','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Ambire product update.'},
          {'id':'wlr_src_903102','entity_id':'wlr_ent_000050','product_id':'wlr_prod_000099','event_id':'wlr_ev_903102','source_type':'official_blog','title':'Announcing Muun 2.0','url':'https://blog.muun.com/announcing-muun-2-0/','publisher':'Muun','published_at':'2021-01-11','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Muun announcement explicitly describes the Muun 2.0 launch.'},
          {'id':'wlr_src_903103','entity_id':'wlr_ent_000028','product_id':'wlr_prod_000077','event_id':'wlr_ev_903103','source_type':'official_statement','title':"Announcement on OKX Wallet's Support for Pharos Mainnet Launch",'url':'https://www.okx.com/en-us/help/okx-wallet-pharos','publisher':'OKX','published_at':'2026-04-29','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party OKX announcement states wallet integration was completed from Pharos mainnet day one.'},
          {'id':'wlr_src_903104','entity_id':'wlr_ent_000045','product_id':'wlr_prod_000094','event_id':'wlr_ev_903104','source_type':'official_blog','title':'Ronin Wallet Upgrades are LIVE!','url':'https://blog.roninchain.com/p/ronin-wallet-upgrades-are-live','publisher':'Ronin','published_at':'2025-12-15','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Ronin announcement covering live wallet upgrades.'},
          {'id':'wlr_src_903105','entity_id':'wlr_ent_000047','product_id':'wlr_prod_000096','event_id':'wlr_ev_903105','source_type':'official_blog','title':'Uniswap is Now Live on X Layer','url':'https://blog.uniswap.org/uniswap-is-now-live-on-x-layer','publisher':'Uniswap Labs','published_at':'2026-01-15','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Uniswap announcement explicitly includes Uniswap Wallet support on X Layer.'}
          ]
          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          events=json.loads(ep.read_text()); sources=json.loads(sp.read_text())
          def nxt(rows,p): return max([int(x['id'][len(p):]) for x in rows if re.fullmatch(re.escape(p)+r'\d+',x['id'])],default=0)+1
          ne=nxt(events,'wlr_ev_'); ns=nxt(sources,'wlr_src_')
          urls={x['url'] for x in sources}; keys={(x.get('entity_id'),x.get('product_id'),x.get('event_type'),x.get('event_date'),x.get('title')) for x in events}
          smap={x['event_id']:x for x in S}; emap={}; pe=[]; ps=[]
          for e in E:
            s=smap[e['id']]; k=(e['entity_id'],e['product_id'],e['event_type'],e['event_date'],e['title'])
            if k in keys or s['url'] in urls: continue
            n=dict(e); nid=f'wlr_ev_{ne:06d}'; ne+=1; n['id']=nid; emap[e['id']]=nid; pe.append(n); keys.add(k)
          for s in S:
            if s['event_id'] not in emap or s['url'] in urls: continue
            n=dict(s); n['id']=f'wlr_src_{ns:06d}'; ns+=1; n['event_id']=emap[s['event_id']]; ps.append(n); urls.add(s['url'])
          assert len(pe)==5 and len(ps)==5, f'expected 5/5 promotion, got {len(pe)}/{len(ps)}'
          events+=pe; sources+=ps
          ep.write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n'); sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          print('PROMOTED',len(pe),len(ps),emap)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate and validate
        run: |
          npm run prebuild
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote Wave 03 zero-event batch 2 records'
          git push origin HEAD:promotion/coverage-recovery-wave-03-g
