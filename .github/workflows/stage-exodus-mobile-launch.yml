name: Stage Exodus Mobile launch history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage-exodus-mobile-launch.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed Exodus Mobile launch records
        shell: python
        run: |
          from pathlib import Path
          import json

          products_path=Path('data/products.json')
          products=json.loads(products_path.read_text())
          target=next(p for p in products if p.get('id')=='wlr_prod_000048')
          assert target.get('launch_date') is None
          target['launch_date']='2019'
          target['launch_date_precision']='year'
          target['notes']='Exodus first-party investor filings state that the mobile Exodus platform was released in 2019 and available on iOS and Android. The source does not establish a defensible exact release day, so year precision is retained.'
          products_path.write_text(json.dumps(products,ensure_ascii=False,separators=(',',':'))+'\n')

          event={'id':'wlr_ev_000101','entity_id':'wlr_ent_000016','product_id':'wlr_prod_000048','affected_product_ids':['wlr_prod_000048'],'event_type':'product_released','event_date':'2019','event_date_basis':'release','title':'Exodus Mobile released','description':'Exodus released the mobile version of its self-custody wallet platform in 2019 for iOS and Android.','confidence':'high','event_status_effect':'active','is_major_event':True,'notes':'Year precision only; the reviewed first-party filing does not establish an exact first release day.'}
          source={'id':'wlr_src_000159','entity_id':'wlr_ent_000016','product_ids':['wlr_prod_000048'],'event_ids':['wlr_ev_000101'],'product_id':'wlr_prod_000048','event_id':'wlr_ev_000101','source_type':'official_statement','title':'Regulation A Offering Statement — Our mobile platform','url':'https://www.exodus.com/investors/sec-filings/all-sec-filings/content/0001140361-21-008799/nt10013846x10_1aa.htm','publisher':'Exodus Movement, Inc.','published_at':'2021-03-17','accessed_at':'2026-08-17','reliability':'high','claim_scope':'launch_date','is_primary':True,'notes':'First-party Exodus filing states the mobile Exodus Platform was released in 2019 and was available on both iOS and Android.'}

          for path,obj,ident in [('data/events.json',event,'wlr_ev_000101'),('data/evidence.json',source,'wlr_src_000159')]:
              p=Path(path); rows=json.loads(p.read_text()); assert all(r.get('id') != ident for r in rows)
              rows.append(obj)
              p.write_text(json.dumps(rows,ensure_ascii=False,separators=(',',':'))+'\n')
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements.txt
          npm run validate:records
          npm run validate:identity-evidence
          npm run coverage:audit
      - name: Push reviewed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b data/exodus-mobile-launch-history
          git add data/products.json data/events.json data/evidence.json
          git commit -m 'Add Exodus Mobile launch history'
          git push origin data/exodus-mobile-launch-history
