name: Fix XRPH wind-down permalink once

on:
  push:
    branches:
      - fix/xrph-winddown-exact-permalink-20260911

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/xrph-winddown-exact-permalink-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -r requirements.txt
      - run: npm ci --no-audit --no-fund
      - name: Replace XRPH wind-down evidence permalink
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/evidence.json')
          data = json.loads(path.read_text())
          target = next(item for item in data if item.get('id') == 'wlr_src_000546')
          target['url'] = 'https://x.com/XRPHealthcare/status/2098029709875368067'
          target['accessed_at'] = '2026-09-11'
          target['reliability'] = 'high'
          target['notes'] = (
              'Exact first-party XRP Healthcare status permalink for the 2026-09-10 operational wind-down statement. '
              'The statement records the start of normal-operations wind-down, continued XRPH Wallet offline state, '
              'incident-recovery commitments, and coordinated XRPH/XRPHAI delistings. It does not state that XRPH Wallet '
              'is permanently discontinued, so the canonical entity and product remain limited.'
          )
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - run: npm run validate:records
      - run: npm run validate:identity-evidence
      - run: npm run coverage:audit
      - name: Regenerate public outputs
        run: npm run prebuild
      - run: npm run validate:machine-records
      - run: npm run validate:structured-discovery
      - run: npm run validate:stats
      - run: npm run validate:series
      - name: Commit deterministic data updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/evidence.json public
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Resolve XRP Healthcare wind-down source permalink'
            git push origin HEAD:fix/xrph-winddown-exact-permalink-20260911
          fi
