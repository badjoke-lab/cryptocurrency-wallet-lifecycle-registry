name: Stage reviewed entity growth batch 01

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/entity-growth-batch-01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/entity-growth-batch-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply manually reviewed canonical records
        run: |
          set -euo pipefail
          cat > /tmp/reviewed.b64 <<'B64'

B64
          base64 -d /tmp/reviewed.b64 | gunzip > /tmp/reviewed.json
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p,v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const reviewed = read('/tmp/reviewed.json');
          const targets = [
            ['data/entities.json','entities'],
            ['data/products.json','products'],
            ['data/evidence.json','evidence']
          ];
          for (const [path,key] of targets) {
            const current = read(path);
            for (const row of reviewed[key]) {
              const old = current.find(x => x.id === row.id);
              if (old && JSON.stringify(old) !== JSON.stringify(row)) throw new Error(`${row.id} collision in ${path}`);
              if (!old) current.push(row);
            }
            write(path,current);
          }
          NODE
      - name: Verify reviewed canonical breadth boundary
        run: |
          set -euo pipefail
          jq -e 'length == 36' data/entities.json >/dev/null
          jq -e 'length == 85' data/products.json >/dev/null
          jq -e 'length == 218' data/evidence.json >/dev/null
          for id in $(seq 27 36); do
            printf -v key 'wlr_ent_%06d' "$id"
            jq -e --arg id "$key" '.[] | select(.id == $id)' data/entities.json >/dev/null
          done
          for id in $(seq 76 85); do
            printf -v key 'wlr_prod_%06d' "$id"
            jq -e --arg id "$key" '.[] | select(.id == $id)' data/products.json >/dev/null
          done
          node scripts/build-stats.mjs
          jq -e '.registry.entities == 36 and .registry.products == 85 and .registry.events == 121 and .registry.evidence == 218 and .registry.incident_events == 23 and .registry.remediation_events == 9' public/data/stats.json >/dev/null
          jq -e '.entities.launch_date.count == 35 and .entities.launch_date.denominator == 36 and .entities.launch_date.percentage == 97.2' public/data/stats.json >/dev/null
          jq -e '.products.launch_date.count == 78 and .products.launch_date.denominator == 85 and .products.launch_date.percentage == 91.8' public/data/stats.json >/dev/null
          jq -e '.data_quality.products.support_status_known.count == 75 and .data_quality.products.support_status_known.denominator == 85 and .data_quality.products.support_status_known.percentage == 88.2' public/data/stats.json >/dev/null
          jq -e '.data_quality.products.sales_status_known.count == 83 and .data_quality.products.sales_status_known.denominator == 85 and .data_quality.products.sales_status_known.percentage == 97.6' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_impact_level.count == 23 and .data_quality.events.incident_impact_level.percentage == 100 and .data_quality.events.incident_funds_affected.count == 23 and .data_quality.events.incident_funds_affected.percentage == 100' public/data/stats.json >/dev/null
      - name: Commit explicit canonical edit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entities.json data/products.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed entity growth batch 01'
          git push origin HEAD:review/entity-growth-batch-01
