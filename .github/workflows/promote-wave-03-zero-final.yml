name: Promote Wave 03 Zero Final
on:
  push:
    branches: [promotion/coverage-recovery-wave-03-zero-final]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote reviewed zero-event closeout records
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          expected_entities={
            'wlr_ent_000085':'Begin Wallet',
            'wlr_ent_000086':'Glow',
            'wlr_ent_000068':'Petra',
            'wlr_ent_000084':'VESPR',
          }
          expected_products={
            'wlr_prod_000134':'Begin Wallet Mobile',
            'wlr_prod_000135':'Glow Browser Extension',
            'wlr_prod_000117':'Petra Browser Extension',
            'wlr_prod_000133':'VESPR Mobile',
          }
          entities={x['id']:x for x in json.loads(Path('data/entities.json').read_text())}
          products={x['id']:x for x in json.loads(Path('data/products.json').read_text())}
          for i,n in expected_entities.items():
            assert entities.get(i,{}).get('canonical_name')==n, (i,entities.get(i,{}).get('canonical_name'),n)
          for i,n in expected_products.items():
            assert products.get(i,{}).get('product_name')==n, (i,products.get(i,{}).get('product_name'),n)
          E=[
            {'id':'wlr_ev_903201','entity_id':'wlr_ent_000085','product_id':'wlr_prod_000134','affected_product_ids':['wlr_prod_000134'],'event_type':'other','event_date':'2026-02-23','event_date_basis':'release','title':'Begin Wallet 2.5.0 added Solana support','description':'Begin Wallet version 2.5.0 was released on 2026-02-23 with new Solana support and Solana swaps through Jupiter, providing a dated lifecycle event for the Begin Wallet mobile product.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903202','entity_id':'wlr_ent_000086','product_id':'wlr_prod_000135','affected_product_ids':['wlr_prod_000135'],'event_type':'other','event_date':'2024-08-10','event_date_basis':'release','title':'Glow Wallet 1.6.3 added iOS 18 support','description':'Glow Wallet version 1.6.3 was released on 2024-08-10 with iOS 18 support, providing a dated maintenance lifecycle event for Glow wallet.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903203','entity_id':'wlr_ent_000068','product_id':'wlr_prod_000117','affected_product_ids':['wlr_prod_000117'],'event_type':'other','event_date':'2026-04-06','event_date_basis':'release','title':'Petra Wallet 2.4.0 added perpetual trading','description':'Petra Wallet version 2.4.0 was released on 2026-04-06 with perpetual trading for eligible users powered by Decibel, providing a dated lifecycle event for Petra.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903204','entity_id':'wlr_ent_000084','product_id':'wlr_prod_000133','affected_product_ids':['wlr_prod_000133'],'event_type':'other','event_date':'2026-07-27','event_date_basis':'release','title':'VESPR Wallet 4.1.0 released','description':'VESPR Wallet version 4.1.0 was released on 2026-07-27 with a refreshed interface plus bug fixes and performance improvements, providing a dated lifecycle event for VESPR Mobile.','confidence':'high','event_status_effect':'active','is_major_event':False},
          ]
          S=[
            {'id':'wlr_src_903201','entity_id':'wlr_ent_000085','product_id':'wlr_prod_000134','event_id':'wlr_ev_903201','source_type':'app_store_listing','title':'Begin: Bitcoin Cardano Solana - Version History','url':'https://apps.apple.com/jp/app/begin-bitcoin-cardano-solana/id1642488837','publisher':'Apple App Store / Begin W UG','published_at':'2026-02-23','accessed_at':'2026-08-31','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official App Store listing identifies version 2.5.0 and its dated Solana-support release notes.'},
            {'id':'wlr_src_903202','entity_id':'wlr_ent_000086','product_id':'wlr_prod_000135','event_id':'wlr_ev_903202','source_type':'app_store_listing','title':'Glow — Solana Wallet - Version History','url':'https://apps.apple.com/us/app/glow-solana-wallet/id1599584512?platform=ipad','publisher':'Apple App Store / Luma Labs, Inc.','published_at':'2024-08-10','accessed_at':'2026-08-31','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official App Store version history identifies Glow 1.6.3 on 2024-08-10 with iOS 18 support.'},
            {'id':'wlr_src_903203','entity_id':'wlr_ent_000068','product_id':'wlr_prod_000117','event_id':'wlr_ev_903203','source_type':'app_store_listing','title':'Petra: Aptos Crypto Wallet - Version History','url':'https://apps.apple.com/au/app/petra-wallet/id6446259840','publisher':'Apple App Store / Aptos Labs','published_at':'2026-04-06','accessed_at':'2026-08-31','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official App Store version history identifies Petra 2.4.0 on 2026-04-06 and its perpetual-trading feature release.'},
            {'id':'wlr_src_903204','entity_id':'wlr_ent_000084','product_id':'wlr_prod_000133','event_id':'wlr_ev_903204','source_type':'app_store_listing','title':'VESPR: Cardano Wallet - Version History','url':'https://apps.apple.com/us/app/vespr-cardano-wallet/id1565749376','publisher':'Apple App Store / VESPR','published_at':'2026-07-27','accessed_at':'2026-08-31','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official App Store version history identifies VESPR 4.1.0 on 2026-07-27.'},
          ]
          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          events=json.loads(ep.read_text()); sources=json.loads(sp.read_text())
          def nxt(rows,p): return max([int(x['id'][len(p):]) for x in rows if re.fullmatch(re.escape(p)+r'\d+',x['id'])],default=0)+1
          ne=nxt(events,'wlr_ev_'); ns=nxt(sources,'wlr_src_')
          urls={x['url'] for x in sources}; keys={(x.get('entity_id'),x.get('product_id'),x.get('event_type'),x.get('event_date'),x.get('title')) for x in events}
          smap={x['event_id']:x for x in S}; emap={}; pe=[]; ps=[]
          for e in E:
            s=smap[e['id']]; k=(e['entity_id'],e['product_id'],e['event_type'],e['event_date'],e['title'])
            if k in keys or s['url'] in urls: continue
            n=dict(e); nid=f'wlr_ev_{ne:06d}'; ne+=1; n['id']=nid; emap[e['id']]=nid; pe.append(n); keys.add(k)
          for s in S:
            if s['event_id'] not in emap or s['url'] in urls: continue
            n=dict(s); n['id']=f'wlr_src_{ns:06d}'; ns+=1; n['event_id']=emap[s['event_id']]; ps.append(n); urls.add(s['url'])
          assert len(pe)==4 and len(ps)==4, f'expected 4/4 promotion, got {len(pe)}/{len(ps)}'
          events+=pe; sources+=ps
          ep.write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n'); sp.write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          print('PROMOTED',len(pe),len(ps),emap)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate and validate
        run: |
          npm run prebuild
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote final Wave 03 zero-event records'
          git push origin HEAD:promotion/coverage-recovery-wave-03-zero-final
