name: Stage reviewed Sparrow DB corruption history

on:
  push:
    branches: [data/sparrow-password-removal-db-corruption]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/sparrow-password-removal-db-corruption
          fetch-depth: 0

      - name: Append reviewed Sparrow events and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def append_rows(path, rows):
              text = path.read_text()
              stripped = text.rstrip()
              assert stripped.endswith(']')
              body = stripped[:-1].rstrip()
              addition = ',\n' + ',\n'.join(json.dumps(row, ensure_ascii=False, separators=(',', ':')) for row in rows) + '\n]'
              path.write_text(body + addition + '\n')

          events_path = Path('data/events.json')
          evidence_path = Path('data/evidence.json')
          events = json.loads(events_path.read_text())
          evidence = json.loads(evidence_path.read_text())

          assert len(events) == 81
          assert len(evidence) == 135
          assert not {'wlr_ev_000082','wlr_ev_000083'}.intersection({row['id'] for row in events})
          assert not {'wlr_src_000136','wlr_src_000137','wlr_src_000138','wlr_src_000139'}.intersection({row['id'] for row in evidence})
          assert any(row['id'] == 'wlr_ev_000054' and row['entity_id'] == 'wlr_ent_000021' and row['product_id'] == 'wlr_prod_000061' for row in events)

          issue_event = {
            'id': 'wlr_ev_000082',
            'entity_id': 'wlr_ent_000021',
            'product_id': 'wlr_prod_000061',
            'affected_product_ids': ['wlr_prod_000061'],
            'event_type': 'software_issue',
            'event_date': '2026-03-05',
            'event_date_basis': 'disclosure',
            'disclosed_at': '2026-03-05',
            'title': 'Password-removal crash window could leave Sparrow wallet database unreadable',
            'description': 'A Sparrow Wallet issue documented a narrow crash window during removal of a wallet password where the H2 wallet file could become unencrypted while seed or keystore state remained encrypted, causing Sparrow to reject the resulting inconsistent wallet database. Maintainer Craig Raw later said the race window appeared real but very small.',
            'confidence': 'high',
            'security_scope': 'software',
            'event_status_effect': 'none',
            'affected_components': ['wallet database', 'password removal flow', 'seed and keystore encryption state'],
            'is_major_event': False,
            'notes': 'WLR records this as a software issue rather than a CVE or exploit. The reviewed sources describe a narrow local crash/interruption window and a potential loss-of-access state, not remote compromise or confirmed loss of funds. No general affected-version range or severity rating is inferred.'
          }

          fix_event = {
            'id': 'wlr_ev_000083',
            'entity_id': 'wlr_ent_000021',
            'product_id': 'wlr_prod_000061',
            'affected_product_ids': ['wlr_prod_000061'],
            'event_type': 'software_fix',
            'event_date': '2026-03-10',
            'event_date_basis': 'release',
            'title': 'Sparrow 2.4.2 released with password-removal database corruption fix',
            'description': 'Sparrow 2.4.2 included the fix for possible database corruption during password removal, reordering database row and wallet-file encryption changes so a crash between the operations leaves the wallet in a recoverable state.',
            'confidence': 'high',
            'security_scope': 'software',
            'event_status_effect': 'none',
            'fixed_versions': [
              {'product_ids': ['wlr_prod_000061'], 'track': 'Sparrow Desktop', 'version': '2.4.2'}
            ],
            'user_actions_required': ['update'],
            'affected_components': ['wallet database', 'password removal flow', 'seed and keystore encryption state'],
            'is_major_event': False,
            'notes': 'The underlying mitigation commit was authored on 2026-03-06. WLR uses the 2026-03-10 public 2.4.2 release date for the remediation event and does not infer a broader affected-version range.'
          }

          sources = [
            {
              'id': 'wlr_src_000136',
              'entity_id': 'wlr_ent_000021',
              'product_ids': ['wlr_prod_000061'],
              'event_ids': ['wlr_ev_000082'],
              'product_id': 'wlr_prod_000061',
              'event_id': 'wlr_ev_000082',
              'source_type': 'community_reference',
              'title': 'Sparrow issue #1961 — password removal can corrupt DB wallet',
              'url': 'https://github.com/sparrowwallet/sparrow/issues/1961',
              'publisher': 'Sparrow Wallet GitHub',
              'published_at': '2026-03-05',
              'accessed_at': '2026-08-17',
              'reliability': 'medium',
              'claim_scope': 'event',
              'is_primary': True,
              'notes': 'First-hand public reproduction report describing the inconsistent database state and resulting Sparrow load failure after forced termination during password removal.'
            },
            {
              'id': 'wlr_src_000137',
              'entity_id': 'wlr_ent_000021',
              'product_ids': ['wlr_prod_000061'],
              'event_ids': ['wlr_ev_000082'],
              'product_id': 'wlr_prod_000061',
              'event_id': 'wlr_ev_000082',
              'source_type': 'official_statement',
              'title': 'Sparrow maintainer confirmation and fix note for issue #1961',
              'url': 'https://github.com/sparrowwallet/sparrow/issues/1961#issuecomment-4010642640',
              'publisher': 'Sparrow Wallet',
              'published_at': '2026-03-06',
              'accessed_at': '2026-08-17',
              'reliability': 'high',
              'claim_scope': 'event',
              'is_primary': True,
              'notes': 'Maintainer Craig Raw states the issue was fixed in e9108b85 by reordering file-encryption and database-row updates so interruption leaves a recoverable state.'
            },
            {
              'id': 'wlr_src_000138',
              'entity_id': 'wlr_ent_000021',
              'product_ids': ['wlr_prod_000061'],
              'event_ids': ['wlr_ev_000083'],
              'product_id': 'wlr_prod_000061',
              'event_id': 'wlr_ev_000083',
              'source_type': 'source_code',
              'title': 'Sparrow commit e9108b85 — fix possible DB corruption on password removal',
              'url': 'https://github.com/sparrowwallet/sparrow/commit/e9108b85cdd00ffa53c5efd79a30934bd69aca07',
              'publisher': 'Sparrow Wallet',
              'published_at': '2026-03-06',
              'accessed_at': '2026-08-17',
              'reliability': 'high',
              'claim_scope': 'security_fix',
              'is_primary': True,
              'notes': 'Official source commit implementing the operation reordering in DbPersistence.updateWallet().'
            },
            {
              'id': 'wlr_src_000139',
              'entity_id': 'wlr_ent_000021',
              'product_ids': ['wlr_prod_000061'],
              'event_ids': ['wlr_ev_000083'],
              'product_id': 'wlr_prod_000061',
              'event_id': 'wlr_ev_000083',
              'source_type': 'release_notes',
              'title': 'Sparrow 2.4.2',
              'url': 'https://github.com/sparrowwallet/sparrow/releases/tag/2.4.2',
              'publisher': 'Sparrow Wallet',
              'published_at': '2026-03-10',
              'accessed_at': '2026-08-17',
              'reliability': 'high',
              'claim_scope': 'security_fix',
              'is_primary': True,
              'notes': 'Official release notes explicitly list the password-removal DB corruption fix in Sparrow 2.4.2.'
            }
          ]

          append_rows(events_path, [issue_event, fix_event])
          append_rows(evidence_path, sources)
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted Sparrow batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          assert len(events)==83
          assert len(evidence)==139
          issue=next(row for row in events if row['id']=='wlr_ev_000082')
          fix=next(row for row in events if row['id']=='wlr_ev_000083')
          assert issue['entity_id']=='wlr_ent_000021' and issue['product_id']=='wlr_prod_000061'
          assert issue['event_type']=='software_issue' and issue['event_date']=='2026-03-05' and issue['event_date_basis']=='disclosure'
          assert issue['security_scope']=='software' and issue['event_status_effect']=='none'
          assert 'impact_level' not in issue and 'funds_affected' not in issue and 'affected_versions' not in issue
          assert fix['event_type']=='software_fix' and fix['event_date']=='2026-03-10' and fix['event_date_basis']=='release'
          assert fix['fixed_versions']==[{'product_ids':['wlr_prod_000061'],'track':'Sparrow Desktop','version':'2.4.2'}]
          assert fix['user_actions_required']==['update']
          src={s['id']:s for s in evidence if s['id'] in {'wlr_src_000136','wlr_src_000137','wlr_src_000138','wlr_src_000139'}}
          assert set(src)=={'wlr_src_000136','wlr_src_000137','wlr_src_000138','wlr_src_000139'}
          assert src['wlr_src_000136']['source_type']=='community_reference' and src['wlr_src_000136']['reliability']=='medium'
          assert src['wlr_src_000137']['source_type']=='official_statement' and src['wlr_src_000137']['reliability']=='high'
          assert src['wlr_src_000138']['source_type']=='source_code' and src['wlr_src_000138']['claim_scope']=='security_fix'
          assert src['wlr_src_000139']['source_type']=='release_notes' and src['wlr_src_000139']['published_at']=='2026-03-10'
          print('SPARROW_DB_CORRUPTION_STAGE_OK events=83 evidence=139 incidents_expected=18 remediation_expected=7')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed Sparrow DB corruption history'
          git push origin HEAD:data/sparrow-password-removal-db-corruption
