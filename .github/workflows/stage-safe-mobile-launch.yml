name: Stage Safe Mobile launch history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/stage-safe-mobile-launch.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed Safe Mobile launch records
        shell: python
        run: |
          from pathlib import Path
          import json

          products_path=Path('data/products.json')
          products=json.loads(products_path.read_text())
          target=next(p for p in products if p.get('id')=='wlr_prod_000024')
          assert target.get('launch_date') is None
          target['launch_date']='2025-10-16'
          target['launch_date_precision']='day'
          target['notes']='Current Safe Mobile app launch date is anchored to Safe Labs’ first-party 2025-10-16 announcement of the completely rebuilt Safe{Mobile} app for iOS and Android. This record remains distinct from the discontinued 2018 Gnosis Safe Mobile legacy product.'
          products_path.write_text(json.dumps(products,ensure_ascii=False,separators=(',',':'))+'\n')

          event={'id':'wlr_ev_000099','entity_id':'wlr_ent_000005','product_id':'wlr_prod_000024','affected_product_ids':['wlr_prod_000024'],'event_type':'product_released','event_date':'2025-10-16','event_date_basis':'release','title':'Safe Labs launched the rebuilt Safe Mobile app','description':'Safe Labs launched a completely rebuilt Safe{Mobile} application for managing and signing Safe smart-account transactions on iOS and Android.','confidence':'high','event_status_effect':'active','is_major_event':True,'notes':'This event tracks the current rebuilt Safe Mobile product and does not rewrite the separate lifecycle of the discontinued 2018 Gnosis Safe Mobile legacy app.'}
          source={'id':'wlr_src_000157','entity_id':'wlr_ent_000005','product_ids':['wlr_prod_000024'],'event_ids':['wlr_ev_000099'],'product_id':'wlr_prod_000024','event_id':'wlr_ev_000099','source_type':'official_blog','title':'Secure Signing, Now Seamlessly Mobile: Safe Labs Introduces An All-New Safe{Mobile} App','url':'https://safe.global/blog/secure-signing-now-seamlessly-mobile-safe-labs-introduces-an-all-new-safe-mobile-app','publisher':'Safe','published_at':'2025-10-16','accessed_at':'2026-08-17','reliability':'high','claim_scope':'launch_date','is_primary':True,'notes':'First-party Safe announcement explicitly states Safe Labs launched the completely rebuilt Safe{Mobile} app and that it was available on both iOS and Android.'}

          for path,obj,ident in [('data/events.json',event,'wlr_ev_000099'),('data/evidence.json',source,'wlr_src_000157')]:
              p=Path(path); rows=json.loads(p.read_text()); assert all(r.get('id') != ident for r in rows)
              rows.append(obj)
              p.write_text(json.dumps(rows,ensure_ascii=False,separators=(',',':'))+'\n')
      - name: Validate
        run: |
          npm install --no-audit --no-fund
          python -m pip install -r requirements.txt
          npm run validate:records
          npm run validate:identity-evidence
          npm run coverage:audit
      - name: Push reviewed branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b data/safe-mobile-launch-history
          git add data/products.json data/events.json data/evidence.json
          git commit -m 'Add Safe Mobile launch history'
          git push origin data/safe-mobile-launch-history
