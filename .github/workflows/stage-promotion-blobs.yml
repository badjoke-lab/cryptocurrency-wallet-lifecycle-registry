name: Stage promotion blobs
on:
  push:
    branches: [agent/growth-batch-2]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'badjoke-lab/cryptocurrency-wallet-lifecycle-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_candidates.py
      - run: python scripts/render_candidate_promotion.py --candidate data-staging/candidates/growth-batch-2.json --output-dir promotion-preview
      - name: Create unattached Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          root = pathlib.Path('promotion-preview')
          files = ['entities.json', 'products.json', 'events.json', 'evidence.json']
          result = {}
          for name in files:
              raw = (root / name).read_bytes()
              payload = json.dumps({
                  'content': base64.b64encode(raw).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  body = json.load(response)
              result[name] = {'sha': body['sha'], 'bytes': len(raw)}
              print(f"PROMOTION_BLOB {name} {body['sha']} {len(raw)}")
          pathlib.Path('promotion-blobs.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wlr-growth-batch-2-promotion-blobs
          path: promotion-blobs.json
          if-no-files-found: error
          retention-days: 7
