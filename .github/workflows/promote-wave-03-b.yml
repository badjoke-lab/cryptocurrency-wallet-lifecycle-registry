name: Promote Wave 03 B
on:
  push:
    branches:
      - promotion/coverage-recovery-wave-03-b
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote reviewed Wave 03 part 4
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          repo='badjoke-lab/cryptocurrency-wallet-lifecycle-registry'
          url=f'https://raw.githubusercontent.com/{repo}/research/coverage-recovery-wave-03/data-staging/candidates/coverage-recovery-wave-03-part4.json'
          with urllib.request.urlopen(url) as r: bundle=json.load(r)
          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          events=json.loads(ep.read_text()); evidence=json.loads(sp.read_text())
          def max_id(rows,prefix):
              vals=[]
              for x in rows:
                  m=re.fullmatch(re.escape(prefix)+r'(\d+)',x['id'])
                  if m: vals.append(int(m.group(1)))
              return max(vals,default=0)
          next_ev=max_id(events,'wlr_ev_')+1; next_src=max_id(evidence,'wlr_src_')+1
          urls={x['url'] for x in evidence}
          keys={(x.get('entity_id'),x.get('product_id'),x.get('event_type'),x.get('event_date'),x.get('title')) for x in events}
          by_event={}
          for s in bundle['records']['evidence']: by_event.setdefault(s.get('event_id'),[]).append(s)
          event_map={}; promoted_events=[]
          for ev in bundle['records']['events']:
              key=(ev.get('entity_id'),ev.get('product_id'),ev.get('event_type'),ev.get('event_date'),ev.get('title'))
              usable=[s for s in by_event.get(ev['id'],[]) if s['url'] not in urls]
              if key in keys or not usable: continue
              new=dict(ev); nid=f'wlr_ev_{next_ev:06d}'; next_ev+=1; new['id']=nid
              event_map[ev['id']]=nid; promoted_events.append(new); keys.add(key)
          promoted_evidence=[]
          for s in bundle['records']['evidence']:
              old=s.get('event_id')
              if old and old not in event_map: continue
              if s['url'] in urls: continue
              new=dict(s); new['id']=f'wlr_src_{next_src:06d}'; next_src+=1
              if old: new['event_id']=event_map[old]
              promoted_evidence.append(new); urls.add(s['url'])
          events.extend(promoted_events); evidence.extend(promoted_evidence)
          ep.write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n')
          sp.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          print('PROMOTED',len(promoted_events),len(promoted_evidence),event_map)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate generated artifacts
        run: npm run prebuild
      - name: Validate canonical records
        run: |
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote Wave 03 part 4 records'
          git push origin HEAD:promotion/coverage-recovery-wave-03-b
