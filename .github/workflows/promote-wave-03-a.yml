name: Promote Wave 03 A

on:
  push:
    branches:
      - promotion/coverage-recovery-wave-03-a

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote reviewed Wave 03 candidates
        run: |
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          repo = 'badjoke-lab/cryptocurrency-wallet-lifecycle-registry'
          ref = 'research/coverage-recovery-wave-03'
          parts = [1,2,3]

          def fetch(part):
              url = f'https://raw.githubusercontent.com/{repo}/{ref}/data-staging/candidates/coverage-recovery-wave-03-part{part}.json'
              with urllib.request.urlopen(url) as r:
                  return json.load(r)

          events_path = Path('data/events.json')
          evidence_path = Path('data/evidence.json')
          products_path = Path('data/products.json')
          events = json.loads(events_path.read_text())
          evidence = json.loads(evidence_path.read_text())
          products = json.loads(products_path.read_text())

          def max_id(rows, prefix):
              vals = []
              for row in rows:
                  m = re.fullmatch(re.escape(prefix) + r'(\d+)', row['id'])
                  if m:
                      vals.append(int(m.group(1)))
              return max(vals, default=0)

          next_ev = max_id(events, 'wlr_ev_') + 1
          next_src = max_id(evidence, 'wlr_src_') + 1
          existing_urls = {x['url'] for x in evidence}
          existing_event_keys = {(x.get('entity_id'), x.get('product_id'), x.get('event_type'), x.get('event_date'), x.get('title')) for x in events}

          bundles = [fetch(p) for p in parts]
          cand_events = []
          cand_evidence = []
          for b in bundles:
              cand_events.extend(b['records']['events'])
              cand_evidence.extend(b['records']['evidence'])

          ev_evidence = {}
          for src in cand_evidence:
              ev_evidence.setdefault(src.get('event_id'), []).append(src)

          event_map = {}
          promoted_events = []
          skipped_events = []
          for ev in cand_events:
              normalized = dict(ev)
              if ev['id'] == 'wlr_ev_902201' and normalized.get('event_date_basis') == 'publication':
                  normalized['event_date_basis'] = 'announcement'
              key = (normalized.get('entity_id'), normalized.get('product_id'), normalized.get('event_type'), normalized.get('event_date'), normalized.get('title'))
              if key in existing_event_keys:
                  skipped_events.append((ev['id'], 'semantic_duplicate'))
                  continue
              usable = [s for s in ev_evidence.get(ev['id'], []) if s['url'] not in existing_urls]
              if not usable:
                  skipped_events.append((ev['id'], 'no_new_evidence'))
                  continue
              new_id = f'wlr_ev_{next_ev:06d}'
              next_ev += 1
              normalized['id'] = new_id
              event_map[ev['id']] = new_id
              promoted_events.append(normalized)
              existing_event_keys.add(key)

          promoted_evidence = []
          for src in cand_evidence:
              old_event = src.get('event_id')
              if old_event is not None and old_event not in event_map:
                  continue
              if src['url'] in existing_urls:
                  continue
              new = dict(src)
              new['id'] = f'wlr_src_{next_src:06d}'
              next_src += 1
              if old_event is not None:
                  new['event_id'] = event_map[old_event]
              promoted_evidence.append(new)
              existing_urls.add(src['url'])

          product_updates = []
          for product in products:
              if product['id'] == 'wlr_prod_000109' and not product.get('launch_date'):
                  product['launch_date'] = '2022-08-03'
                  product['launch_date_precision'] = 'day'
                  product['last_verified_at'] = '2026-08-29'
                  note = 'First-party MyEtherWallet publication dated 2022-08-03 introduces Enkrypt, describes support at release, and directs users to download the browser extension; WLR uses that day as the reviewed public launch date.'
                  prior = product.get('notes') or ''
                  product['notes'] = (prior + ' ' + note).strip()
                  product_updates.append(product['id'])

          events.extend(promoted_events)
          evidence.extend(promoted_evidence)
          events_path.write_text(json.dumps(events, ensure_ascii=False, indent=2) + '\n')
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n')
          products_path.write_text(json.dumps(products, ensure_ascii=False, indent=2) + '\n')
          print(f'PROMOTED events={len(promoted_events)} evidence={len(promoted_evidence)} product_updates={len(product_updates)}')
          print('EVENT_MAP', json.dumps(event_map, sort_keys=True))
          print('PRODUCT_UPDATES', product_updates)
          print('SKIPPED', skipped_events)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate public and Series artifacts
        run: npm run prebuild
      - name: Validate canonical records
        run: |
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote Wave 03 parts 1-3 records'
          git push origin HEAD:promotion/coverage-recovery-wave-03-a
