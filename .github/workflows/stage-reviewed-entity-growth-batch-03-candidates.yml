name: Stage reviewed entity growth batch 03 candidates

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  review-ready:
    if: github.head_ref == 'research/entity-growth-batch-03'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/entity-growth-batch-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply manual review decisions
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const dir='data-staging/candidates';
          const files=fs.readdirSync(dir).filter(f=>/^entity-growth-batch-03-[a-e]\.json$/.test(f)).sort();
          if(files.length!==5) throw new Error(`expected 5 Batch03 bundles, found ${files.length}`);
          for(const file of files){
            const path=`${dir}/${file}`;
            const data=JSON.parse(fs.readFileSync(path,'utf8'));
            data.review_state='review_ready';
            if(file==='entity-growth-batch-03-c.json'){
              const ent=data.records.entities.find(x=>x.id==='wlr_ent_000061');
              const prod=data.records.products.find(x=>x.id==='wlr_prod_000110');
              const src=data.records.evidence.find(x=>x.id==='wlr_src_000267');
              if(!ent||!prod||!src) throw new Error('Backpack review rows missing');
              ent.summary='Self-custodial cryptocurrency wallet ecosystem distributed through mobile applications and a browser extension by Backpack.';
              ent.custody_model='self_custody';
              ent.key_management_model='device_local_user_controlled_private_keys_and_recovery_phrases';
              ent.confidence='high';
              ent.notes='Current first-party Backpack support explicitly describes Backpack Wallet as self-custodial, states private keys never leave the user device, and confirms mobile/browser distribution. Initial launch date remains unresolved.';
              prod.custody_model='self_custody';
              prod.key_management_model='browser_local_user_controlled_private_keys_and_recovery_phrases';
              prod.summary='Current self-custodial Backpack browser extension for wallet and dApp use on supported desktop browsers.';
              prod.confidence='high';
              prod.notes='Selected browser-extension boundary only; mobile is deferred. Current first-party wallet support explicitly describes Backpack as self-custodial, while the official download page establishes Chrome, Brave and Edge distribution. Original extension launch remains unresolved.';
              src.title='What is Backpack Wallet?';
              src.url='https://support.backpack.exchange/wallet/what-is-backpack-wallet';
              src.claim_scope='entity';
              src.notes='Current first-party Backpack support explicitly describes Backpack as a self-custodial crypto wallet and links browser, iOS and Android distribution.';
            }
            fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          }
          NODE
      - name: Verify review-ready boundary
        run: |
          set -euo pipefail
          for f in data-staging/candidates/entity-growth-batch-03-{a,b,c,d,e}.json; do jq -e '.review_state == "review_ready"' "$f" >/dev/null; done
          jq -e '.records.entities[] | select(.id == "wlr_ent_000061") | .custody_model == "self_custody" and .confidence == "high"' data-staging/candidates/entity-growth-batch-03-c.json >/dev/null
          jq -e '.records.products[] | select(.id == "wlr_prod_000110") | .custody_model == "self_custody" and .product_type == "browser_extension"' data-staging/candidates/entity-growth-batch-03-c.json >/dev/null
          jq -e '.records.evidence[] | select(.id == "wlr_src_000267") | .url == "https://support.backpack.exchange/wallet/what-is-backpack-wallet"' data-staging/candidates/entity-growth-batch-03-c.json >/dev/null
          npm install --no-audit --no-fund
          npm run validate:candidates
          npm run validate:identity-evidence
          npm run check:staging-boundary
      - name: Commit reviewed candidate state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-staging/candidates/entity-growth-batch-03-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Mark entity growth batch 03 candidates review ready'
          git push origin HEAD:research/entity-growth-batch-03
