      - name: Verify fixed canonical boundary
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'); const r=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const e=r('data/entities.json'), p=r('data/products.json'), s=r('data/evidence.json'), ev=r('data/events.json');
          if(e.length!==50||p.length!==99||s.length!==246||ev.length!==121) throw new Error(`unexpected totals e=${e.length} p=${p.length} s=${s.length} ev=${ev.length}`);
          for(let i=37;i<=50;i++) if(!e.some(x=>x.id===`wlr_ent_${String(i).padStart(6,'0')}`)) throw new Error(`missing entity ${i}`);
          for(let i=86;i<=99;i++) if(!p.some(x=>x.id===`wlr_prod_${String(i).padStart(6,'0')}`)) throw new Error(`missing product ${i}`);
          for(let i=219;i<=246;i++) if(!s.some(x=>x.id===`wlr_src_${String(i).padStart(6,'0')}`)) throw new Error(`missing evidence ${i}`);
          const ronin=p.find(x=>x.id==='wlr_prod_000094'); if(ronin.slug!=='ronin-wallet-extension'||ronin.product_type!=='browser_extension') throw new Error('Ronin boundary');
          const bitget=p.find(x=>x.id==='wlr_prod_000095'); if(bitget.slug!=='bitget-wallet-mobile'||bitget.product_type!=='mobile_app'||bitget.launch_date!==null) throw new Error('Bitget boundary');
          const zerion=p.find(x=>x.id==='wlr_prod_000097'); if(zerion.slug!=='zerion-wallet-mobile'||zerion.product_type!=='mobile_app') throw new Error('Zerion boundary');
          NODE
          node scripts/build-stats.mjs
          jq '.registry, .entities.launch_date, .products.launch_date, .data_quality.products.support_status_known, .data_quality.products.sales_status_known' public/data/stats.json
      - name: Commit explicit canonical edit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entities.json data/products.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed entity growth batch 02'
          git push origin HEAD:review/entity-growth-batch-02
