name: Build Wave 03 priority queue
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wave-03-priority-queue.yml'
permissions:
  contents: write
jobs:
  queue:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Build deterministic coverage queue
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from report_coverage import build_report

          report = build_report()
          products = json.load(open('data/products.json', encoding='utf-8'))
          products_by_entity = {}
          for p in products:
              products_by_entity.setdefault(p['entity_id'], []).append(p)

          excluded = {
              'wlr_ent_000028','wlr_ent_000037','wlr_ent_000041','wlr_ent_000043','wlr_ent_000044',
              'wlr_ent_000045','wlr_ent_000047','wlr_ent_000048','wlr_ent_000049','wlr_ent_000050',
              'wlr_ent_000068','wlr_ent_000070','wlr_ent_000074','wlr_ent_000075','wlr_ent_000077',
              'wlr_ent_000078','wlr_ent_000080','wlr_ent_000081','wlr_ent_000082','wlr_ent_000083',
              'wlr_ent_000084','wlr_ent_000085','wlr_ent_000086','wlr_ent_000088','wlr_ent_000090',
              'wlr_ent_000091','wlr_ent_000092','wlr_ent_000094','wlr_ent_000097','wlr_ent_000099',
          }
          weights = {
              'no_history_events': 100,
              'thin_history': 60,
              'thin_evidence': 40,
              'product_launch_gaps': 25,
              'product_support_unknown': 25,
          }
          ranked = []
          for row in report['entities']:
              if row['entity_id'] in excluded:
                  continue
              relevant = [f for f in row['flags'] if f in weights]
              if not relevant:
                  continue
              score = sum(weights[f] for f in relevant)
              gaps = []
              for p in sorted(products_by_entity.get(row['entity_id'], []), key=lambda x: x['id']):
                  launch_missing = not p.get('launch_date')
                  support_unknown = p.get('support_status') in (None, 'unknown')
                  if launch_missing or support_unknown:
                      gaps.append({
                          'product_id': p['id'],
                          'slug': p['slug'],
                          'product_name': p['product_name'],
                          'launch_date_missing': launch_missing,
                          'support_status_unknown': support_unknown,
                      })
              ranked.append({
                  'priority_score': score,
                  'entity_id': row['entity_id'],
                  'slug': row['slug'],
                  'name': row['name'],
                  'events': row['events'],
                  'evidence': row['evidence'],
                  'flags': relevant,
                  'product_gaps': gaps,
              })
          ranked.sort(key=lambda x: (-x['priority_score'], x['entity_id']))
          selected = ranked[:30]
          payload = {
              'schema': 'wlr.coverage-priority-queue.v1',
              'issue': 299,
              'baseline_commit': os.environ['BASE_SHA'],
              'selection': {
                  'limit': 30,
                  'weights': weights,
                  'tie_breaker': 'entity_id_ascending',
                  'excluded_wave_02_entity_ids': sorted(excluded),
              },
              'coverage_summary': report['summary'],
              'selected_count': len(selected),
              'targets': selected,
          }
          out = Path('data-staging/coverage/coverage-recovery-wave-03-priority.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit queue snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data-staging/coverage/coverage-recovery-wave-03-priority.json
          git commit -m 'Snapshot Wave 03 coverage priority queue' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
