name: Promote Batch 09

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/promote-batch09.mjs'
      - '.github/workflows/promote-batch09.yml'
      - 'data/**'
      - 'public/**'

permissions:
  contents: write

jobs:
  promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'promote/post-100-depth-batch-09'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: node scripts/promote-batch09.mjs
      - run: npm run validate:records
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:stats
      - run: npm run validate:monitoring
      - run: npm run coverage:audit
      - run: npm run seed:gate
      - run: npm run validate:series
      - run: npm run build
      - name: Commit validated Batch 09 promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'No promotion diff to commit.'
            exit 0
          fi
          git commit -m 'Promote post-100 depth batch 09 [batch09 promoted]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
