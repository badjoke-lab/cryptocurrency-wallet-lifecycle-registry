name: Compute Wave 03 Thin History 9
on:
  push:
    branches: [research/coverage-recovery-wave-03-thin-history-9]
permissions:
  contents: write
jobs:
  compute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/compute-wave-03-thin-history-9.mjs
      - name: Commit queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-staging/coverage/coverage-recovery-wave-03-thin-history-9.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Compute Wave 03 batch 9 fresh queue"
          git push
