name: Stage reviewed entity growth batch 03

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/entity-growth-batch-03'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/entity-growth-batch-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize immutable reviewed snapshot
        run: |
          set -euo pipefail
          snapshot='4f4ca25789c095a2f00c68a52261c587c0b6941a'
          git fetch --no-tags origin "$snapshot" --depth=1
          mkdir -p /tmp/wlr-batch03
          for group in a b c d e; do
            git show "${snapshot}:data-staging/candidates/entity-growth-batch-03-${group}.json" > "/tmp/wlr-batch03/${group}.json"
          done
      - name: Apply manually reviewed fixed records
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v)+'\n');
          const entities=read('data/entities.json');
          const products=read('data/products.json');
          const evidence=read('data/evidence.json');
          const bundles=['a','b','c','d','e'].map(g=>read(`/tmp/wlr-batch03/${g}.json`));
          const add=(arr,row)=>{const old=arr.find(x=>x.id===row.id);if(old&&JSON.stringify(old)!==JSON.stringify(row))throw new Error(`collision ${row.id}`);if(!old)arr.push(row)};
          for(const bundle of bundles){
            if(bundle.review_state!=='review_ready') throw new Error(`not review_ready ${bundle.candidate_id}`);
            if((bundle.records.events||[]).length!==0) throw new Error(`artificial events present ${bundle.candidate_id}`);
          }
          const E=bundles.flatMap(b=>b.records.entities||[]);
          const P=bundles.flatMap(b=>b.records.products||[]);
          const S=bundles.flatMap(b=>b.records.evidence||[]);
          if(E.length!==25||P.length!==25||S.length!==50) throw new Error(`unexpected reviewed counts E=${E.length} P=${P.length} S=${S.length}`);
          const exactRange=(rows,prefix,start,end)=>{
            const expected=[]; for(let i=start;i<=end;i++) expected.push(`${prefix}${String(i).padStart(6,'0')}`);
            const actual=rows.map(x=>x.id).sort();
            if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`unexpected ${prefix} ids`);
          };
          exactRange(E,'wlr_ent_',51,75);
          exactRange(P,'wlr_prod_',100,124);
          exactRange(S,'wlr_src_',247,296);
          const by=(rows,id)=>{const row=rows.find(x=>x.id===id); if(!row) throw new Error(`missing ${id}`); return row};
          if(by(E,'wlr_ent_000057').custody_model!=='unknown') throw new Error('MathWallet custody must remain unknown');
          if(by(E,'wlr_ent_000061').custody_model!=='self_custody') throw new Error('Backpack self-custody review missing');
          if(by(E,'wlr_ent_000065').status!=='deprecated') throw new Error('Yoroi must remain deprecated');
          if(by(P,'wlr_prod_000123').sales_status!=='not_applicable') throw new Error('SeedSigner sales boundary changed');
          if(by(P,'wlr_prod_000102').product_type!=='mobile_app') throw new Error('Binance selected runtime changed');
          if(by(P,'wlr_prod_000105').product_type!=='mobile_app') throw new Error('Coin98 selected runtime changed');
          if(by(P,'wlr_prod_000110').product_type!=='browser_extension') throw new Error('Backpack selected runtime changed');
          if(by(P,'wlr_prod_000113').product_type!=='mobile_app') throw new Error('Pera selected runtime changed');
          if(by(P,'wlr_prod_000116').product_type!=='browser_extension') throw new Error('SubWallet selected runtime changed');
          if(by(P,'wlr_prod_000117').product_type!=='browser_extension') throw new Error('Petra selected runtime changed');
          if(by(P,'wlr_prod_000118').product_type!=='browser_extension') throw new Error('Slush selected runtime changed');
          for(const row of E) add(entities,row);
          for(const row of P) add(products,row);
          for(const row of S) add(evidence,row);
          write('data/entities.json',entities);
          write('data/products.json',products);
          write('data/evidence.json',evidence);
          NODE
      - name: Verify canonical boundary
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run validate:records
          npm run validate:identity-evidence
          npm run check:staging-boundary
          node scripts/build-stats.mjs
          jq -e '.registry.entities == 75 and .registry.products == 124 and .registry.events == 121 and .registry.evidence == 296' public/data/stats.json >/dev/null
          jq -e '[.[] | select(.id >= "wlr_ent_000051" and .id <= "wlr_ent_000075")] | length == 25' data/entities.json >/dev/null
          jq -e '[.[] | select(.id >= "wlr_prod_000100" and .id <= "wlr_prod_000124")] | length == 25' data/products.json >/dev/null
          jq -e '[.[] | select(.id >= "wlr_src_000247" and .id <= "wlr_src_000296")] | length == 50' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entities.json data/products.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add entity growth batch 03'
          git push origin HEAD:review/entity-growth-batch-03
