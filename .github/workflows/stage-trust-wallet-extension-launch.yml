name: Stage reviewed Trust Wallet extension launch history

on:
  push:
    branches: [data/trust-wallet-browser-extension-launch]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/trust-wallet-browser-extension-launch
          fetch-depth: 0

      - name: Add Trust Wallet extension launch date, event, and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          products_path=Path('data/products.json')
          events_path=Path('data/events.json')
          evidence_path=Path('data/evidence.json')
          products=json.loads(products_path.read_text())
          events=json.loads(events_path.read_text())
          evidence=json.loads(evidence_path.read_text())

          assert len(products)==69 and len(events)==84 and len(evidence)==140
          product=next(p for p in products if p['id']=='wlr_prod_000036')
          assert product['entity_id']=='wlr_ent_000009'
          assert product['product_name']=='Trust Wallet Browser Extension'
          assert product.get('launch_date') is None
          assert product.get('launch_date_precision')=='approximate'
          assert 'wlr_ev_000085' not in {e['id'] for e in events}
          assert 'wlr_src_000141' not in {s['id'] for s in evidence}

          lines=products_path.read_text().splitlines()
          matches=[i for i,line in enumerate(lines) if '"id":"wlr_prod_000036"' in line]
          assert len(matches)==1
          i=matches[0]
          old='"launch_date":null,"launch_date_precision":"approximate"'
          new='"launch_date":"2022-11-14","launch_date_precision":"day"'
          assert old in lines[i]
          lines[i]=lines[i].replace(old,new,1)
          products_path.write_text('\n'.join(lines)+'\n')

          def append_rows(path, rows):
              text=path.read_text()
              stripped=text.rstrip()
              assert stripped.endswith(']')
              body=stripped[:-1].rstrip()
              addition=',\n'+',\n'.join(json.dumps(row,ensure_ascii=False,separators=(',',':')) for row in rows)+'\n]'
              path.write_text(body+addition+'\n')

          event={
            'id':'wlr_ev_000085',
            'entity_id':'wlr_ent_000009',
            'product_id':'wlr_prod_000036',
            'affected_product_ids':['wlr_prod_000036'],
            'event_type':'product_released',
            'event_date':'2022-11-14',
            'event_date_basis':'release',
            'title':'Trust Wallet Browser Extension launched for desktop browsers',
            'description':'Trust Wallet announced the launch of its new browser extension wallet on 2022-11-14, with availability for Chrome, Brave, and Opera at launch and support for EVM chains and Solana.',
            'confidence':'high',
            'event_status_effect':'active',
            'is_major_event':True,
            'notes':'This event is scoped to the Browser Extension product and does not alter the separate Trust Wallet Mobile product lineage. WLR does not infer launch-day support for browsers not named in the launch statement.'
          }
          source={
            'id':'wlr_src_000141',
            'entity_id':'wlr_ent_000009',
            'product_ids':['wlr_prod_000036'],
            'event_ids':['wlr_ev_000085'],
            'product_id':'wlr_prod_000036',
            'event_id':'wlr_ev_000085',
            'source_type':'official_statement',
            'title':'Trust Wallet launches highly anticipated browser extension wallet for desktop',
            'url':'https://www.prnewswire.com/news-releases/trust-wallet-launches-highly-anticipated-browser-extension-wallet-for-desktop-301676375.html',
            'publisher':'Trust Wallet',
            'published_at':'2022-11-14',
            'accessed_at':'2026-08-17',
            'reliability':'high',
            'claim_scope':'launch_date',
            'is_primary':True,
            'notes':'Trust Wallet-provided press release distributed through PR Newswire, explicitly announcing the browser extension launch and its launch-day browser availability.'
          }
          append_rows(events_path,[event])
          append_rows(evidence_path,[source])
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted Trust Wallet batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          p=next(x for x in products if x['id']=='wlr_prod_000036')
          assert p['launch_date']=='2022-11-14' and p['launch_date_precision']=='day'
          assert p['entity_id']=='wlr_ent_000009' and p['slug']=='trust-wallet-browser-extension'
          e=next(x for x in events if x['id']=='wlr_ev_000085')
          assert e['event_type']=='product_released' and e['event_date']=='2022-11-14' and e['event_date_basis']=='release'
          assert e['product_id']=='wlr_prod_000036' and e['entity_id']=='wlr_ent_000009'
          s=next(x for x in evidence if x['id']=='wlr_src_000141')
          assert s['product_id']=='wlr_prod_000036' and s['event_id']=='wlr_ev_000085'
          assert s['source_type']=='official_statement' and s['claim_scope']=='launch_date' and s['reliability']=='high' and s['is_primary'] is True
          assert len(products)==69 and len(events)==85 and len(evidence)==141
          print('TRUST_WALLET_EXTENSION_STAGE_OK products=69 events=85 evidence=141 launch_coverage_expected=49/69 incidents=18 remediation=7')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed Trust Wallet extension launch history'
          git push origin HEAD:data/trust-wallet-browser-extension-launch
