name: Stage SafePal S1 launch history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-safepal-s1-launch.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed SafePal S1 launch records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/products.json')
          text = p.read_text(encoding='utf-8')
          old = '"id":"wlr_prod_000070","entity_id":"wlr_ent_000026","slug":"safepal-s1","product_name":"SafePal S1","aliases":[],"product_type":"hardware_device","status":"active","sales_status":"unknown","support_status":"supported","launch_date":null,'
          new = '"id":"wlr_prod_000070","entity_id":"wlr_ent_000026","slug":"safepal-s1","product_name":"SafePal S1","aliases":[],"product_type":"hardware_device","status":"active","sales_status":"unknown","support_status":"supported","launch_date":"2019-05-27","launch_date_precision":"day",'
          if text.count(old) != 1:
              raise SystemExit('SafePal S1 product precondition failed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append(path, obj):
              q = Path(path)
              t = q.read_text(encoding='utf-8')
              end = t.rfind(']')
              before = t[:end].rstrip()
              q.write_text(before + ',\n' + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n]\n', encoding='utf-8')

          events = json.loads(Path('data/events.json').read_text())
          evidence = json.loads(Path('data/evidence.json').read_text())
          if any(x.get('id') == 'wlr_ev_000091' for x in events): raise SystemExit('event id already used')
          if any(x.get('id') == 'wlr_src_000149' for x in evidence): raise SystemExit('source id already used')

          append('data/events.json', {
            'id':'wlr_ev_000091','entity_id':'wlr_ent_000026','product_id':'wlr_prod_000070','affected_product_ids':['wlr_prod_000070'],
            'event_type':'product_released','event_date':'2019-05-27','event_date_basis':'release',
            'title':'SafePal S1 opened for sale','description':'SafePal states that the S1 hardware wallet opened for sale on May 27, 2019, marking the commercial release of its first hardware wallet.',
            'confidence':'high','event_status_effect':'active','is_major_event':True,
            'notes':'The release date uses SafePal’s first-party progress update. Current SafePal history independently places the official S1 launch in May 2019.'
          })
          append('data/evidence.json', {
            'id':'wlr_src_000149','entity_id':'wlr_ent_000026','product_ids':['wlr_prod_000070'],'event_ids':['wlr_ev_000091'],
            'product_id':'wlr_prod_000070','event_id':'wlr_ev_000091','source_type':'official_blog','title':'SafePal Progress Update',
            'url':'https://www.safepal.com/en/blog/safepal-progress-update','publisher':'SafePal','published_at':'2019-09-11','accessed_at':'2026-08-17',
            'reliability':'high','claim_scope':'launch_date','is_primary':True,
            'notes':'First-party SafePal update explicitly states that SafePal S1 was open for sale on May 27, 2019.'
          })
          PY
      - name: Validate
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py
          python3 scripts/report_coverage.py --fail-on-structural
      - name: Push reviewed branch
        run: |
          set -euo pipefail
          branch='data/safepal-s1-launch-history'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          rm .github/workflows/stage-safepal-s1-launch.yml
          git add data/products.json data/events.json data/evidence.json .github/workflows/stage-safepal-s1-launch.yml
          git commit -m 'Add reviewed SafePal S1 launch history'
          git push origin "$branch"
