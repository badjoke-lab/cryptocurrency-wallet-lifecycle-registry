name: Stage reviewed entity growth batch 04 candidates

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  review:
    if: github.head_ref == 'review/entity-growth-batch-04'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/entity-growth-batch-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate researching candidates before review promotion
        run: |
          set -euo pipefail
          npm run validate:candidates
          npm run validate:identity-evidence
          npm run check:staging-boundary
      - name: Apply explicit manual review decisions
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const files = ['a','b','c','d','e'].map(g => `data-staging/candidates/entity-growth-batch-04-${g}.json`);
          const bundles = files.map(file => ({file, data: JSON.parse(fs.readFileSync(file, 'utf8'))}));
          const entities = bundles.flatMap(x => x.data.records.entities || []);
          const products = bundles.flatMap(x => x.data.records.products || []);
          const events = bundles.flatMap(x => x.data.records.events || []);
          const evidence = bundles.flatMap(x => x.data.records.evidence || []);
          if (entities.length !== 25 || products.length !== 25 || events.length !== 0 || evidence.length !== 50) {
            throw new Error(`unexpected Batch 04 counts entities=${entities.length} products=${products.length} events=${events.length} evidence=${evidence.length}`);
          }
          const exactRange = (rows, prefix, start, end) => {
            const actual = rows.map(x => x.id).sort();
            const expected = [];
            for (let i=start; i<=end; i++) expected.push(`${prefix}${String(i).padStart(6,'0')}`);
            if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`unexpected ${prefix} ID range`);
          };
          exactRange(entities, 'wlr_ent_', 76, 100);
          exactRange(products, 'wlr_prod_', 125, 149);
          exactRange(evidence, 'wlr_src_', 297, 346);
          const by = (rows, id) => {
            const row = rows.find(x => x.id === id);
            if (!row) throw new Error(`missing ${id}`);
            return row;
          };
          const slugs = new Set(entities.map(x => x.slug));
          for (const rejected of ['sollet','slope-wallet','slope','cake-wallet','onekey-wallet','blockstream-app']) {
            if (slugs.has(rejected)) throw new Error(`rejected or duplicate candidate still present: ${rejected}`);
          }
          for (const replacement of ['taho','sequence','nightly-wallet']) {
            if (!slugs.has(replacement)) throw new Error(`replacement candidate missing: ${replacement}`);
          }
          if (by(entities,'wlr_ent_000076').custody_model !== 'self_custody') throw new Error('Coinbase Wallet custody boundary changed');
          if (!by(entities,'wlr_ent_000080').aliases.includes('MyTonWallet')) throw new Error('My Wallet rebrand continuity missing');
          const taho = by(entities,'wlr_ent_000087');
          if (taho.slug !== 'taho' || taho.custody_model !== 'self_custody' || !taho.aliases.includes('Tally Ho')) throw new Error('Taho lineage/custody boundary changed');
          const tahoProduct = by(products,'wlr_prod_000136');
          if (tahoProduct.slug !== 'taho-browser-extension' || tahoProduct.product_type !== 'browser_extension') throw new Error('Taho product boundary changed');
          const sequence = by(entities,'wlr_ent_000088');
          if (sequence.slug !== 'sequence' || sequence.custody_model !== 'self_custody') throw new Error('Sequence custody boundary changed');
          const sequenceProduct = by(products,'wlr_prod_000137');
          if (sequenceProduct.slug !== 'sequence-universal-wallet' || sequenceProduct.product_type !== 'web_app') throw new Error('Sequence Universal Wallet boundary changed');
          const nightly = by(entities,'wlr_ent_000089');
          if (nightly.slug !== 'nightly-wallet' || nightly.custody_model !== 'self_custody') throw new Error('Nightly Wallet boundary changed');
          const nightlyProduct = by(products,'wlr_prod_000138');
          if (nightlyProduct.slug !== 'nightly-browser-extension' || nightlyProduct.product_type !== 'browser_extension') throw new Error('Nightly extension boundary changed');
          if (by(products,'wlr_prod_000141').slug !== 'breez-mobile') throw new Error('Breez wallet/SDK boundary changed');
          if (by(entities,'wlr_ent_000095').status !== 'dead') throw new Error('Samourai entity must remain dead');
          const samourai = by(products,'wlr_prod_000144');
          if (samourai.status !== 'dead' || samourai.support_status !== 'ended' || samourai.discontinued_date !== '2024-04-24') throw new Error('Samourai terminal product boundary changed');
          const casa = by(entities,'wlr_ent_000097');
          if (casa.custody_model !== 'hybrid' || !Array.isArray(casa.system_components) || casa.system_components.filter(x => x.controlled_by === 'provider').length !== 1) throw new Error('Casa recovery-key boundary changed');
          if (by(products,'wlr_prod_000145').support_status !== 'supported') throw new Error('Specter current maintenance boundary changed');
          const keepkey = by(products,'wlr_prod_000147');
          if (keepkey.sales_status !== 'on_sale' || keepkey.support_status !== 'supported' || keepkey.launch_date !== '2014') throw new Error('KeepKey current boundary changed');
          if (by(products,'wlr_prod_000148').sales_status !== 'on_sale') throw new Error('Satochip sale boundary changed');
          const prokey = by(products,'wlr_prod_000149');
          if (prokey.sales_status !== 'on_sale' || prokey.launch_date !== '2020-07-02') throw new Error('Prokey launch/sale boundary changed');
          for (const bundle of bundles) {
            bundle.data.review_state = 'review_ready';
            bundle.data.notes = `${bundle.data.notes} Manual review completed 2026-08-20: identity, selected runtime, lifecycle, custody, dates and evidence boundaries accepted for canonical promotion subject to final validation.`;
            fs.writeFileSync(bundle.file, JSON.stringify(bundle.data, null, 2) + '\n');
          }
          NODE
      - name: Validate review-ready boundary
        run: |
          set -euo pipefail
          for group in a b c d e; do
            jq -e '.review_state == "review_ready"' "data-staging/candidates/entity-growth-batch-04-${group}.json" >/dev/null
          done
          npm run validate:candidates
          npm run validate:identity-evidence
          npm run check:staging-boundary
      - name: Commit reviewed candidate bundles
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-staging/candidates/entity-growth-batch-04-{a,b,c,d,e}.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Mark entity growth batch 04 review ready'
          git push origin HEAD:review/entity-growth-batch-04
