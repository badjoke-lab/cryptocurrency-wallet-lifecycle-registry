name: Temporary Trezor ShipMonk scope update

on:
  push:
    branches:
      - feat/trezor-shipmonk-scope-expansion-20260904

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/trezor-shipmonk-scope-expansion-20260904
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Update Trezor ShipMonk incident scope
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const entityPath = 'data/entities.json';
          const eventPath = 'data/events.json';
          const evidencePath = 'data/evidence.json';

          const entities = JSON.parse(fs.readFileSync(entityPath, 'utf8'));
          const events = JSON.parse(fs.readFileSync(eventPath, 'utf8'));
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));

          const trezor = entities.find((row) => row.id === 'wlr_ent_000001');
          if (!trezor) throw new Error('Trezor entity not found');
          trezor.last_verified_at = '2026-09-04';

          const event = events.find((row) => row.id === 'wlr_ev_000010');
          if (!event) throw new Error('Trezor ShipMonk event not found');
          event.title = 'ShipMonk customer data breach disclosed and later expanded';
          event.description = 'Trezor disclosed that ShipMonk, a third-party fulfillment partner, experienced unauthorized access exposing customer order information; on 2026-09-04 Trezor reported that the breach also affected approximately 67,000 additional U.S. customers whose orders dated from November 2019 to August 2021.';
          event.affected_users_text = 'More than 80,000 customers known affected in total: 13,689 disclosed on 2026-08-13, plus approximately 67,000 additional U.S. customers disclosed on 2026-09-04.';
          event.affected_data = Array.from(new Set([...(event.affected_data || []), 'order_number']));
          event.notes = 'Trezor stated that its systems, products and services were not compromised. ShipMonk notified Trezor on 2026-08-10. On 2026-09-04, Trezor said ShipMonk had retained older U.S. order records despite repeated written assurances that data had been deleted in line with contract and policy. Trezor warned of phishing, fraudulent calls or letters, and potential physical-security risks.';

          const initialBlog = evidence.find((row) => row.id === 'wlr_src_000010');
          if (initialBlog) initialBlog.accessed_at = '2026-09-04';

          let maxSource = evidence.reduce((max, row) => {
            const match = /^wlr_src_(\d{6})$/.exec(row.id || '');
            return match ? Math.max(max, Number(match[1])) : max;
          }, 0);
          const nextSourceId = () => `wlr_src_${String(++maxSource).padStart(6, '0')}`;
          const existingUrls = new Set(evidence.map((row) => row.url));

          const additions = [
            {
              id: null,
              entity_id: 'wlr_ent_000001',
              product_id: null,
              event_id: 'wlr_ev_000010',
              source_type: 'official_social',
              title: 'ShipMonk breach follow-up: additional 67,000 U.S. customers affected',
              url: 'https://x.com/Trezor/status/2095807665603584085',
              publisher: 'Trezor',
              published_at: '2026-09-04',
              accessed_at: '2026-09-04',
              reliability: 'high',
              claim_scope: 'customer_data',
              is_primary: true,
              notes: 'Official follow-up expanding the known scope to approximately 67,000 additional U.S. customers with orders from November 2019 through August 2021, and stating that ShipMonk had retained data despite written deletion assurances.'
            },
            {
              id: null,
              entity_id: 'wlr_ent_000001',
              product_id: null,
              event_id: 'wlr_ev_000010',
              source_type: 'news_article',
              title: '67,000 More Trezor Customers Exposed as Data Breach Widens',
              url: 'https://decrypt.co/377389/67000-more-trezor-customers-exposed-as-data-breach-widens',
              publisher: 'Decrypt',
              published_at: '2026-09-04',
              accessed_at: '2026-09-04',
              reliability: 'high',
              claim_scope: 'customer_data',
              is_primary: false,
              notes: 'Secondary reporting corroborating Trezor’s September 4 scope expansion and the older U.S. order-data retention issue.'
            }
          ];

          for (const row of additions) {
            if (existingUrls.has(row.url)) continue;
            row.id = nextSourceId();
            evidence.push(row);
            existingUrls.add(row.url);
          }

          fs.writeFileSync(entityPath, JSON.stringify(entities, null, 2) + '\n');
          fs.writeFileSync(eventPath, JSON.stringify(events, null, 2) + '\n');
          fs.writeFileSync(evidencePath, JSON.stringify(evidence, null, 2) + '\n');
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Validate records
        run: npm run validate:records

      - name: Build site and generated layers
        run: npm run build

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-trezor-shipmonk-update.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Trezor ShipMonk breach scope"
          git push origin HEAD:feat/trezor-shipmonk-scope-expansion-20260904
