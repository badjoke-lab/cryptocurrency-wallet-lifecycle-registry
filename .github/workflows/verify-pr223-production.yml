name: Verify WLR PR223 Production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-main-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Pin exact merged main
        run: test "$(git rev-parse HEAD)" = "e872b344fb9c09d4f704b9f7db7e8136c26fc998"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: npm run validate:records
      - run: npm run validate:candidates
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:structured-discovery
      - run: npm run test:natural-filters
      - run: npm run validate:natural-filters
      - run: npm run validate:compare
      - run: npm run validate:stats
      - run: npm run test:monitoring
      - run: npm run validate:monitoring
      - run: npm run test:candidates
      - run: npm run test:identity-evidence
      - run: npm run check:staging-boundary
      - run: npm run coverage:audit
      - run: npm run seed:gate
      - run: npm run cloudflare:config:print
      - run: npm run build
      - name: Verify Phase 9 Series contract
        run: |
          set -euo pipefail
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          git diff --exit-code -- public/data/series

  production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build exact-main expected state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e872b344fb9c09d4f704b9f7db7e8136c26fc998"
          npm install --no-audit --no-fund
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          git diff --exit-code -- public/data/series
          jq -e '.registry.entities == 100 and .registry.products == 149 and .registry.events == 133 and .registry.evidence == 359 and .registry.incident_events == 25 and .registry.remediation_events == 9 and .registry.eol_events == 7' public/data/stats.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000132") | .event_type == "rebranded" and .event_date == "2024-12" and .event_date_basis == "approximate"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000133") | .event_type == "product_released" and .event_date == "2021-11-16" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000358") | .event_id == "wlr_ev_000132" and .reliability == "high"' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000359") | .event_id == "wlr_ev_000133" and .reliability == "high"' data/evidence.json >/dev/null
          jq -e '.record_counts.primary_records == 100 and .record_counts.native.events == 133 and .record_counts.native.evidence == 359' public/data/series/registry.json >/dev/null
          jq -e '.record_count == 249 and .record_counts.wallets == 100 and .record_counts.products == 149' public/data/series/index.json >/dev/null
          echo 'Exact-main stats:'
          jq '{registry, support_known:.data_quality.products.support_status_known, sales_known:.data_quality.products.sales_status_known}' public/data/stats.json
      - name: Resolve exact Cloudflare production deployment
        id: cf
        run: |
          set -euo pipefail
          expected="e872b344fb9c09d4f704b9f7db7e8136c26fc998"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          match=""
          for attempt in $(seq 1 100); do
            deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
            match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
            if [ -n "$match" ] && jq -e '.latest_stage.status == "success"' <<<"$match" >/dev/null; then break; fi
            echo "Waiting for exact deployment attempt=${attempt}"; sleep 10
          done
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and .deployment_trigger.metadata.commit_dirty == false and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          echo "deployment_url=$(jq -r '.url' <<<"$match")" >> "$GITHUB_OUTPUT"
          echo "$match" | jq '{id,short_id,url,aliases,latest_stage,deployment_trigger}'
      - name: Verify public depth batch 03
        env:
          DEPLOYMENT_URL: ${{ steps.cf.outputs.deployment_url }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
          curl -fsSL "${DEPLOYMENT_URL}/data/stats.json?verify=e872b344" -o "$work/deploy-stats.json"
          jq -e '.registry.events == 133 and .registry.evidence == 359' "$work/deploy-stats.json" >/dev/null
          ready=0
          for attempt in $(seq 1 60); do
            nonce="e872b344-${attempt}-$(date +%s)"; ok=1
            for name in entities products events evidence stats; do curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/${name}.json?verify=${nonce}" -o "$work/${name}.json" || ok=0; done
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/series/registry.json?verify=${nonce}" -o "$work/series-registry.json" || ok=0
            if [ "$ok" -eq 1 ] && jq -e '.registry.events == 133 and .registry.evidence == 359' "$work/stats.json" >/dev/null 2>&1 && jq -e '.record_counts.native.events == 133 and .record_counts.native.evidence == 359' "$work/series-registry.json" >/dev/null 2>&1; then
              good=1
              jq -e '.[] | select(.id == "wlr_ev_000132") | .event_type == "rebranded" and .event_date == "2024-12"' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_ev_000133") | .event_type == "product_released" and .event_date == "2021-11-16"' "$work/events.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_src_000358") | .event_id == "wlr_ev_000132"' "$work/evidence.json" >/dev/null 2>&1 || good=0
              jq -e '.[] | select(.id == "wlr_src_000359") | .event_id == "wlr_ev_000133"' "$work/evidence.json" >/dev/null 2>&1 || good=0
              if [ "$good" -eq 1 ]; then ready=1; echo "Public depth batch 03 exact on attempt=${attempt}"; break; fi
            fi
            sleep 10
          done
          test "$ready" -eq 1
          routes=(
            wallet/binance-wallet product/binance-wallet-mobile data/series/records/wallet--binance-wallet.json data/series/records/product--binance-wallet-mobile.json
            wallet/brave-wallet product/brave-wallet-browser data/series/records/wallet--brave-wallet.json data/series/records/product--brave-wallet-browser.json
          )
          nonce="$(date +%s)"
          for route in "${routes[@]}"; do
            suffix="/"; [[ "$route" == *.json ]] && suffix=""
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://wlr.badjoke-lab.com/${route}${suffix}?verify=${nonce}")"
            test "$code" -ge 200 && test "$code" -lt 400
            echo "WLR route ${route}${suffix} -> ${code}"
          done
          echo 'PR223_PRODUCTION_VERIFY_OK entities=100 products=149 events=133 evidence=359 series_records=249'
