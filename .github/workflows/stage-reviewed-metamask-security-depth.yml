name: Stage reviewed MetaMask security depth

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/metamask-june-2022-security-depth'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/metamask-june-2022-security-depth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply manually reviewed canonical records
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p,v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const acceptedEvents = [
            {
              id:'wlr_ev_000116', entity_id:'wlr_ent_000004', product_id:'wlr_prod_000019', affected_product_ids:['wlr_prod_000019'],
              event_type:'vulnerability_disclosed', event_date:'2022-06', event_date_basis:'disclosure',
              title:'MetaMask Extension critical clickjacking vulnerability disclosed',
              description:'MetaMask reported a critical Extension-only clickjacking vulnerability that could render the wallet UI as a hidden layer over a malicious site and trick users into revealing private data or sending crypto-assets. MetaMask awarded the reporting team a $120,000 bounty and stated that Extension 10.14.6 and later were protected.',
              confidence:'high', impact_level:'critical', security_scope:'browser_extension', funds_affected:'unknown', event_status_effect:'none',
              affected_version_rules:[{product_ids:['wlr_prod_000019'],track:'extension',range:'<10.14.6'}],
              fixed_versions:[{product_ids:['wlr_prod_000019'],track:'extension',version:'10.14.6'}],
              is_major_event:true, user_actions_required:['update'], affected_components:['extension_ui'],
              notes:'Month precision is intentional: the reviewed first-party source establishes a June 2022 disclosure but not one defensible exact public disclosure day. MetaMask reported no known exploitation before the patch, but WLR does not convert that into a stronger funds_affected=no claim.'
            },
            {
              id:'wlr_ev_000117', entity_id:'wlr_ent_000004', product_id:'wlr_prod_000019', affected_product_ids:['wlr_prod_000019'],
              event_type:'vulnerability_disclosed', event_date:'2022-06-15', event_date_basis:'disclosure',
              title:'Demonic vulnerability exposed MetaMask Extension recovery phrases on disk',
              description:'Halborn disclosed CVE-2022-32969, known as Demonic, in which browser session-restore behavior could cache an imported Secret Recovery Phrase to disk in plaintext under specified conditions. MetaMask Extension versions before 10.11.3 were affected; MetaMask implemented mitigations in 10.11.3 and later, and MetaMask Mobile was not affected.',
              confidence:'high', impact_level:'medium', security_scope:'browser_extension', funds_affected:'unknown', event_status_effect:'none', cve_ids:['CVE-2022-32969'],
              affected_version_rules:[{product_ids:['wlr_prod_000019'],track:'extension',range:'<10.11.3'}],
              fixed_versions:[{product_ids:['wlr_prod_000019'],track:'extension',version:'10.11.3'}],
              is_major_event:true, user_actions_required:['update'], affected_components:['secret_recovery_phrase_import','browser_session_restore'],
              notes:'Halborn\'s 2022-06-15 coordinated public disclosure supplies the event date. NVD rates CVE-2022-32969 at CVSS 3.1 5.9 MEDIUM and records MetaMask versions before 10.11.3 as affected. First-party MetaMask reporting explicitly excludes MetaMask Mobile. No confirmed funds-loss statement is established, so funds_affected remains unknown.'
            }
          ];
          for (const row of acceptedEvents) {
            const old = events.find(x => x.id === row.id);
            if (old && JSON.stringify(old) !== JSON.stringify(row)) throw new Error(`${row.id} collision`);
            if (!old) events.push(row);
          }

          const acceptedEvidence = [
            {
              id:'wlr_src_000189', entity_id:'wlr_ent_000004', product_id:'wlr_prod_000019', event_id:null, event_ids:['wlr_ev_000116','wlr_ev_000117'],
              source_type:'official_blog', title:'MetaMask Security Monthly: June 2022',
              url:'https://metamask.io/ru/news/metamask-security-monthly-june-2022', publisher:'MetaMask', published_at:'2022-06-30', accessed_at:'2026-08-18',
              reliability:'high', claim_scope:'vulnerability', is_primary:true,
              notes:'First-party MetaMask security report. Supports the Extension-only critical clickjacking vulnerability, protected version 10.14.6+, the Demonic disk-caching issue, mitigation in 10.11.3+, and explicit exclusion of MetaMask Mobile from Demonic.'
            },
            {
              id:'wlr_src_000190', entity_id:'wlr_ent_000004', product_id:'wlr_prod_000019', event_id:'wlr_ev_000117',
              source_type:'security_research', title:'Halborn MetaMask Demonic Vulnerability Discovery',
              url:'https://www.halborn.com/disclosures/demonic-vulnerability', publisher:'Halborn', published_at:'2022-06-15', accessed_at:'2026-08-18',
              reliability:'high', claim_scope:'vulnerability', is_primary:true,
              notes:'Primary researcher disclosure published 2022-06-15 after coordinated mitigation work. Describes plaintext Secret Recovery Phrase persistence through browser session-restore behavior and the attacker\'s remote/physical access path.'
            },
            {
              id:'wlr_src_000191', entity_id:'wlr_ent_000004', product_id:'wlr_prod_000019', event_id:'wlr_ev_000117',
              source_type:'cve', title:'CVE-2022-32969 Detail',
              url:'https://nvd.nist.gov/vuln/detail/CVE-2022-32969', publisher:'NIST National Vulnerability Database', published_at:'2022-06-29', accessed_at:'2026-08-18',
              reliability:'high', claim_scope:'affected_versions', is_primary:false,
              notes:'NVD enrichment records CVSS 3.1 score 5.9 MEDIUM and MetaMask versions up to but excluding 10.11.3 as affected, with the MetaMask 10.11.2-to-10.11.3 comparison referenced as a patch boundary.'
            }
          ];
          for (const row of acceptedEvidence) {
            const old = evidence.find(x => x.id === row.id);
            if (old && JSON.stringify(old) !== JSON.stringify(row)) throw new Error(`${row.id} collision`);
            if (!old) evidence.push(row);
          }

          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify reviewed canonical boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_ev_000116") | .entity_id == "wlr_ent_000004" and .product_id == "wlr_prod_000019" and .event_date == "2022-06" and .event_date_basis == "disclosure" and .impact_level == "critical" and .security_scope == "browser_extension" and .funds_affected == "unknown" and .affected_version_rules[0].range == "<10.14.6" and .fixed_versions[0].version == "10.14.6"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000117") | .entity_id == "wlr_ent_000004" and .product_id == "wlr_prod_000019" and .event_date == "2022-06-15" and .event_date_basis == "disclosure" and .impact_level == "medium" and .security_scope == "browser_extension" and .funds_affected == "unknown" and (.cve_ids | index("CVE-2022-32969")) != null and .affected_version_rules[0].range == "<10.11.3" and .fixed_versions[0].version == "10.11.3"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000189") | (.event_ids | sort) == (["wlr_ev_000116","wlr_ev_000117"] | sort) and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000190") | .event_id == "wlr_ev_000117" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000191") | .event_id == "wlr_ev_000117" and .source_type == "cve" and .claim_scope == "affected_versions"' data/evidence.json >/dev/null
          node scripts/build-stats.mjs
          jq -e '.registry.entities == 26 and .registry.products == 74 and .registry.events == 117 and .registry.evidence == 191 and .registry.incident_events == 21' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_impact_level.count == 21 and .data_quality.events.incident_impact_level.denominator == 21 and .data_quality.events.incident_impact_level.percentage == 100' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_funds_affected.count == 21 and .data_quality.events.incident_funds_affected.denominator == 21 and .data_quality.events.incident_funds_affected.percentage == 100' public/data/stats.json >/dev/null
      - name: Commit explicit canonical edit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed MetaMask June 2022 security depth'
          git push origin HEAD:review/metamask-june-2022-security-depth
