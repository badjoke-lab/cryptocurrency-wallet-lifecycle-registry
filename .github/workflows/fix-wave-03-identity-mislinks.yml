name: Repair Wave 03 identity mislinks
on:
  push:
    branches: [fix/wave-03-identity-mislinks]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Repair canonical identity links
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          ep=Path('data/events.json'); sp=Path('data/evidence.json')
          events=json.loads(ep.read_text()); evidence=json.loads(sp.read_text())
          ev={x['id']:x for x in events}; src={x['id']:x for x in evidence}
          # Taho: existing canonical entity/product.
          e=ev['wlr_ev_000193']; e['entity_id']='wlr_ent_000087'; e['product_id']='wlr_prod_000136'; e['affected_product_ids']=['wlr_prod_000136']
          s=src['wlr_src_000462']; s['entity_id']='wlr_ent_000087'; s['product_id']='wlr_prod_000136'
          # Remove records whose researched wallet entities/products are not canonical.
          remove_events={'wlr_ev_000194','wlr_ev_000195','wlr_ev_000196'}
          remove_sources={'wlr_src_000463','wlr_src_000464','wlr_src_000465'}
          events=[x for x in events if x['id'] not in remove_events]
          evidence=[x for x in evidence if x['id'] not in remove_sources]
          ev={x['id']:x for x in events}; src={x['id']:x for x in evidence}
          # Nightly: existing canonical entity/product.
          e=ev['wlr_ev_000197']; e['entity_id']='wlr_ent_000089'; e['product_id']='wlr_prod_000138'; e['affected_product_ids']=['wlr_prod_000138']
          s=src['wlr_src_000466']; s['entity_id']='wlr_ent_000089'; s['product_id']='wlr_prod_000138'
          # Xverse source describes a web-wallet capability not represented by a canonical product.
          # Keep it at entity level rather than falsely attaching it to Taho or guessing a product.
          e=ev['wlr_ev_000198']; e['entity_id']='wlr_ent_000020'; e['product_id']=None; e['affected_product_ids']=[]
          s=src['wlr_src_000467']; s['entity_id']='wlr_ent_000020'; s['product_id']=None
          ep.write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n')
          sp.write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          print('REPAIRED events',len(events),'evidence',len(evidence))
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate and validate
        run: |
          npm run prebuild
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
          npm run coverage:audit
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair Wave 03 canonical identity links'
          git push origin HEAD:fix/wave-03-identity-mislinks
