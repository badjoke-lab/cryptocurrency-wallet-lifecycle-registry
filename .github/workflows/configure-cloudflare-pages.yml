name: Configure Cloudflare Pages

# ops/cloudflare-publication is a temporary branch-only trigger for publication recovery.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compare or apply the repository Cloudflare Pages policy
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
  push:
    branches:
      - ops/cloudflare-publication
    paths:
      - .github/workflows/configure-cloudflare-pages.yml

permissions:
  contents: read

concurrency:
  group: wlr-cloudflare-pages-configuration
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Print repository Cloudflare policy
        run: npm run cloudflare:config:print

      - name: Bootstrap and apply Cloudflare Pages project from ops branch
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:config:apply

      - name: Ensure WLR custom-domain CNAME
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          zone_id="147e01c60264c3d27fbfa37dae868062"
          name="wlr.badjoke-lab.com"
          target="cryptocurrency-wallet-lifecycle-registry.pages.dev"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          api="https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records"

          response="$(curl -sS "${api}?type=CNAME&name=${name}" -H "$auth")"
          if [ "$(jq -r '.success' <<<"$response")" != "true" ]; then
            echo "$response" | jq '{success, errors}'
            echo 'Cloudflare token cannot read WLR DNS record.' >&2
            exit 2
          fi

          count="$(jq '.result | length' <<<"$response")"
          if [ "$count" -gt 1 ]; then
            echo 'Multiple CNAME records found for WLR; refusing to mutate.' >&2
            exit 3
          fi
          if [ "$count" -eq 1 ]; then
            existing="$(jq -r '.result[0].content' <<<"$response")"
            if [ "$existing" != "$target" ]; then
              echo "Existing WLR CNAME points to ${existing}; refusing to overwrite." >&2
              exit 4
            fi
            echo "WLR CNAME already points to ${target}."
          else
            create="$(curl -sS -X POST "$api" -H "$auth" -H 'Content-Type: application/json' --data "{\"type\":\"CNAME\",\"name\":\"${name}\",\"content\":\"${target}\",\"ttl\":1,\"proxied\":true,\"comment\":\"Wallet Lifecycle Registry Cloudflare Pages\"}")"
            if [ "$(jq -r '.success' <<<"$create")" != "true" ]; then
              echo "$create" | jq '{success, errors}'
              echo 'Cloudflare token cannot create WLR DNS record.' >&2
              exit 5
            fi
            echo "$create" | jq '{success, result: {id: .result.id, type: .result.type, name: .result.name, content: .result.content, proxied: .result.proxied}}'
          fi

      - name: Inspect Cloudflare publication state
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          echo 'Project publication target:'
          curl -fsS "$base" -H "$auth" | jq '{success, result: {name: .result.name, subdomain: .result.subdomain, production_branch: .result.production_branch, source: {type: .result.source.type, owner: .result.source.config.owner, repo_name: .result.source.config.repo_name}}}'
          echo 'Custom domain state:'
          curl -fsS "${base}/domains/wlr.badjoke-lab.com" -H "$auth" | jq '{success, result: {name: .result.name, status: .result.status, zone_tag: .result.zone_tag, validation_data: .result.validation_data, verification_data: .result.verification_data}}'
          echo 'Production deployments:'
          curl -fsS "${base}/deployments?env=production&per_page=5" -H "$auth" | jq '{success, deployments: [.result[] | {id, short_id, url, aliases, environment, created_on, latest_stage, deployment_trigger}]}'

      - name: Verify WLR public HTTP
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          base="https://wlr.badjoke-lab.com"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          paths=(
            "/"
            "/hardware"
            "/software"
            "/incidents"
            "/methodology"
            "/about"
            "/support"
            "/wallet/trezor"
            "/product/trezor-model-one"
            "/version.json"
            "/data/manifest.json"
            "/data/entities.json"
            "/data/products.json"
            "/data/events.json"
            "/data/evidence.json"
            "/data/wallet-index.json"
            "/data/product-index.json"
            "/data/wallets/trezor.json"
            "/data/products/trezor-model-one.json"
            "/llms.txt"
            "/ai.txt"
            "/robots.txt"
            "/sitemap.xml"
          )

          for path in "${paths[@]}"; do
            code="$(curl -sSL --retry 10 --retry-all-errors --retry-delay 2 -o "$work/body" -w '%{http_code}' "${base}${path}")"
            if [ "$code" != "200" ]; then
              echo "${path}: final HTTP ${code}" >&2
              exit 10
            fi
            echo "${path}: final HTTP 200"
          done

          curl -fsSL "$base/version.json" -o "$work/version.json"
          curl -fsSL "$base/data/manifest.json" -o "$work/manifest.json"
          for name in entities products events evidence; do
            curl -fsSL "$base/data/${name}.json" -o "$work/${name}.json"
          done
          curl -fsSL "$base/data/wallet-index.json" -o "$work/wallet-index.json"
          curl -fsSL "$base/data/product-index.json" -o "$work/product-index.json"
          curl -fsSL "$base/data/wallets/trezor.json" -o "$work/wallet-trezor.json"
          curl -fsSL "$base/data/products/trezor-model-one.json" -o "$work/product-trezor-model-one.json"

          jq -e '.project == "WLR" and .version == "0.1.0" and .schema_version == "v3"' "$work/version.json" >/dev/null
          jq -e '.project == "Wallet Lifecycle Registry" and .short_name == "WLR" and .data_safety == "canonical_only"' "$work/manifest.json" >/dev/null
          jq -e '.schema == "wlr.wallet-record.v1" and .entity.slug == "trezor"' "$work/wallet-trezor.json" >/dev/null
          jq -e '.schema == "wlr.product-record.v1" and .entity.slug == "trezor" and .product.slug == "trezor-model-one"' "$work/product-trezor-model-one.json" >/dev/null

          entities="$(jq 'length' "$work/entities.json")"
          products="$(jq 'length' "$work/products.json")"
          events="$(jq 'length' "$work/events.json")"
          evidence="$(jq 'length' "$work/evidence.json")"
          wallets="$(jq 'length' "$work/wallet-index.json")"
          product_records="$(jq 'length' "$work/product-index.json")"

          jq -e \
            --argjson entities "$entities" \
            --argjson products "$products" \
            --argjson events "$events" \
            --argjson evidence "$evidence" \
            --argjson wallets "$wallets" \
            --argjson product_records "$product_records" \
            '.record_counts.entities == $entities and
             .record_counts.products == $products and
             .record_counts.events == $events and
             .record_counts.evidence == $evidence and
             .record_counts.wallet_records == $wallets and
             .record_counts.product_records == $product_records' \
            "$work/manifest.json" >/dev/null

          test "$entities" -eq 25
          test "$products" -eq 69
          test "$wallets" -eq 25
          test "$product_records" -eq 69

          git fetch origin main --depth=1
          for name in entities products events evidence; do
            git show "origin/main:data/${name}.json" > "$work/main-${name}.json"
            cmp "$work/main-${name}.json" "$work/${name}.json"
          done

          curl -fsSL "$base/" | grep -Fq 'Wallet Lifecycle Registry'
          curl -fsSL "$base/wallet/trezor" | grep -Fq 'Trezor'
          curl -fsSL "$base/product/trezor-model-one" | grep -Fq 'Trezor Model One'
          curl -fsSL "$base/support" | grep -Fq 'Support'
          curl -fsSL "$base/llms.txt" | grep -Fq 'Deterministic record views'
          curl -fsSL "$base/ai.txt" | grep -Fq 'not recommendations'

          git show origin/main:src/app/globals.css > "$work/globals.css"
          git show origin/main:src/app/support/page.tsx > "$work/support.tsx"
          git show origin/main:src/components/incident-explorer.tsx > "$work/incidents.tsx"
          grep -Fq '@media(max-width:720px)' "$work/globals.css"
          grep -Fq 'overflow-x:hidden' "$work/globals.css"
          grep -Fq '.table-wrap{overflow-x:auto}' "$work/globals.css"
          grep -Fq 'word-break:break-all' "$work/globals.css"
          grep -Fq '.chip-active,.chip-low{color:var(--positive)' "$work/globals.css"
          grep -Fq '.chip-limited,.chip-medium{color:var(--warning)' "$work/globals.css"
          grep -Fq '.chip-deprecated,.chip-high{color:var(--high)' "$work/globals.css"
          grep -Fq '.chip-dead,.chip-critical{color:var(--danger)' "$work/globals.css"
          grep -Fq 'event-critical' "$work/incidents.tsx"
          grep -Fq 'temporarily shared with the HEI project' "$work/support.tsx"
          grep -Fq 'Support does not buy classification' "$work/support.tsx"

          echo "Production verification passed: entities=${entities}, products=${products}, events=${events}, evidence=${evidence}; machine guidance, responsive safeguards, severity mapping, and Support disclosures verified."

      - name: Configure Cloudflare Pages project
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:config:${{ inputs.mode }}
