name: Configure Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Compare or apply the repository Cloudflare Pages policy
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: wlr-cloudflare-pages-configuration
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Print repository Cloudflare policy
        run: npm run cloudflare:config:print

      - name: Configure Cloudflare Pages project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cloudflare:config:${{ inputs.mode }}
