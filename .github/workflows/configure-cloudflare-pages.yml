name: Configure Cloudflare Pages

on:
  push:
    branches:
      - ops/cloudflare-publication
    paths:
      - .github/workflows/configure-cloudflare-pages.yml

permissions:
  contents: read

concurrency:
  group: wlr-cloudflare-pages-configuration
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare configuration and DNS
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run cloudflare:config:apply

          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          zone_id="147e01c60264c3d27fbfa37dae868062"
          dns="$(curl -fsS "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=CNAME&name=wlr.badjoke-lab.com" -H "$auth")"
          jq -e '.success == true and (.result | length) == 1 and .result[0].content == "cryptocurrency-wallet-lifecycle-registry.pages.dev" and .result[0].proxied == true' <<<"$dns" >/dev/null

          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          project="$(curl -fsS "$base" -H "$auth")"
          domain="$(curl -fsS "${base}/domains/wlr.badjoke-lab.com" -H "$auth")"
          deployments="$(curl -fsS "${base}/deployments?env=production&per_page=5" -H "$auth")"
          jq -e '.success == true and .result.production_branch == "main" and .result.subdomain == "cryptocurrency-wallet-lifecycle-registry.pages.dev" and .result.source.type == "github" and .result.source.config.owner == "badjoke-lab" and .result.source.config.repo_name == "cryptocurrency-wallet-lifecycle-registry"' <<<"$project" >/dev/null
          jq -e '.success == true and .result.status == "active" and .result.validation_data.status == "active" and .result.verification_data.status == "active"' <<<"$domain" >/dev/null
          jq -e '.success == true and .result[0].environment == "production" and .result[0].latest_stage.status == "success" and .result[0].deployment_trigger.type == "github:push" and .result[0].deployment_trigger.metadata.branch == "main" and .result[0].deployment_trigger.metadata.commit_hash == "fbebf0c0f04a9ac517594361897e6bb4605f1bfe" and (.result[0].aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$deployments" >/dev/null
          echo 'Cloudflare project, DNS, active domain, and first production deployment verified.'

      - name: Verify WLR production closeout
        shell: bash
        run: |
          set -euo pipefail
          base="https://wlr.badjoke-lab.com"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          paths=(
            / /hardware /software /incidents /methodology /about /support
            /wallet/trezor /product/trezor-model-one
            /version.json /data/manifest.json
            /data/entities.json /data/products.json /data/events.json /data/evidence.json
            /data/wallet-index.json /data/product-index.json
            /data/wallets/trezor.json /data/products/trezor-model-one.json
            /llms.txt /ai.txt /robots.txt /sitemap.xml
          )
          for path in "${paths[@]}"; do
            code="$(curl -sSL --retry 10 --retry-all-errors --retry-delay 2 -o "$work/http-body" -w '%{http_code}' "${base}${path}")"
            test "$code" = 200 || { echo "${path}: final HTTP ${code}" >&2; exit 10; }
            echo "${path}: final HTTP 200"
          done

          curl -fsSL "$base/version.json" -o "$work/version.json"
          curl -fsSL "$base/data/manifest.json" -o "$work/manifest.json"
          for name in entities products events evidence; do curl -fsSL "$base/data/${name}.json" -o "$work/${name}.json"; done
          curl -fsSL "$base/data/wallet-index.json" -o "$work/wallet-index.json"
          curl -fsSL "$base/data/product-index.json" -o "$work/product-index.json"
          curl -fsSL "$base/data/wallets/trezor.json" -o "$work/wallet-trezor.json"
          curl -fsSL "$base/data/products/trezor-model-one.json" -o "$work/product-trezor-model-one.json"
          curl -fsSL "$base/" -o "$work/home.html"
          curl -fsSL "$base/wallet/trezor" -o "$work/wallet.html"
          curl -fsSL "$base/product/trezor-model-one" -o "$work/product.html"
          curl -fsSL "$base/support" -o "$work/support.html"
          curl -fsSL "$base/llms.txt" -o "$work/llms.txt"
          curl -fsSL "$base/ai.txt" -o "$work/ai.txt"

          jq -e '.project == "WLR" and .version == "0.1.0" and .schema_version == "v3"' "$work/version.json" >/dev/null
          jq -e '.project == "Wallet Lifecycle Registry" and .short_name == "WLR" and .data_safety == "canonical_only"' "$work/manifest.json" >/dev/null
          jq -e '.schema == "wlr.wallet-record.v1" and .entity.slug == "trezor"' "$work/wallet-trezor.json" >/dev/null
          jq -e '.schema == "wlr.product-record.v1" and .entity.slug == "trezor" and .product.slug == "trezor-model-one"' "$work/product-trezor-model-one.json" >/dev/null

          entities="$(jq 'length' "$work/entities.json")"
          products="$(jq 'length' "$work/products.json")"
          events="$(jq 'length' "$work/events.json")"
          evidence="$(jq 'length' "$work/evidence.json")"
          wallets="$(jq 'length' "$work/wallet-index.json")"
          product_records="$(jq 'length' "$work/product-index.json")"
          jq -e --argjson entities "$entities" --argjson products "$products" --argjson events "$events" --argjson evidence "$evidence" --argjson wallets "$wallets" --argjson product_records "$product_records" '.record_counts.entities == $entities and .record_counts.products == $products and .record_counts.events == $events and .record_counts.evidence == $evidence and .record_counts.wallet_records == $wallets and .record_counts.product_records == $product_records' "$work/manifest.json" >/dev/null
          test "$entities" -eq 25
          test "$products" -eq 69
          test "$events" -eq 73
          test "$evidence" -eq 119
          test "$wallets" -eq 25
          test "$product_records" -eq 69

          git fetch origin main --depth=1
          for name in entities products events evidence; do
            git show "origin/main:data/${name}.json" > "$work/main-${name}.json"
            cmp "$work/main-${name}.json" "$work/${name}.json"
          done

          grep -Fq 'Wallet Lifecycle Registry' "$work/home.html"
          grep -Fq 'Trezor' "$work/wallet.html"
          grep -Fq 'Trezor Model One' "$work/product.html"
          grep -Fq 'Support' "$work/support.html"
          grep -Fq 'Deterministic record views' "$work/llms.txt"
          grep -Fq 'not recommendations' "$work/ai.txt"

          git show origin/main:src/app/globals.css > "$work/globals.css"
          git show origin/main:src/app/support/page.tsx > "$work/support.tsx"
          git show origin/main:src/components/incident-explorer.tsx > "$work/incidents.tsx"
          grep -Fq '@media(max-width:720px)' "$work/globals.css"
          grep -Fq 'overflow-x:hidden' "$work/globals.css"
          grep -Fq '.table-wrap{overflow-x:auto}' "$work/globals.css"
          grep -Fq 'word-break:break-all' "$work/globals.css"
          grep -Fq '.chip-active,.chip-low{color:var(--positive)' "$work/globals.css"
          grep -Fq '.chip-limited,.chip-medium{color:var(--warning)' "$work/globals.css"
          grep -Fq '.chip-deprecated,.chip-high{color:var(--high)' "$work/globals.css"
          grep -Fq '.chip-dead,.chip-critical{color:var(--danger)' "$work/globals.css"
          grep -Fq '.event-critical{border-left:3px solid var(--danger)' "$work/globals.css"
          grep -Fq 'event-${row.impactLevel}' "$work/incidents.tsx"
          grep -Fq 'temporarily shared with the HEI project' "$work/support.tsx"
          grep -Fq 'Support does not buy classification' "$work/support.tsx"

          echo "Production closeout passed: entities=${entities}, products=${products}, events=${events}, evidence=${evidence}; machine guidance, responsive safeguards, severity mapping, and Support disclosures verified."
