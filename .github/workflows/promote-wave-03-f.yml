name: Promote Wave 03 F
on:
  push:
    branches: [promotion/coverage-recovery-wave-03-f]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Promote fixed reviewed zero-event records
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          entities=json.loads(Path('data/entities.json').read_text())
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          sources=json.loads(Path('data/evidence.json').read_text())
          em={x['id']:x for x in entities}; pm={x['id']:x for x in products}
          expected_entities={
            'wlr_ent_000100':'Prokey','wlr_ent_000048':'Zerion Wallet','wlr_ent_000072':'Arculus','wlr_ent_000097':'Casa','wlr_ent_000037':'OneKey'
          }
          expected_products={
            'wlr_prod_000149':('wlr_ent_000100','Prokey Optimum'),
            'wlr_prod_000097':('wlr_ent_000048','Zerion Wallet Mobile'),
            'wlr_prod_000121':('wlr_ent_000072','Arculus Cold Storage Wallet'),
            'wlr_prod_000146':('wlr_ent_000097','Casa 3-Key Vault')
          }
          for eid,name in expected_entities.items():
            assert em.get(eid,{}).get('canonical_name')==name,(eid,em.get(eid))
          for pid,(eid,name) in expected_products.items():
            p=pm.get(pid); assert p and p.get('entity_id')==eid and p.get('product_name')==name,(pid,p)
          E=[
            {'id':'wlr_ev_903001','entity_id':'wlr_ent_000100','product_id':'wlr_prod_000149','affected_product_ids':['wlr_prod_000149'],'event_type':'other','event_date':'2023-10-09','event_date_basis':'release','title':'Prokey Optimum firmware v1.10.5 released','description':'The official Prokey Optimum firmware repository published firmware v1.10.5 on 2023-10-09 with support for OKChain Token, providing dated first-party lifecycle evidence for the Prokey Optimum hardware wallet.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903002','entity_id':'wlr_ent_000048','product_id':'wlr_prod_000097','affected_product_ids':['wlr_prod_000097'],'event_type':'other','event_date':'2026-01-08','event_date_basis':'announcement','title':'Zerion Wallet added TRON support','description':'Zerion announced on 2026-01-08 that TRON was live in Zerion Wallet, enabling users to buy TRX and TRC-20 USDT and send or store TRON assets alongside the wallet other supported chains.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903003','entity_id':'wlr_ent_000072','product_id':'wlr_prod_000121','affected_product_ids':['wlr_prod_000121'],'event_type':'other','event_date':'2026-08-23','event_date_basis':'discovery','title':'Arculus documented Wallet 3.12.x as the current release','description':'Arculus official update documentation identified Wallet 3.12.x as the current release by 2026-08-23 and listed 3.12.0 features. The source publication date is used as a conservative discovery date and does not assert that 3.12.0 itself was released on that day.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903004','entity_id':'wlr_ent_000097','product_id':'wlr_prod_000146','affected_product_ids':['wlr_prod_000146'],'event_type':'other','event_date':'2026-06-29','event_date_basis':'announcement','title':'Casa documented address whitelisting for vaults','description':'Casa published first-party documentation on 2026-06-29 describing address whitelisting as an available security feature that restricts outgoing vault transactions to pre-approved addresses and applies across enabled vaults.','confidence':'high','event_status_effect':'active','is_major_event':False},
            {'id':'wlr_ev_903005','entity_id':'wlr_ent_000037','affected_product_ids':[],'event_type':'other','event_date':'2026-08-21','event_date_basis':'release','title':'OneKey Wallet 6.5.2 released','description':'The official OneKey app monorepo published OneKey Wallet 6.5.2 on 2026-08-21 with signed packaged wallet builds across Android and desktop platforms. Current canonical products model OneKey Pro hardware but not the software app, so this lifecycle event is intentionally entity-level and is not attached to OneKey Pro.','confidence':'high','event_status_effect':'active','is_major_event':False}
          ]
          S=[
            {'id':'wlr_src_903001','entity_id':'wlr_ent_000100','product_id':'wlr_prod_000149','event_id':'wlr_ev_903001','source_type':'release_notes','title':'Prokey Firmware v1.10.5','url':'https://github.com/prokey-io/prokey-optimum-firmware/releases/tag/v1.10.5','publisher':'Prokey','published_at':'2023-10-09','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official Prokey Optimum firmware GitHub release.'},
            {'id':'wlr_src_903002','entity_id':'wlr_ent_000048','product_id':'wlr_prod_000097','event_id':'wlr_ev_903002','source_type':'official_blog','title':'Zerion Wallet Integrates TRON to Support the Mass Adoption of Stablecoin Payments','url':'https://zerion.io/blog/zerion-wallet-integrates-tron/','publisher':'Zerion','published_at':'2026-01-08','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Zerion announcement states TRON is live in Zerion Wallet.'},
            {'id':'wlr_src_903003','entity_id':'wlr_ent_000072','product_id':'wlr_prod_000121','event_id':'wlr_ev_903003','source_type':'official_statement','title':'Arculus Wallet New Features','url':'https://support.arculus.co/hc/en-us/articles/38668276529687-Arculus-Wallet-New-Features','publisher':'Arculus','published_at':'2026-08-23','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party support documentation identifies 3.12.x as the current release; publication date is used only as discovery chronology.'},
            {'id':'wlr_src_903004','entity_id':'wlr_ent_000097','product_id':'wlr_prod_000146','event_id':'wlr_ev_903004','source_type':'official_statement','title':'Address Whitelisting in Casa','url':'https://support.casa.io/knowledge/address-whitelisting-in-casa-vaults','publisher':'Casa','published_at':'2026-06-29','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'First-party Casa documentation describes whitelisting as available for vault transactions.'},
            {'id':'wlr_src_903005','entity_id':'wlr_ent_000037','event_id':'wlr_ev_903005','source_type':'release_notes','title':'OneKey Wallet 6.5.2','url':'https://github.com/OneKeyHQ/app-monorepo/releases/tag/v6.5.2','publisher':'OneKey','published_at':'2026-08-21','accessed_at':'2026-08-30','reliability':'high','claim_scope':'event','is_primary':True,'notes':'Official OneKey app monorepo release with packaged Android and desktop wallet builds; intentionally entity-level in WLR.'}
          ]
          def nxt(rows,p): return max([int(x['id'][len(p):]) for x in rows if re.fullmatch(re.escape(p)+r'\d+',x['id'])],default=0)+1
          ne=nxt(events,'wlr_ev_'); ns=nxt(sources,'wlr_src_'); urls={x['url'] for x in sources}; keys={(x.get('entity_id'),x.get('product_id'),x.get('event_type'),x.get('event_date'),x.get('title')) for x in events}
          smap={x['event_id']:x for x in S}; emap={}; pe=[]; ps=[]
          for e in E:
            k=(e.get('entity_id'),e.get('product_id'),e.get('event_type'),e.get('event_date'),e.get('title')); s=smap[e['id']]
            if k in keys or s['url'] in urls: continue
            n=dict(e); nid=f'wlr_ev_{ne:06d}'; ne+=1; n['id']=nid; emap[e['id']]=nid; pe.append(n); keys.add(k)
          for s in S:
            if s['event_id'] not in emap or s['url'] in urls: continue
            n=dict(s); n['id']=f'wlr_src_{ns:06d}'; ns+=1; n['event_id']=emap[s['event_id']]; ps.append(n); urls.add(s['url'])
          events+=pe; sources+=ps
          Path('data/events.json').write_text(json.dumps(events,ensure_ascii=False,indent=2)+'\n'); Path('data/evidence.json').write_text(json.dumps(sources,ensure_ascii=False,indent=2)+'\n')
          print('PROMOTED',len(pe),len(ps),emap)
          PY
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Regenerate and validate
        run: |
          npm run prebuild
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:series
          npm run check:staging-boundary
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Promote current zero-event Wave 03 batch 1'
          git push origin HEAD:promotion/coverage-recovery-wave-03-f
