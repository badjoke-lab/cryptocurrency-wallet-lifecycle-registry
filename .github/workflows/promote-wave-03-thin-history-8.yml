name: Promote Wave 03 Thin History 8
on:
  push:
    branches: [promotion/coverage-recovery-wave-03-thin-history-8]
permissions:
  contents: write
jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --no-audit --no-fund
      - run: node scripts/promote-wave-03-thin-history-8.mjs
      - run: npm run prebuild
      - run: npm run validate:records
      - run: npm run validate:identity-evidence
      - run: npm run validate:machine-records
      - run: npm run validate:series
      - run: npm run check:staging-boundary
      - name: Commit promoted canonical records and generated layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/evidence.json public data-staging
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Promote Wave 03 thin-history batch 8"
          git push
