name: Stage reviewed Safe Bybit compromise

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/safe-bybit-2025-compromise'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/safe-bybit-2025-compromise
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply manually reviewed canonical records
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p,v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const acceptedEvents = [
            {
              id:'wlr_ev_000118', entity_id:'wlr_ent_000005', product_id:'wlr_prod_000023', affected_product_ids:['wlr_prod_000023'],
              event_type:'supply_chain_compromise', event_date:'2025-02-21', event_date_basis:'occurrence',
              title:'Safe{Wallet} Web supply-chain compromise enabled targeted Bybit transaction manipulation',
              description:"A targeted compromise of a Safe{Wallet} developer workstation and Safe{Wallet} web-delivery infrastructure enabled malicious JavaScript to manipulate a Bybit Safe transaction on 2025-02-21. The manipulated transaction resulted in approximately $1.46 billion in assets leaving Bybit's affected Ethereum cold wallet.",
              confidence:'high', impact_level:'critical', security_scope:'supply_chain', funds_affected:'yes', event_status_effect:'limited',
              amount_text:"Approximately $1.46 billion from Bybit's affected Ethereum cold wallet", is_major_event:true, user_actions_required:['monitor'],
              affected_components:['developer_workstation','aws_infrastructure','safe_wallet_web_delivery','web_javascript'],
              notes:'The product boundary is Safe{Wallet} Web. Safe stated that external forensic review did not identify vulnerabilities in Safe smart contracts or in the source code of the frontend/services. Sygnia describes the incident as a supply-chain compromise and traces the attack path from a compromised Safe developer workstation through Safe AWS access to injected JavaScript served from app.safe.global. The malicious code was highly targeted to the Bybit Safe; this record does not generalize the impact to all Safe accounts or Safe Mobile.'
            },
            {
              id:'wlr_ev_000119', entity_id:'wlr_ent_000005', product_id:'wlr_prod_000023', affected_product_ids:['wlr_prod_000023'],
              event_type:'security_fix', event_date:'2025-02-28', event_date_basis:'disclosure',
              title:'Safe{Wallet} rebuilt infrastructure and rotated credentials after targeted compromise',
              description:'Safe reported that the Safe{Wallet} team fully rebuilt and reconfigured infrastructure, rotated all credentials, eliminated the identified attack vector, and restored Safe{Wallet} on Ethereum mainnet with a phased rollout and additional security measures.',
              confidence:'high', impact_level:'critical', security_scope:'supply_chain', funds_affected:'yes', event_status_effect:'active',
              is_major_event:true, user_actions_required:['monitor'],
              affected_components:['developer_credentials','aws_infrastructure','safe_wallet_web_delivery'],
              notes:'This remediation is infrastructure- and credential-based, so WLR does not invent an affected-version or fixed-version range. The 2025-02-28 date is the public disclosure date of the completed rebuild/credential-rotation boundary, not an asserted exact completion timestamp for every remediation action.'
            }
          ];
          for (const row of acceptedEvents) {
            const old = events.find(x => x.id === row.id);
            if (old && JSON.stringify(old) !== JSON.stringify(row)) throw new Error(`${row.id} collision`);
            if (!old) events.push(row);
          }

          const acceptedEvidence = [
            {
              id:'wlr_src_000192', entity_id:'wlr_ent_000005', product_id:'wlr_prod_000023', event_id:null, event_ids:['wlr_ev_000118','wlr_ev_000119'],
              source_type:'official_statement', title:'February 28th, 2025: Statement by the Safe Ecosystem Foundation',
              url:'https://safefoundation.org/blog/safe-ecosystem-foundation-statement', publisher:'Safe Ecosystem Foundation', published_at:'2025-02-28', accessed_at:'2026-08-19',
              reliability:'high', claim_scope:'event', is_primary:true,
              notes:"Official Safe Ecosystem Foundation statement reproducing the Safe{Wallet} team's preliminary findings: compromised Safe{Wallet} developer machine, disguised malicious transaction, no identified Safe smart-contract or frontend/services source-code vulnerability, full infrastructure rebuild/reconfiguration, credential rotation and phased restoration."
            },
            {
              id:'wlr_src_000193', entity_id:'wlr_ent_000005', product_id:'wlr_prod_000023', event_id:'wlr_ev_000118',
              source_type:'security_research', title:'Bybit – What We Know So Far',
              url:'https://www.sygnia.co/blog/sygnia-investigation-bybit-hack/', publisher:'Sygnia', published_at:'2025-03-16', accessed_at:'2026-08-19',
              reliability:'high', claim_scope:'vulnerability', is_primary:true,
              notes:"Investigator-authored account documenting the compromised Safe developer workstation, stolen AWS access, malicious JavaScript injected into Safe{Wallet}'s S3-delivered web resources, the targeted Bybit activation condition and the conclusion that the incident traced back to a supply-chain compromise."
            },
            {
              id:'wlr_src_000194', entity_id:'wlr_ent_000005', product_id:'wlr_prod_000023', event_id:'wlr_ev_000118',
              source_type:'official_blog', title:'Bybit Security Incident: Timeline of Events and FAQs',
              url:'https://www.bybit.com/en/learn/this-week-in-bybit/bybit-security-incident-timeline', publisher:'Bybit', published_at:'2025-03-03', accessed_at:'2026-08-19',
              reliability:'high', claim_scope:'funds_affected', is_primary:true,
              notes:"First-party victim timeline establishing the 2025-02-21 incident, approximately $1.46B asset loss from the affected Ethereum cold wallet, Safe's temporary Wallet pause, and the later forensic finding of malicious JavaScript on the Safe{Wallet} platform."
            }
          ];
          for (const row of acceptedEvidence) {
            const old = evidence.find(x => x.id === row.id);
            if (old && JSON.stringify(old) !== JSON.stringify(row)) throw new Error(`${row.id} collision`);
            if (!old) evidence.push(row);
          }

          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify reviewed canonical boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_ev_000118") | .entity_id == "wlr_ent_000005" and .product_id == "wlr_prod_000023" and .event_type == "supply_chain_compromise" and .event_date == "2025-02-21" and .impact_level == "critical" and .security_scope == "supply_chain" and .funds_affected == "yes" and .event_status_effect == "limited" and (((.affected_versions // [])|length)==0) and (((.affected_version_rules // [])|length)==0)' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000119") | .entity_id == "wlr_ent_000005" and .product_id == "wlr_prod_000023" and .event_type == "security_fix" and .event_date == "2025-02-28" and .security_scope == "supply_chain" and .funds_affected == "yes" and .event_status_effect == "active" and (((.fixed_versions // [])|length)==0)' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000192") | (.event_ids | sort) == (["wlr_ev_000118","wlr_ev_000119"] | sort) and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000193") | .event_id == "wlr_ev_000118" and .source_type == "security_research" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000194") | .event_id == "wlr_ev_000118" and .claim_scope == "funds_affected" and .reliability == "high" and .is_primary == true' data/evidence.json >/dev/null
          node scripts/build-stats.mjs
          jq -e '.registry.entities == 26 and .registry.products == 74 and .registry.events == 119 and .registry.evidence == 194 and .registry.incident_events == 22 and .registry.remediation_events == 8' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_impact_level.count == 22 and .data_quality.events.incident_impact_level.denominator == 22 and .data_quality.events.incident_impact_level.percentage == 100' public/data/stats.json >/dev/null
          jq -e '.data_quality.events.incident_funds_affected.count == 22 and .data_quality.events.incident_funds_affected.denominator == 22 and .data_quality.events.incident_funds_affected.percentage == 100' public/data/stats.json >/dev/null
      - name: Commit explicit canonical edit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed Safe Bybit compromise history'
          git push origin HEAD:review/safe-bybit-2025-compromise
