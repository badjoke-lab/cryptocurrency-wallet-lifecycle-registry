name: Snapshot Wave 03 Current Gaps
on:
  push:
    branches: [research/coverage-recovery-wave-03-current-gaps]
permissions:
  contents: write
jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute current canonical gap snapshot
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          entities=json.loads(Path('data/entities.json').read_text())
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          by_entity=Counter(e['entity_id'] for e in events)
          products_by={}
          for p in products:
            products_by.setdefault(p['entity_id'],[]).append({
              'product_id':p['id'],
              'product_name':p.get('product_name'),
              'status':p.get('status'),
              'launch_date':p.get('launch_date'),
              'support_status':p.get('support_status')
            })
          rows=[]
          for e in entities:
            c=by_entity[e['id']]
            if c<=1:
              rows.append({
                'entity_id':e['id'],
                'canonical_name':e.get('canonical_name'),
                'slug':e.get('slug'),
                'status':e.get('status'),
                'event_count':c,
                'products':products_by.get(e['id'],[])
              })
          rows.sort(key=lambda x:(x['event_count'],x['canonical_name'] or ''))
          out={
            'generated_from':'8a2da43eff09103867267ffeb36f68b74279d6a7',
            'zero_event_count':sum(1 for r in rows if r['event_count']==0),
            'one_event_count':sum(1 for r in rows if r['event_count']==1),
            'targets':rows
          }
          p=Path('data-staging/coverage/coverage-recovery-wave-03-current-gaps.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print('ZERO',out['zero_event_count'],'ONE',out['one_event_count'])
          print('ZERO_NAMES',[r['canonical_name'] for r in rows if r['event_count']==0])
          PY
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data-staging/coverage/coverage-recovery-wave-03-current-gaps.json
          git commit -m 'Add current Wave 03 coverage gap snapshot'
          git push origin HEAD:research/coverage-recovery-wave-03-current-gaps
