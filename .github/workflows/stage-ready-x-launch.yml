name: Stage reviewed Ready X launch history

on:
  push:
    branches: [data/ready-x-launch-history]

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/ready-x-launch-history
          fetch-depth: 0

      - name: Add Ready X launch date, event, and evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          products_path=Path('data/products.json')
          events_path=Path('data/events.json')
          evidence_path=Path('data/evidence.json')
          products=json.loads(products_path.read_text())
          events=json.loads(events_path.read_text())
          evidence=json.loads(evidence_path.read_text())

          assert len(products)==69 and len(events)==87 and len(evidence)==143
          p=next(x for x in products if x['id']=='wlr_prod_000039')
          assert p['entity_id']=='wlr_ent_000011' and p['slug']=='ready-x'
          assert p['product_name']=='Ready X' and 'Argent X' in p.get('aliases',[])
          assert p.get('launch_date') is None and p.get('launch_date_precision') in (None,'approximate')
          assert not any(e.get('product_id')=='wlr_prod_000039' and e.get('event_type')=='product_released' for e in events)
          assert 'wlr_ev_000088' not in {e['id'] for e in events}
          assert 'wlr_src_000144' not in {s['id'] for s in evidence}

          lines=products_path.read_text().splitlines()
          idx=[i for i,line in enumerate(lines) if '"id":"wlr_prod_000039"' in line]
          assert len(idx)==1
          i=idx[0]
          old='"launch_date":null,"launch_date_precision":"approximate"'
          new='"launch_date":"2021-12-08","launch_date_precision":"day"'
          assert old in lines[i]
          lines[i]=lines[i].replace(old,new,1)
          products_path.write_text('\n'.join(lines)+'\n')

          def append_rows(path, rows):
              text=path.read_text(); stripped=text.rstrip(); assert stripped.endswith(']')
              body=stripped[:-1].rstrip()
              addition=',\n'+',\n'.join(json.dumps(row,ensure_ascii=False,separators=(',',':')) for row in rows)+'\n]'
              path.write_text(body+addition+'\n')

          event={
            'id':'wlr_ev_000088',
            'entity_id':'wlr_ent_000011',
            'product_id':'wlr_prod_000039',
            'affected_product_ids':['wlr_prod_000039'],
            'event_type':'product_released',
            'event_date':'2021-12-08',
            'event_date_basis':'release',
            'title':'Argent X launched on the Chrome Store for StarkNet',
            'description':'Argent launched Argent X on 2021-12-08 as a Chrome browser-extension wallet for StarkNet. The launch article explicitly distinguished Argent X from Argent’s separate mobile wallet. This product lineage later continued under the Ready X name.',
            'confidence':'high',
            'event_status_effect':'active',
            'is_major_event':True,
            'notes':'This event is scoped only to the current Ready X / historical Argent X product lineage. Chrome Store availability is the launch-time distribution fact established by the source; later Ready X platforms are not backdated to launch day.'
          }
          source={
            'id':'wlr_src_000144',
            'entity_id':'wlr_ent_000011',
            'product_ids':['wlr_prod_000039'],
            'event_ids':['wlr_ev_000088'],
            'product_id':'wlr_prod_000039',
            'event_id':'wlr_ev_000088',
            'source_type':'official_blog',
            'title':'Argent X StarkNet launch',
            'url':'https://www.argent.xyz/blog/argent-x-starknet',
            'publisher':'Argent',
            'published_at':'2021-12-08',
            'accessed_at':'2026-08-17',
            'reliability':'high',
            'claim_scope':'launch_date',
            'is_primary':True,
            'notes':'First-party Argent launch article stating that Argent X was available from the Chrome Store on 2021-12-08 and explicitly distinguishing it from Argent’s mobile wallet.'
          }
          append_rows(events_path,[event])
          append_rows(evidence_path,[source])
          PY

      - name: Validate canonical records and identity/evidence policy
        run: |
          set -euo pipefail
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py

      - name: Assert targeted Ready X batch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          products=json.loads(Path('data/products.json').read_text())
          events=json.loads(Path('data/events.json').read_text())
          evidence=json.loads(Path('data/evidence.json').read_text())
          p=next(x for x in products if x['id']=='wlr_prod_000039')
          assert p['launch_date']=='2021-12-08' and p['launch_date_precision']=='day'
          assert p['product_name']=='Ready X' and 'Argent X' in p['aliases']
          ready_mobile=next(x for x in products if x['id']=='wlr_prod_000038')
          assert ready_mobile.get('launch_date') is None
          e=next(x for x in events if x['id']=='wlr_ev_000088')
          assert e['entity_id']=='wlr_ent_000011' and e['product_id']=='wlr_prod_000039'
          assert e['event_type']=='product_released' and e['event_date']=='2021-12-08' and e['event_date_basis']=='release'
          s=next(x for x in evidence if x['id']=='wlr_src_000144')
          assert s['product_id']=='wlr_prod_000039' and s['event_id']=='wlr_ev_000088'
          assert s['source_type']=='official_blog' and s['claim_scope']=='launch_date' and s['reliability']=='high' and s['is_primary'] is True
          assert s['published_at']=='2021-12-08'
          assert len(products)==69 and len(events)==88 and len(evidence)==144
          print('READY_X_LAUNCH_STAGE_OK products=69 events=88 evidence=144 launch_coverage_expected=52/69 incidents=18 remediation=7')
          PY

      - name: Commit staged canonical changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/products.json data/events.json data/evidence.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add reviewed Ready X launch history'
          git push origin HEAD:data/ready-x-launch-history
