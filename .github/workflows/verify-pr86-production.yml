name: Verify WLR PR86 Production

on:
  push:
    branches: [qa/pr86-production-verify]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve exact deployment and verify Leather public state
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          expected="1d425240b8841ac1f088aca4b0a80daff087ee49"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/cryptocurrency-wallet-lifecycle-registry"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          match=""
          for attempt in $(seq 1 60); do
            deployments="$(curl -fsS "${base}/deployments?env=production&per_page=20" -H "$auth")"
            match="$(jq -c --arg sha "$expected" '[.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)] | first // empty' <<<"$deployments")"
            if [ -n "$match" ] && jq -e '.latest_stage.status == "success"' <<<"$match" >/dev/null; then break; fi
            echo "Waiting exact deployment attempt=${attempt}"
            sleep 10
          done
          test -n "$match"
          jq -e '.latest_stage.status == "success" and .deployment_trigger.metadata.branch == "main" and (.aliases | index("https://wlr.badjoke-lab.com")) != null' <<<"$match" >/dev/null
          deployment_url="$(jq -r '.url' <<<"$match")"
          echo "$match" | jq '{id,short_id,url,aliases,latest_stage,deployment_trigger}'

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL "${deployment_url}/data/stats.json?verify=1d425240" -o "$work/deploy-stats.json"
          python3 - "$work/deploy-stats.json" <<'PY'
          import json, pathlib, sys
          stats=json.loads(pathlib.Path(sys.argv[1]).read_text())
          r=stats['registry']
          assert (r['entities'],r['products'],r['events'],r['evidence'],r['incident_events'],r['remediation_events'])==(25,69,87,143,18,7)
          assert stats['products']['launch_date']['count']==51 and stats['products']['launch_date']['denominator']==69
          assert stats['data_quality']['products']['support_status_known']['count']==68 and stats['data_quality']['products']['support_status_known']['denominator']==69
          print('LEATHER_DEPLOYMENT_TOTALS_OK')
          PY

          ready=0
          for attempt in $(seq 1 60); do
            nonce="1d425240-${attempt}-$(date +%s)"
            for name in products events evidence stats; do
              curl -fsSL --retry 3 --retry-all-errors --retry-delay 1 "https://wlr.badjoke-lab.com/data/${name}.json?verify=${nonce}" -o "$work/${name}.json"
            done
            if python3 - "$work" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          products=json.loads((root/'products.json').read_text())
          events=json.loads((root/'events.json').read_text())
          evidence=json.loads((root/'evidence.json').read_text())
          stats=json.loads((root/'stats.json').read_text())
          r=stats['registry']
          ok=(r['events'],r['evidence'],r['incident_events'],r['remediation_events'])==(87,143,18,7)
          p=next((p for p in products if p['id']=='wlr_prod_000066'),None)
          ok=ok and p is not None and p.get('launch_date')=='2021-08-10' and p.get('launch_date_precision')=='day'
          ok=ok and any(e['id']=='wlr_ev_000087' for e in events)
          ok=ok and any(s['id']=='wlr_src_000143' for s in evidence)
          raise SystemExit(0 if ok else 1)
          PY
            then ready=1; echo "custom files ready attempt=${attempt}"; break; fi
            echo "Waiting custom files attempt=${attempt}"
            sleep 10
          done
          test "$ready" -eq 1

          python3 - "$work" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          products=json.loads((root/'products.json').read_text())
          events=json.loads((root/'events.json').read_text())
          evidence=json.loads((root/'evidence.json').read_text())
          stats=json.loads((root/'stats.json').read_text())
          p=next(p for p in products if p['id']=='wlr_prod_000066')
          assert p['product_name']=='Leather Browser Extension'
          assert 'Hiro Wallet Extension' in p['aliases']
          assert p['launch_date']=='2021-08-10' and p['launch_date_precision']=='day'
          assert 'General browser-store availability is anchored to 2021-08-10' in p['notes']
          e=next(e for e in events if e['id']=='wlr_ev_000087')
          assert e['entity_id']=='wlr_ent_000024' and e['product_id']=='wlr_prod_000066'
          assert e['event_type']=='product_released' and e['event_date']=='2021-08-10' and e['event_date_basis']=='release'
          s=next(s for s in evidence if s['id']=='wlr_src_000143')
          assert s['product_id']=='wlr_prod_000066' and s['event_id']=='wlr_ev_000087'
          assert s['source_type']=='official_statement' and s['claim_scope']=='launch_date' and s['reliability']=='high' and s['is_primary'] is True
          assert s['url']=='https://www.hiro.so/press-release/hiro-wallet-available-in-chrome-and-firefox-stores'
          assert stats['products']['launch_date']['count']==51
          print('LEATHER_PUBLIC_DATA_OK events=87 evidence=143 launch=51/69 incidents=18 remediation=7')
          PY

          nonce="$(date +%s)"
          curl -fsSL -o /dev/null "https://wlr.badjoke-lab.com/wallet/leather/?verify=${nonce}"
          curl -fsSL -o /dev/null "https://wlr.badjoke-lab.com/product/leather-browser-extension/?verify=${nonce}"
          echo 'PR86_PRODUCTION_VERIFY_OK'
