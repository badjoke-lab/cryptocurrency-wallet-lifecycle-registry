name: Stage reviewed post-100 depth batch 03

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/post-100-depth-batch-03'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/post-100-depth-batch-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund
      - name: Apply manually reviewed fixed history records
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v)+'\n');
          const events=read('data/events.json');
          const evidence=read('data/evidence.json');
          if(events.length!==131||evidence.length!==357) throw new Error(`unexpected base events=${events.length} evidence=${evidence.length}`);
          const E=[
            {"id":"wlr_ev_000132","entity_id":"wlr_ent_000053","product_id":"wlr_prod_000102","affected_product_ids":["wlr_prod_000102"],"event_type":"rebranded","event_date":"2024-12","event_date_basis":"approximate","title":"Binance Web3 Wallet rebranded as Binance Wallet","description":"Binance's self-custodial wallet, originally launched as Binance Web3 Wallet, was rebranded as Binance Wallet in December 2024 with a refreshed interface and additional features.","confidence":"high","event_status_effect":"none","is_major_event":true,"notes":"Current first-party Binance Academy material supports December 2024 but not a defensible day-level rebrand date in this review. WLR therefore preserves month precision and uses an approximate date basis. This is continuity, not a new wallet or product launch."},
            {"id":"wlr_ev_000133","entity_id":"wlr_ent_000051","product_id":"wlr_prod_000100","affected_product_ids":["wlr_prod_000100"],"event_type":"product_released","event_date":"2021-11-16","event_date_basis":"release","title":"Browser-native Brave Wallet launched","description":"Brave launched a browser-native self-custody wallet built directly into the Brave desktop browser, replacing extension dependence for Brave's primary built-in wallet path while allowing users to import from the legacy Crypto Wallets extension.","confidence":"high","event_status_effect":"active","is_major_event":true,"notes":"This is retained as material product-history depth because Brave explicitly introduced a new browser-native wallet boundary with no extension required and documented migration/import from its legacy Crypto Wallets extension. It is not a generic launch added solely to reduce the zero-event count. Mobile availability was still future-facing in this launch announcement and is not included in the affected product scope."}
          ];
          const S=[
            {"id":"wlr_src_000358","entity_id":"wlr_ent_000053","product_id":"wlr_prod_000102","event_id":"wlr_ev_000132","source_type":"official_statement","title":"What Is the Binance Wallet and How to Use It?","url":"https://academy.binance.com/ur-PK/articles/what-is-binance-web3-wallet-and-how-does-it-work","publisher":"Binance Academy","published_at":null,"accessed_at":"2026-08-20","reliability":"high","claim_scope":"rebrand","is_primary":true,"notes":"Current official Binance Academy material states that Binance Wallet was originally launched as Binance Web3 Wallet and was rebranded in December 2024. The source is retrospective, so WLR does not infer an exact day or treat the article's current update date as the event date."},
            {"id":"wlr_src_000359","entity_id":"wlr_ent_000051","product_id":"wlr_prod_000100","event_id":"wlr_ev_000133","source_type":"official_blog","title":"Introducing the Brave Wallet, a Browser-Native Crypto Wallet With No Extension Required","url":"https://brave.com/blog/brave-wallet-launch/","publisher":"Brave","published_at":"2021-11-16","accessed_at":"2026-08-20","reliability":"high","claim_scope":"product","is_primary":true,"notes":"First-party Brave launch post states that Brave Wallet launched on 2021-11-16 as a browser-native desktop wallet requiring no extension and documents import from Brave's legacy Crypto Wallets extension."}
          ];
          const add=(arr,row)=>{const old=arr.find(x=>x.id===row.id);if(old&&JSON.stringify(old)!==JSON.stringify(row))throw new Error(`collision ${row.id}`);if(!old)arr.push(row)};
          E.forEach(x=>add(events,x)); S.forEach(x=>add(evidence,x));
          if(events.length!==133||evidence.length!==359) throw new Error(`unexpected promoted counts events=${events.length} evidence=${evidence.length}`);
          write('data/events.json',events);write('data/evidence.json',evidence);
          NODE
      - name: Validate canonical and regenerate Series adapter
        run: |
          set -euo pipefail
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:structured-discovery
          npm run validate:stats
          npm run coverage:audit
          npm run seed:gate
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          npm run build
          jq -e '.registry.entities == 100 and .registry.products == 149 and .registry.events == 133 and .registry.evidence == 359 and .registry.incident_events == 25 and .registry.remediation_events == 9 and .registry.eol_events == 7' public/data/stats.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000132") | .event_type == "rebranded" and .event_date == "2024-12" and .event_date_basis == "approximate"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000133") | .event_type == "product_released" and .event_date == "2021-11-16" and .event_date_basis == "release" and .product_id == "wlr_prod_000100"' data/events.json >/dev/null
          jq -e '.record_counts.primary_records == 100 and .record_counts.native.events == 133 and .record_counts.native.evidence == 359' public/data/series/registry.json >/dev/null
          jq -e '.record_count == 249 and .record_counts.wallets == 100 and .record_counts.products == 149' public/data/series/index.json >/dev/null
      - name: Commit explicit canonical and deterministic Series edits
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.json data/evidence.json public/data/series
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed post-100 depth batch 03'
          git push origin HEAD:review/post-100-depth-batch-03
