name: Stage reviewed BlueWallet Desktop launch date

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/bluewallet-desktop-launch-date'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/bluewallet-desktop-launch-date
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical correction
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v) + '\n');
          const products = read('data/products.json');
          const events = read('data/events.json');
          const evidence = read('data/evidence.json');

          const product = products.find(x => x.id === 'wlr_prod_000064');
          if (!product || product.entity_id !== 'wlr_ent_000023' || product.slug !== 'bluewallet-desktop') throw new Error('Unexpected BlueWallet Desktop identity');
          if (product.launch_date !== null && product.launch_date !== '2020-08-28') throw new Error(`Unexpected launch date ${product.launch_date}`);
          product.launch_date = '2020-08-28';
          product.launch_date_precision = 'day';
          product.last_verified_at = '2026-08-18';
          product.notes = "BlueWallet's first-party 2020-08-28 article announces that BlueWallet for Desktop was out on the Mac Store and explicitly calls it the team's first desktop product. WLR therefore records the public desktop launch at day precision on 2020-08-28. The reviewed launch source establishes macOS availability only; earlier implementation work is not used to backdate the public launch.";

          const ev = {
            id:'wlr_ev_000111', entity_id:'wlr_ent_000023', product_id:'wlr_prod_000064', affected_product_ids:['wlr_prod_000064'],
            event_type:'product_released', event_date:'2020-08-28', event_date_basis:'release',
            title:'BlueWallet Desktop released for macOS',
            description:"BlueWallet announced that its first desktop product was out on the Mac Store on 2020-08-28.",
            confidence:'high', event_status_effect:'active', is_major_event:true,
            notes:'The first-party article directly states current Mac Store availability and identifies this as BlueWallet’s first desktop product, supporting day precision. No earlier source-code preparation is used to backdate launch.'
          };
          const oldEv = events.find(x => x.id === ev.id);
          if (oldEv && JSON.stringify(oldEv) !== JSON.stringify(ev)) throw new Error('wlr_ev_000111 collision');
          if (!oldEv) events.push(ev);

          const src = {
            id:'wlr_src_000175', entity_id:'wlr_ent_000023', product_id:'wlr_prod_000064', event_id:'wlr_ev_000111',
            source_type:'official_blog', title:'Bitcoin Wallet for Desktop - v5.5.6',
            url:'https://bluewallet.io/Bitcoin-Wallet-for-Desktop-v5-5-6-4f2172406155/', publisher:'BlueWallet', published_at:'2020-08-28', accessed_at:'2026-08-18', reliability:'high', claim_scope:'launch_date', is_primary:true,
            notes:'First-party BlueWallet release article stating that BlueWallet for Desktop was out on the Mac Store and was the team’s first desktop product. Supports the 2020-08-28 public launch date for the macOS desktop product.'
          };
          const oldSrc = evidence.find(x => x.id === src.id);
          if (oldSrc && JSON.stringify(oldSrc) !== JSON.stringify(src)) throw new Error('wlr_src_000175 collision');
          if (!oldSrc) evidence.push(src);

          write('data/products.json', products);
          write('data/events.json', events);
          write('data/evidence.json', evidence);
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_prod_000064") | .launch_date == "2020-08-28" and .launch_date_precision == "day" and .last_verified_at == "2026-08-18"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000111") | .entity_id == "wlr_ent_000023" and .product_id == "wlr_prod_000064" and .event_type == "product_released" and .event_date == "2020-08-28" and .event_date_basis == "release"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_src_000175") | .event_id == "wlr_ev_000111" and .source_type == "official_blog" and .reliability == "high" and .is_primary == true and .claim_scope == "launch_date"' data/evidence.json >/dev/null
      - name: Commit canonical files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/events.json data/evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add reviewed BlueWallet Desktop launch date'
          git push origin HEAD:review/bluewallet-desktop-launch-date
