name: Stage SafePal Extension Wallet launch history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/stage-safepal-extension-launch.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed SafePal Extension launch records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/products.json')
          text = p.read_text(encoding='utf-8')
          old = '"id":"wlr_prod_000074","entity_id":"wlr_ent_000026","slug":"safepal-extension-wallet","product_name":"SafePal Extension Wallet","aliases":[],"product_type":"browser_extension","status":"active","sales_status":"not_applicable","support_status":"supported","launch_date":null,'
          new = '"id":"wlr_prod_000074","entity_id":"wlr_ent_000026","slug":"safepal-extension-wallet","product_name":"SafePal Extension Wallet","aliases":[],"product_type":"browser_extension","status":"active","sales_status":"not_applicable","support_status":"supported","launch_date":"2022-08-19","launch_date_precision":"day",'
          if text.count(old) != 1:
              raise SystemExit('SafePal Extension product precondition failed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def append(path, obj):
              q = Path(path)
              t = q.read_text(encoding='utf-8')
              end = t.rfind(']')
              before = t[:end].rstrip()
              q.write_text(before + ',\n' + json.dumps(obj, ensure_ascii=False, separators=(',', ':')) + '\n]\n', encoding='utf-8')

          events = json.loads(Path('data/events.json').read_text())
          evidence = json.loads(Path('data/evidence.json').read_text())
          if any(x.get('id') == 'wlr_ev_000092' for x in events): raise SystemExit('event id already used')
          if any(x.get('id') == 'wlr_src_000150' for x in evidence): raise SystemExit('source id already used')

          append('data/events.json', {
            'id':'wlr_ev_000092','entity_id':'wlr_ent_000026','product_id':'wlr_prod_000074','affected_product_ids':['wlr_prod_000074'],
            'event_type':'product_released','event_date':'2022-08-19','event_date_basis':'release',
            'title':'SafePal Extension Wallet officially launched','description':'SafePal announced the official launch of its browser extension wallet on August 19, 2022.',
            'confidence':'high','event_status_effect':'active','is_major_event':True,
            'notes':'The historical launch announcement listed Chrome, Firefox and Microsoft Edge. Current supported-browser status is governed separately by current distribution evidence and is not inferred from this 2022 event.'
          })
          append('data/evidence.json', {
            'id':'wlr_src_000150','entity_id':'wlr_ent_000026','product_ids':['wlr_prod_000074'],'event_ids':['wlr_ev_000092'],
            'product_id':'wlr_prod_000074','event_id':'wlr_ev_000092','source_type':'official_blog','title':'The SafePal difference, now available on Chrome: Introducing SafePal Browser Extension Wallet',
            'url':'https://www.safepal.com/en/blog/safepal-extension-wallet/','publisher':'SafePal','published_at':'2022-08-19','accessed_at':'2026-08-17',
            'reliability':'high','claim_scope':'launch_date','is_primary':True,
            'notes':'First-party SafePal announcement explicitly identifies August 19, 2022 as the official launch of the SafePal browser extension wallet.'
          })
          PY
      - name: Validate
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/validate_records.py
          python3 scripts/validate_identity_evidence_policy.py
          python3 scripts/report_coverage.py --fail-on-structural
      - name: Push reviewed branch
        run: |
          set -euo pipefail
          branch='data/safepal-extension-launch-history'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          rm .github/workflows/stage-safepal-extension-launch.yml
          git add data/products.json data/events.json data/evidence.json .github/workflows/stage-safepal-extension-launch.yml
          git commit -m 'Add reviewed SafePal Extension Wallet launch history'
          git push origin "$branch"
