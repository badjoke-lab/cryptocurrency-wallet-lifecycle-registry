name: Stage final entity launch-date coverage

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/final-entity-launch-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/final-entity-launch-coverage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed canonical corrections
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const entities = JSON.parse(fs.readFileSync('data/entities.json', 'utf8'));
          const updates = new Map([
            ['wlr_ent_000011', {
              slug: 'ready', date: '2018',
              notes: "Ready preserves the continuous Argent wallet lineage. First-party Argent/Ready history establishes that Argent launched on Ethereum in 2018, and Ready's later rebrand history preserves continuity into the current Ready products. WLR therefore records the entity launch at 2018 year precision without inventing an exact first launch day."
            }],
            ['wlr_ent_000019', {
              slug: 'rainbow', date: '2019',
              notes: "Official Rainbow repository history records an external beta release and a production release during 2019 under the earlier Balance/Rainbow mobile lineage. WLR therefore records the Rainbow entity launch at 2019 year precision without asserting one exact initial App Store publication day."
            }],
            ['wlr_ent_000020', {
              slug: 'xverse', date: '2021',
              notes: "Contemporaneous 2021 evidence establishes the Xverse mobile-wallet lineage: a commissioned security audit identifies Secret Key Labs' Xverse Wallet mobile application and App Store distribution evidence confirms public availability during 2021. WLR therefore records the entity launch at 2021 year precision without asserting one exact original store-release day."
            }]
          ]);
          for (const [id, u] of updates) {
            const row = entities.find(x => x.id === id);
            if (!row || row.slug !== u.slug) throw new Error(`Unexpected entity identity ${id}`);
            if (row.launch_date !== null && row.launch_date !== u.date) throw new Error(`Unexpected launch date ${id} ${row.launch_date}`);
            row.launch_date = u.date;
            row.launch_date_precision = 'year';
            row.last_verified_at = '2026-08-18';
            row.notes = u.notes;
          }
          fs.writeFileSync('data/entities.json', JSON.stringify(entities) + '\n');
          NODE
      - name: Verify staged boundary
        run: |
          set -euo pipefail
          jq -e '.[] | select(.id == "wlr_ent_000011") | .launch_date == "2018" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/entities.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ent_000019") | .launch_date == "2019" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/entities.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ent_000020") | .launch_date == "2021" and .launch_date_precision == "year" and .last_verified_at == "2026-08-18"' data/entities.json >/dev/null
          node scripts/build-stats.mjs
          jq -e '.registry.entities == 26 and .registry.products == 74 and .registry.events == 115 and .registry.evidence == 185' public/data/stats.json >/dev/null
          jq -e '.entities.launch_date.count == 26 and .entities.launch_date.denominator == 26 and .entities.launch_date.percentage == 100' public/data/stats.json >/dev/null
          jq -e '.products.launch_date.count == 74 and .products.launch_date.denominator == 74 and .products.launch_date.percentage == 100' public/data/stats.json >/dev/null
          jq -e '.data_quality.products.support_status_known.count == 74 and .data_quality.products.support_status_known.denominator == 74 and .data_quality.products.support_status_known.percentage == 100' public/data/stats.json >/dev/null
      - name: Commit canonical file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entities.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Resolve final entity launch-date gaps'
          git push origin HEAD:review/final-entity-launch-coverage
