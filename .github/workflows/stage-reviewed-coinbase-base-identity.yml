name: Stage reviewed Coinbase Wallet to Base App identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  stage:
    if: github.head_ref == 'review/coinbase-base-identity-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/coinbase-base-identity-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund
      - name: Apply reviewed identity and lifecycle records
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v)+'\n');
          const entities=read('data/entities.json');
          const products=read('data/products.json');
          const events=read('data/events.json');
          const evidence=read('data/evidence.json');
          if(entities.length!==100||products.length!==149||events.length!==138||evidence.length!==363) throw new Error(`unexpected base counts ${entities.length}/${products.length}/${events.length}/${evidence.length}`);
          const entity=entities.find(x=>x.id==='wlr_ent_000076');
          const product=products.find(x=>x.id==='wlr_prod_000125');
          if(!entity||entity.slug!=='coinbase-wallet'||entity.canonical_name!=='Coinbase Wallet'||entity.status!=='active') throw new Error('unexpected Coinbase Wallet entity base');
          if(!product||product.slug!=='coinbase-wallet-mobile'||product.product_name!=='Coinbase Wallet Mobile'||product.status!=='active') throw new Error('unexpected Coinbase Wallet Mobile product base');
          entity.canonical_name='Base App';
          entity.aliases=[...new Set([...(entity.aliases||[]),'Coinbase Wallet'])];
          entity.summary='Self-custody wallet lineage from Coinbase now branded Base App, continuing the former Coinbase Wallet mobile experience while preserving user-controlled wallet credentials and supported-network assets.';
          entity.official_url='https://www.coinbase.com/wallet';
          entity.last_verified_at='2026-08-20';
          entity.notes='Base App is the continuing Coinbase Wallet lineage, not a separate successor entity. Base announced the rebrand in July 2025, and Coinbase closed the classic wallet experience on 2026-08-15 while preserving recovery phrases, supported-network assets and addresses. WLR intentionally retains the historical slug coinbase-wallet so existing human, native-machine, Series and global-record URLs remain stable. Coinbase continues to distribute a separately branded Coinbase Wallet browser extension; that extension is not silently collapsed into the existing mobile-product record.';
          product.product_name='Base App Mobile';
          product.aliases=[...new Set([...(product.aliases||[]),'Coinbase Wallet Mobile'])];
          product.summary='Self-custody iOS and Android mobile wallet formerly branded Coinbase Wallet Mobile and now distributed as Base App, with continuity of the installed wallet and user-controlled credentials.';
          product.official_url='https://www.coinbase.com/wallet/downloads';
          product.last_verified_at='2026-08-20';
          product.notes='Existing Coinbase Wallet mobile users continue in Base App without downloading a separate successor app. Coinbase states that the classic experience closed on 2026-08-15 but the recovery phrase, supported-network assets and addresses remain continuous. WLR intentionally retains the historical product slug coinbase-wallet-mobile for stable public and machine URLs.';
          const E=[
            {"id":"wlr_ev_000139","entity_id":"wlr_ent_000076","product_id":"wlr_prod_000125","affected_product_ids":["wlr_prod_000125"],"event_type":"rebranded","event_date":"2025-07-16","event_date_basis":"announcement","title":"Coinbase Wallet announced transition to Base App","description":"At Base's A New Day One event, Base announced that Coinbase Wallet was becoming the Base App, describing Base App as the next evolution of Coinbase Wallet and beginning a beta rollout for the renamed and expanded application.","confidence":"high","event_status_effect":"rebranded","is_major_event":true,"notes":"This is a continuity/rebrand event, not the launch of a separate successor wallet. Base first-party material says Base App is formerly Coinbase Wallet and that Coinbase Wallet is now Base App. The exact 2025-07-16 announcement boundary is corroborated by contemporaneous dated reporting from the event. Existing WLR IDs and slugs remain stable."},
            {"id":"wlr_ev_000140","entity_id":"wlr_ent_000076","product_id":"wlr_prod_000125","affected_product_ids":["wlr_prod_000125"],"event_type":"service_shutdown","event_date":"2026-08-15","event_date_basis":"effective","title":"Classic Coinbase Wallet experience closed","description":"Coinbase closed the classic Coinbase Wallet experience on August 15, 2026 and replaced it with the updated Base App experience while preserving the user's recovery phrase, supported-network assets and wallet addresses.","confidence":"high","event_status_effect":"active","is_major_event":true,"notes":"This is a shutdown of the legacy/classic experience, not a shutdown of the continuing wallet product. Coinbase says there is nothing to transfer or sign merely to continue in the updated wallet. Some legacy networks are not supported in Base App and may require importing the same recovery phrase into another compatible wallet."}
          ];
          const S=[
            {"id":"wlr_src_000364","entity_id":"wlr_ent_000076","product_id":"wlr_prod_000125","event_id":"wlr_ev_000139","source_type":"official_blog","title":"Base's Next Chapter: Everything We Announced At A New Day One","url":"https://blog.base.org/a-new-day-one","publisher":"Base","published_at":null,"accessed_at":"2026-08-20","reliability":"high","claim_scope":"rebrand","is_primary":true,"notes":"First-party Base announcement explicitly calls Base App formerly Coinbase Wallet, describes it as the next evolution of Coinbase Wallet, and says Coinbase Wallet is now Base App. Exact event-day corroboration is stored separately rather than inventing missing page publication metadata."},
            {"id":"wlr_src_000365","entity_id":"wlr_ent_000076","product_id":"wlr_prod_000125","event_id":"wlr_ev_000139","source_type":"news_article","title":"Coinbase unveils Base App, rebrands wallet as all-in-one social and trading platform","url":"https://www.theblock.co/post/362713/coinbase-unveils-base-app-rebrands-wallet-as-all-in-one-social-and-trading-platform","publisher":"The Block","published_at":"2025-07-16","accessed_at":"2026-08-20","reliability":"high","claim_scope":"event","is_primary":false,"notes":"Contemporaneous dated report from the A New Day One event used only to anchor the exact 2025-07-16 announcement boundary. The continuity/rebrand claim itself is backed by Base first-party material."},
            {"id":"wlr_src_000366","entity_id":"wlr_ent_000076","product_id":"wlr_prod_000125","event_id":"wlr_ev_000140","source_type":"official_statement","title":"Classic wallet closing","url":"https://help.coinbase.com/en/wallet/other-topics/classic-wallet-closing","publisher":"Coinbase","published_at":null,"accessed_at":"2026-08-20","reliability":"high","claim_scope":"event","is_primary":true,"notes":"Coinbase Help gives the exact 2026-08-15 closure date and states that the updated wallet preserves recovery phrase, supported-network assets and addresses with nothing to transfer merely to continue."},
            {"id":"wlr_src_000367","entity_id":"wlr_ent_000076","product_id":"wlr_prod_000125","event_id":"wlr_ev_000139","source_type":"official_statement","title":"Download Base App","url":"https://www.coinbase.com/wallet/downloads","publisher":"Coinbase","published_at":null,"accessed_at":"2026-08-20","reliability":"high","claim_scope":"rebrand","is_primary":true,"notes":"Current Coinbase distribution page says Coinbase Wallet is now Base App, existing users do not need a new app, and Base App is distributed on iOS and Android. It separately exposes the Coinbase Wallet browser extension, which is outside wlr_prod_000125's mobile boundary."}
          ];
          const add=(arr,row)=>{const old=arr.find(x=>x.id===row.id);if(old&&JSON.stringify(old)!==JSON.stringify(row))throw new Error(`collision ${row.id}`);if(!old)arr.push(row)};
          E.forEach(x=>add(events,x));S.forEach(x=>add(evidence,x));
          if(events.length!==140||evidence.length!==367) throw new Error(`unexpected promoted counts events=${events.length} evidence=${evidence.length}`);
          write('data/entities.json',entities);write('data/products.json',products);write('data/events.json',events);write('data/evidence.json',evidence);
          NODE
      - name: Validate canonical and stable identity routes
        run: |
          set -euo pipefail
          npm run validate:records
          npm run validate:identity-evidence
          npm run validate:machine-records
          npm run validate:structured-discovery
          npm run validate:compare
          npm run validate:stats
          npm run coverage:audit
          npm run seed:gate
          npm run prebuild
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
          npm run build
          jq -e '.registry.entities == 100 and .registry.products == 149 and .registry.events == 140 and .registry.evidence == 367' public/data/stats.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ent_000076") | .slug == "coinbase-wallet" and .canonical_name == "Base App" and (.aliases | index("Coinbase Wallet")) != null and .status == "active"' data/entities.json >/dev/null
          jq -e '.[] | select(.id == "wlr_prod_000125") | .slug == "coinbase-wallet-mobile" and .product_name == "Base App Mobile" and (.aliases | index("Coinbase Wallet Mobile")) != null and .status == "active"' data/products.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000139") | .event_type == "rebranded" and .event_date == "2025-07-16"' data/events.json >/dev/null
          jq -e '.[] | select(.id == "wlr_ev_000140") | .event_type == "service_shutdown" and .event_date == "2026-08-15" and .event_status_effect == "active"' data/events.json >/dev/null
          test -f public/data/wallets/coinbase-wallet.json
          test -f public/data/products/coinbase-wallet-mobile.json
          test ! -f public/data/wallets/base-app.json
          test ! -f public/data/products/base-app-mobile.json
          test -f public/data/series/records/wallet--coinbase-wallet.json
          test -f public/data/series/records/product--coinbase-wallet-mobile.json
          test ! -f public/data/series/records/wallet--base-app.json
          test ! -f public/data/series/records/product--base-app-mobile.json
          jq -e '.identity.name == "Base App" and .record_key.slug == "coinbase-wallet" and .urls.human == "https://wlr.badjoke-lab.com/wallet/coinbase-wallet/"' public/data/series/records/wallet--coinbase-wallet.json >/dev/null
          jq -e '.identity.name == "Base App Mobile" and .record_key.slug == "coinbase-wallet-mobile" and .urls.human == "https://wlr.badjoke-lab.com/product/coinbase-wallet-mobile/"' public/data/series/records/product--coinbase-wallet-mobile.json >/dev/null
          grep -q 'https://wlr.badjoke-lab.com/wallet/coinbase-wallet/' out/sitemap.xml
          grep -q 'https://wlr.badjoke-lab.com/product/coinbase-wallet-mobile/' out/sitemap.xml
      - name: Commit reviewed canonical and deterministic Series edits
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/entities.json data/products.json data/events.json data/evidence.json public/data/series
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Coinbase Wallet lineage to Base App'
          git push origin HEAD:review/coinbase-base-identity-lifecycle
