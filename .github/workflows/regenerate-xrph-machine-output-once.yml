name: Regenerate XRPH machine outputs once

on:
  push:
    branches:
      - feat/xrph-wallet-winddown-20260910
    paths:
      - '.github/workflows/regenerate-xrph-machine-output-once.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/xrph-wallet-winddown-20260910
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate public machine-readable outputs
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run prebuild

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/version.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate XRPH Wallet machine-readable outputs"
          git push origin HEAD:feat/xrph-wallet-winddown-20260910
