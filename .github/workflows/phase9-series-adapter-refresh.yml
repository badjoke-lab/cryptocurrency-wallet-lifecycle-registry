name: Phase 9 Series Adapter Refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'agent/phase9-series-adapter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --progress=false
      - name: Build native machine layer
        run: npm run prebuild
      - name: Regenerate and validate Series adapter
        run: |
          node scripts/generate-series-adapter.mjs
          node scripts/validate-series-adapter.mjs
      - name: Commit synchronized Series output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/series
          if git diff --cached --quiet; then
            echo "Series output already synchronized."
          else
            git commit -m "Refresh WLR Phase 9 Series adapter output"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi
