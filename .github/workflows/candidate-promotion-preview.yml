name: Candidate promotion preview
on:
  pull_request:
    paths:
      - 'data-staging/candidates/**'
      - 'data/**'
      - 'schemas/**'
      - 'scripts/validate_candidates.py'
      - 'scripts/render_candidate_promotion.py'
      - '.github/workflows/candidate-promotion-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_candidates.py
      - run: python scripts/render_candidate_promotion.py --candidate data-staging/candidates/growth-batch-2.json --output-dir promotion-preview
      - uses: actions/upload-artifact@v4
        with:
          name: wlr-growth-batch-2-promotion-preview
          path: promotion-preview/
          if-no-files-found: error
          retention-days: 7
